@switch (status()) {
  @case ('EXITOSO') {
    <span
      class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-green-100 text-green-700 font-semibold text-xs border border-green-200 whitespace-nowrap"
    >
      <svg lucideCheckCircle [size]="12"></svg> Exitoso
    </span>
  }
  @case ('FALLIDO') {
    <span
      class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-red-100 text-red-700 font-semibold text-xs border border-red-200 whitespace-nowrap"
    >
      <svg lucideXCircle [size]="12"></svg> Fallido
    </span>
  }
  @case ('DENEGADO') {
    <span
      class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-amber-100 text-amber-700 font-semibold text-xs border border-amber-200 whitespace-nowrap"
    >
      <svg lucideBan [size]="12"></svg> Denegado
    </span>
  }
}
