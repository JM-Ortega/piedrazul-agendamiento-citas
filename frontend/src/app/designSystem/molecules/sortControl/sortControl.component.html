<div class="flex items-center gap-2">
  <!-- Selector de atributo -->
  <div class="relative">
    <select
      [value]="field()"
      (change)="onFieldChange($any($event.target).value)"
      class="appearance-none pl-3 pr-8 py-1.5 rounded-lg border border-gray-200 bg-white text-sm text-gray-700 font-medium focus:outline-none focus:ring-2 focus:ring-[#215c98]/30 focus:border-[#215c98] cursor-pointer hover:border-gray-300 transition-colors"
    >
      @for (opt of options(); track opt.value) {
        <option [value]="opt.value">{{ opt.label }}</option>
      }
    </select>
    <svg
      class="pointer-events-none absolute right-2 top-1/2 -translate-y-1/2 text-gray-400"
      width="14"
      height="14"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
    >
      <path d="M6 9l6 6 6-6" />
    </svg>
  </div>

  <!-- Botón de dirección: estado independiente -->
  <button
    type="button"
    (click)="toggleDirection()"
    class="flex items-center gap-1.5 pl-3 pr-2.5 py-1.5 rounded-lg border border-gray-200 bg-white text-sm text-gray-700 font-medium hover:border-[#215c98]/40 hover:bg-[#f8fbff] transition-colors cursor-pointer"
    [attr.aria-label]="
      direction() === 'asc'
        ? 'Cambiar a orden descendente'
        : 'Cambiar a orden ascendente'
    "
  >
    {{ direction() === 'asc' ? 'Ascendente' : 'Descendente' }}
    @if (direction() === 'asc') {
      <svg lucideArrowUp [size]="14" class="text-[#215c98]"></svg>
    } @else {
      <svg lucideArrowDown [size]="14" class="text-[#215c98]"></svg>
    }
  </button>
</div>
