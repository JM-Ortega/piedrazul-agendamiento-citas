@if (videoId()) {
  <div class="fixed bottom-6 right-6 z-40">
    @if (showPopover()) {
      <div
        class="absolute bottom-14 right-0 w-72 rounded-2xl border border-blue-100 bg-white p-5 shadow-2xl"
      >
        <button
          type="button"
          aria-label="Cerrar"
          class="absolute right-3 top-3 text-gray-300 transition-colors hover:text-gray-500 cursor-pointer"
          (click)="showPopover.set(false)"
        >
          <svg lucideX class="size-4"></svg>
        </button>
        <div class="mb-3 flex items-start gap-3">
          <div class="shrink-0 rounded-full bg-blue-100 p-2">
            <svg lucidePlayCircle class="size-5 text-blue-600"></svg>
          </div>
          <div>
            <p class="text-sm font-bold leading-tight text-gray-800">
              Video tutorial
            </p>
            <p class="mt-0.5 text-xs text-gray-400">
              Aprende a usar esta pantalla
            </p>
          </div>
        </div>
        <p class="text-sm leading-relaxed text-gray-600">
          ¿Tienes dudas? Mira un video de ayuda,
          <button
            type="button"
            (click)="openVideo()"
            class="font-bold text-blue-600 underline underline-offset-2 transition-colors hover:text-blue-800 cursor-pointer"
          >
            haz clic aquí
          </button>
        </p>
      </div>
    }
    <app-button
      variant="success"
      aria-label="Abrir ayuda"
      class="group"
      extraClass="!rounded-full font-semibold !px-3 !py-2"
      (buttonClick)="showPopover.set(!showPopover())"
    >
      <svg lucideCircleHelp class="size-[18px]"></svg>

      <span
        class="max-w-0 overflow-hidden whitespace-nowrap opacity-0 transition-all duration-300 group-hover:max-w-40 group-hover:opacity-100"
      >
        ¿Necesitas ayuda?
      </span>
    </app-button>
  </div>
}

@if (showVideo() && videoUrl(); as url) {
  @if (!expanded()) {
    <div
      #player
      class="fixed right-4 top-20 z-50 w-[min(360px,calc(100vw-2rem))] overflow-hidden rounded-2xl border border-gray-200 bg-black shadow-2xl"
      [style.transform]="
        'translate(' + offset().x + 'px, ' + offset().y + 'px)'
      "
    >
      <div
        class="flex cursor-grab touch-none select-none items-center justify-between bg-gray-900 px-3 py-2 active:cursor-grabbing"
        title="Arrastrar para mover"
        (pointerdown)="startDrag($event, player)"
        (pointermove)="onDrag($event)"
        (pointerup)="endDrag()"
        (pointercancel)="endDrag()"
      >
        <span class="truncate text-xs font-semibold text-white"
          >Video de ayuda</span
        >
        <div class="flex shrink-0 items-center gap-1">
          <button
            type="button"
            title="Ampliar"
            class="rounded p-1 text-gray-400 transition-colors hover:text-white cursor-pointer"
            (click)="expanded.set(true)"
          >
            <svg lucideMaximize2 class="size-3.5"></svg>
          </button>
          <button
            type="button"
            title="Cerrar"
            class="rounded p-1 text-gray-400 transition-colors hover:text-red-400 cursor-pointer"
            (click)="closeVideo()"
          >
            <svg lucideX class="size-3.5"></svg>
          </button>
        </div>
      </div>
      <iframe
        class="block aspect-video w-full"
        [src]="url"
        title="Video de ayuda"
        allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
        allowfullscreen
      ></iframe>
    </div>
  } @else {
    <div
      class="fixed inset-0 z-50 flex items-center justify-center bg-black/85 p-6"
      role="dialog"
      aria-modal="true"
      aria-label="Video de ayuda"
    >
      <div
        class="flex w-full max-w-4xl flex-col overflow-hidden rounded-2xl shadow-2xl"
      >
        <div class="flex items-center justify-between bg-gray-900 px-4 py-3">
          <span class="text-sm font-semibold text-white">Video de ayuda</span>
          <div class="flex items-center gap-2">
            <button
              type="button"
              class="flex items-center gap-1.5 rounded px-2 py-1 text-xs text-gray-400 transition-colors hover:text-white cursor-pointer"
              (click)="expanded.set(false)"
            >
              <svg lucideMinimize2 class="size-3.5"></svg> Minimizar
            </button>
            <button
              type="button"
              class="flex items-center gap-1.5 rounded px-2 py-1 text-xs text-gray-400 transition-colors hover:text-red-400 cursor-pointer"
              (click)="closeVideo()"
            >
              <svg lucideX class="size-3.5"></svg> Cerrar
            </button>
          </div>
        </div>
        <iframe
          class="aspect-video w-full"
          [src]="url"
          title="Video de ayuda"
          allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
          allowfullscreen
        ></iframe>
      </div>
    </div>
  }
}
