<ng-template #iconContent>
  <ng-content select="[icon]"></ng-content>
</ng-template>

@if (visible) {
  <div
    class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 px-4"
    role="presentation"
    (click)="onDismiss()"
    (keydown.escape)="onDismiss()"
  >
    <div
      [class]="'bg-white rounded-2xl shadow-2xl p-8 w-full ' + maxWidth"
      role="dialog"
      aria-modal="true"
      aria-labelledby="confirmModalTitle"
      tabindex="-1"
      (click)="$event.stopPropagation()"
      (keydown)="$event.stopPropagation()"
    >
      @if (iconPosition === 'top') {
        <div
          [class]="
            'flex items-center justify-center w-16 h-16 rounded-full mx-auto mb-5 ' +
            iconBg
          "
        >
          <ng-container [ngTemplateOutlet]="iconContent"></ng-container>
        </div>
        <h3
          id="confirmModalTitle"
          class="text-xl font-bold text-gray-800 text-center mb-2"
        >
          {{ title }}
        </h3>
      } @else {
        <div class="flex items-center gap-3 mb-4">
          <div [class]="'rounded-full p-3 ' + iconBg">
            <ng-container [ngTemplateOutlet]="iconContent"></ng-container>
          </div>
          <h3 id="confirmModalTitle" class="text-xl font-bold text-gray-800">
            {{ title }}
          </h3>
        </div>
      }
      @if (richMessage) {
        <p
          [class]="
            'text-gray-500 text-base mb-8 ' +
            (iconPosition === 'top' ? 'text-center' : '')
          "
        >
          <ng-content select="[message]"></ng-content>
        </p>
      } @else {
        <p
          [class]="
            'text-gray-500 text-base mb-8 ' +
            (iconPosition === 'top' ? 'text-center' : '')
          "
        >
          {{ message }}
        </p>
      }
      <div
        [class]="fullWidthButtons ? 'flex gap-5' : 'flex gap-5 justify-center'"
      >
        @if (showCancel) {
          <app-button
            variant="secondary"
            [class]="fullWidthButtons ? 'flex-1' : ''"
            [fullWidth]="fullWidthButtons"
            (buttonClick)="onDismiss()"
          >
            {{ cancelLabel }}
          </app-button>
        }
        <app-button
          [variant]="confirmVariant"
          [class]="fullWidthButtons ? 'flex-1' : ''"
          [fullWidth]="showCancel ? fullWidthButtons : true"
          (buttonClick)="onConfirm()"
        >
          {{ confirmLabel }}
        </app-button>
      </div>
    </div>
  </div>
}
