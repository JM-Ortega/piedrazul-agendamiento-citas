<div [class]="computedWrapperClasses">
  @if (label && !isCheckbox) {
    <label [for]="id" [class]="labelClasses">{{ label }}</label>
  }

  @if (isCheckbox) {
    <label [class]="labelClasses + ' inline-flex items-center gap-2'">
      <input
        [id]="id"
        type="checkbox"
        [checked]="!!value"
        [disabled]="disabled"
        [class]="computedInputClasses"
        (change)="handleInput($event)"
        (blur)="handleBlur($event)"
        (focus)="handleFocus($event)"
      />
      <span>{{ label }}</span>
    </label>
  }

  @if (!isCheckbox) {
    <div class="relative">
      <input
        [id]="id"
        [type]="type"
        [disabled]="disabled"
        [readOnly]="readonly"
        [attr.placeholder]="placeholder || null"
        [attr.autocomplete]="autocomplete || null"
        [attr.inputmode]="inputMode || null"
        [attr.min]="min"
        [attr.max]="max"
        [attr.step]="step"
        [attr.maxlength]="maxLength ?? null"
        [attr.minlength]="minLength ?? null"
        [attr.aria-invalid]="resolvedErrorMessage ? true : null"
        [attr.aria-describedby]="
          resolvedErrorMessage
            ? id + '-error'
            : helperText
              ? id + '-helper'
              : null
        "
        [value]="value"
        [class]="computedInputClasses"
        (input)="handleInput($event)"
        (blur)="handleBlur($event)"
        (focus)="handleFocus($event)"
      />
      <div class="absolute right-3 top-1/2 -translate-y-1/2">
        <ng-content select="[suffix]"></ng-content>
      </div>
    </div>
  }

  @if (resolvedErrorMessage) {
    <p [id]="id + '-error'" class="text-red-500 text-sm mt-1">
      {{ resolvedErrorMessage }}
    </p>
  }

  @if (!resolvedErrorMessage && helperText) {
    <p [id]="id + '-helper'" class="text-gray-500 text-sm mt-1">
      {{ helperText }}
    </p>
  }
</div>
