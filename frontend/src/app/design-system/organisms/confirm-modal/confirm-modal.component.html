@if (visible) {
  <div
    class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 px-4"
    role="presentation"
    (click)="onDismiss()"
    (keydown.escape)="onDismiss()"
  >
    <div
      [class]="'bg-white rounded-2xl shadow-2xl p-8 w-full ' + maxWidth"
      role="dialog"
      aria-modal="true"
      aria-labelledby="confirmModalTitle"
      tabindex="-1"
      (click)="$event.stopPropagation()"
      (keydown)="$event.stopPropagation()"
    >
      <div
        [class]="
          'flex items-center justify-center w-16 h-16 rounded-full mx-auto mb-5 ' +
          iconBg
        "
      >
        <ng-content select="[icon]"></ng-content>
      </div>
      <h3
        id="confirmModalTitle"
        class="text-xl font-bold text-gray-800 text-center mb-2"
      >
        {{ title }}
      </h3>
      @if (richMessage) {
        <p class="text-gray-500 text-base text-center mb-8">
          <ng-content select="[message]"></ng-content>
        </p>
      } @else {
        <p class="text-gray-500 text-base text-center mb-8">
          {{ message }}
        </p>
      }
      <div
        [class]="fullWidthButtons ? 'flex gap-5' : 'flex gap-5 justify-center'"
      >
        <app-button
          variant="secondary"
          [class]="fullWidthButtons ? 'flex-1' : ''"
          [fullWidth]="fullWidthButtons"
          (buttonClick)="onDismiss()"
        >
          {{ cancelLabel }}
        </app-button>
        <app-button
          [variant]="confirmVariant"
          [class]="fullWidthButtons ? 'flex-1' : ''"
          [fullWidth]="fullWidthButtons"
          (buttonClick)="onConfirm()"
        >
          {{ confirmLabel }}
        </app-button>
      </div>
    </div>
  </div>
}
