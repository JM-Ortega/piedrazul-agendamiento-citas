<div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
  <div>
    <label
      for="documentType"
      class="block text-gray-700 mb-1 text-sm font-medium"
    >
      Tipo de documento <span class="text-red-500">*</span>
    </label>
    <app-select
      [id]="'documentType'"
      [options]="documentTypeOptions()"
      [ngModel]="get('identificationType')"
      (valueChange)="set('identificationType', $event)"
      [errorMessage]="errors()['identificationType']"
    ></app-select>
  </div>

  <div>
    <label for="firstName" class="block text-gray-700 mb-1 text-sm font-medium">
      Nombres <span class="text-red-500">*</span>
    </label>
    <app-input
      [id]="'firstName'"
      placeholder="Nombres del paciente"
      sanitize="alphaSpaces"
      [stripAccents]="true"
      [titleCase]="true"
      [trimLeadingSpaces]="true"
      [collapseSpaces]="true"
      [maxLength]="nameMax"
      [minLength]="nameMin"
      [ngModel]="get('firstName')"
      (valueChange)="setFromInput('firstName', $event)"
      [errorMessage]="errors()['firstName']"
    ></app-input>
  </div>

  <div>
    <label for="lastName" class="block text-gray-700 mb-1 text-sm font-medium">
      Apellidos <span class="text-red-500">*</span>
    </label>
    <app-input
      [id]="'lastName'"
      placeholder="Apellidos del paciente"
      sanitize="alphaSpaces"
      [stripAccents]="true"
      [titleCase]="true"
      [trimLeadingSpaces]="true"
      [collapseSpaces]="true"
      [maxLength]="nameMax"
      [minLength]="nameMin"
      [ngModel]="get('lastName')"
      (valueChange)="setFromInput('lastName', $event)"
      [errorMessage]="errors()['lastName']"
    ></app-input>
  </div>

  <div>
    <label for="phone" class="block text-gray-700 mb-1 text-sm font-medium">
      Teléfono <span class="text-red-500">*</span>
    </label>
    <app-input
      [id]="'phone'"
      type="tel"
      placeholder="Ej: 3001234567"
      sanitize="numeric"
      [maxLength]="10"
      [ngModel]="get('phone')"
      (valueChange)="setFromInput('phone', $event)"
      [errorMessage]="errors()['phone']"
    ></app-input>
  </div>

  <div>
    <label for="sex" class="block text-gray-700 mb-1 text-sm font-medium">
      Sexo <span class="text-red-500">*</span>
    </label>
    <app-select
      [id]="'sex'"
      [options]="sexOptions"
      [ngModel]="get('sex')"
      (valueChange)="set('sex', $event)"
      [errorMessage]="errors()['sex']"
    ></app-select>
  </div>

  <div>
    <label for="birthDate" class="block text-gray-700 mb-1 text-sm font-medium">
      Fecha de nacimiento <span class="text-red-500">*</span>
    </label>
    <app-datepicker
      [id]="'birthDate'"
      [max]="maxBirthDate"
      [ngModel]="birthDateAsDate()"
      (valueChange)="onBirthDateChange($event)"
      [errorMessage]="errors()['birthDate']"
    ></app-datepicker>
  </div>

  <div class="sm:col-span-2">
    <label for="email" class="block text-gray-700 mb-1 text-sm font-medium">
      Correo electrónico <span class="text-gray-400 text-sm">(opcional)</span>
    </label>
    <app-input
      [id]="'email'"
      type="email"
      placeholder="correo@ejemplo.com"
      [maxLength]="emailMax"
      [ngModel]="get('email')"
      (valueChange)="setFromInput('email', $event)"
      [errorMessage]="errors()['email']"
    ></app-input>
  </div>

  <div class="sm:col-span-2">
    <label
      for="guardianPhone"
      class="block text-gray-700 mb-1 text-sm font-medium"
    >
      Teléfono de familiar
      @if (isMinor()) {
        <span class="text-red-500">*</span>
      } @else {
        <span class="text-gray-400 text-sm"
          >(requerido para menores de edad)</span
        >
      }
    </label>
    <app-input
      [id]="'guardianPhone'"
      type="tel"
      placeholder="Ej: 3009876543"
      sanitize="numeric"
      [maxLength]="10"
      [ngModel]="get('guardianPhone')"
      (valueChange)="setFromInput('guardianPhone', $event)"
      [errorMessage]="errors()['guardianPhone']"
    ></app-input>
  </div>
</div>
