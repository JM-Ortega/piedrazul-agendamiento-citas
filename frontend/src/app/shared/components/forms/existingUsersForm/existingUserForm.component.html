<div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
  <div>
    <label for="sex" class="block text-gray-700 mb-1 text-sm font-medium">
      Sexo <span class="text-red-500">*</span>
    </label>
    <app-select
      [id]="'sex'"
      [options]="sexOptions"
      [ngModel]="get('sex')"
      (valueChange)="set('sex', $event)"
      [errorMessage]="errors()['sex']"
    ></app-select>
  </div>

  <div>
    <label for="birthDate" class="block text-gray-700 mb-1 text-sm font-medium">
      Fecha de nacimiento <span class="text-red-500">*</span>
    </label>
    <app-datepicker
      [id]="'birthDate'"
      [max]="maxBirthDate"
      [ngModel]="birthDateAsDate()"
      (valueChange)="onBirthDateChange($event)"
      [errorMessage]="errors()['birthDate']"
    ></app-datepicker>
  </div>

  <div>
    <label
      for="guardianPhone"
      class="block text-gray-700 mb-1 text-sm font-medium"
    >
      Teléfono de familiar
      @if (isMinor()) {
        <span class="text-red-500">*</span>
      } @else {
        <span class="text-gray-400 text-sm">
          (requerido para menores de edad)
        </span>
      }
    </label>
    <app-input
      [id]="'guardianPhone'"
      type="tel"
      sanitize="numeric"
      [maxLength]="10"
      placeholder="Ej: 3009876543"
      [ngModel]="get('guardianPhone')"
      (valueChange)="setFromInput('guardianPhone', $event)"
      [errorMessage]="errors()['guardianPhone']"
    ></app-input>
  </div>
</div>
