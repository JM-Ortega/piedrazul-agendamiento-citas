<div class="min-h-screen bg-blue-50 py-8 px-6 sm:px-40">
  <app-button variant="plain" (buttonClick)="goBack()" extraClass="mb-6">
    <svg lucideArrowLeft [size]="20"></svg>Volver al inicio
  </app-button>

  <div class="max-w-3xl mx-auto">
    <div class="mb-6">
      <h1 class="text-[#215c98] text-3xl font-bold">Nueva Cita</h1>
      <p class="text-gray-500 text-lg mt-1">Agende una cita médica</p>
    </div>

    <app-appointment-booking
      context="patient"
      [patientData]="patientSnapshot()"
      [isNewPatient]="isNewPatient()"
      (goBack)="goBack()"
    ></app-appointment-booking>
  </div>
</div>
