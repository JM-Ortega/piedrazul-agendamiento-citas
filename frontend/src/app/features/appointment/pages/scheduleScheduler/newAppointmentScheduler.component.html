<div class="h-screen bg-blue-50 px-8 py-2">
  <div>
    <div class="px-2">
      @if (reschedule) {
        <h1 class="text-[#215c98] text-xl font-bold">Reagendar Cita</h1>
        <p class="text-gray-500 text-2sm">
          Seleccione los nuevos datos para la cita de
          {{ reschedule.patientName }}. La cita anterior se cancelará al
          confirmar.
        </p>
      } @else {
        <h1 class="text-[#215c98] text-xl font-bold">Nueva Cita</h1>
        <p class="text-gray-500 text-2sm">Registre una cita para un paciente</p>
      }
    </div>

    @if (!rescheduleMissing) {
      <app-appointment-booking
        context="scheduler"
        [rescheduleAppointmentId]="reschedule?.appointmentId ?? ''"
        [documentNumber]="reschedule?.documentNumber ?? ''"
        [prefillDoctorName]="reschedule?.doctorName ?? ''"
        [prefillSpecialty]="reschedule?.specialty ?? ''"
        (goBack)="goToScheduler()"
      ></app-appointment-booking>
    }
  </div>
</div>
