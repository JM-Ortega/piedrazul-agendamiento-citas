<div>
  <p class="text-gray-600 text-base mb-6">{{ state.modeSelectionLabel() }}</p>

  <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
    <app-button variant="card" (buttonClick)="selectMode('specialty')">
      <div>
        <div
          class="w-14 h-14 rounded-xl bg-blue-100 group-hover:bg-[#4e92d9] transition-colors mb-5 flex items-center justify-center"
        >
          <svg
            lucideStethoscope
            [size]="28"
            class="text-[#215c98] group-hover:text-white transition-colors"
          ></svg>
        </div>
        <h2 class="text-[#215c98] text-xl font-bold mb-2">Por Especialidad</h2>
        <p class="text-gray-500 text-sm leading-relaxed">
          Elija la especialidad. El sistema asignará el médico disponible
          automáticamente.
        </p>
        <span
          class="inline-block mt-5 text-[#215c98] font-semibold text-sm group-hover:translate-x-1 transition-transform"
        >
          Seleccionar →
        </span>
      </div>
    </app-button>

    <app-button variant="card" (buttonClick)="selectMode('specialty-doctor')">
      <div>
        <div
          class="w-14 h-14 rounded-xl bg-blue-100 group-hover:bg-[#4e92d9] transition-colors mb-5 flex items-center justify-center"
        >
          <svg
            lucideUserSearch
            [size]="28"
            class="text-[#215c98] group-hover:text-white transition-colors"
          ></svg>
        </div>
        <h2 class="text-[#215c98] text-xl font-bold mb-2">
          Por Especialidad y Médico
        </h2>
        <p class="text-gray-500 text-sm leading-relaxed">
          Elija la especialidad y luego el médico de su preferencia.
        </p>
        <span
          class="inline-block mt-5 text-[#215c98] font-semibold text-sm group-hover:translate-x-1 transition-transform"
        >
          Seleccionar →
        </span>
      </div>
    </app-button>
  </div>
</div>
