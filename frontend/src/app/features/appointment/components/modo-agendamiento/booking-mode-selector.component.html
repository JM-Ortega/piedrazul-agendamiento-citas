<div>
  <p class="text-gray-600 text-base mb-6">{{ state.modeSelectionLabel() }}</p>

  <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">

    <button
      (click)="selectMode('specialty')"
      class="bg-white rounded-2xl shadow-lg p-8 text-left border-2 border-transparent
             hover:border-[#4e92d9] hover:shadow-xl transition-all group"
    >
      <div
        class="w-14 h-14 rounded-xl bg-blue-100 group-hover:bg-[#4e92d9] transition-colors
               mb-5 flex items-center justify-center"
      >
        <svg
          lucideStethoscope
          [size]="28"
          class="text-[#215c98] group-hover:text-white transition-colors"
        ></svg>
      </div>
      <h2 class="text-[#215c98] text-xl font-bold mb-2">Por Especialidad</h2>
      <p class="text-gray-500 text-sm leading-relaxed">
        Elija la especialidad. El sistema asignará el médico disponible automáticamente.
      </p>
      <span
        class="inline-block mt-5 text-[#215c98] font-semibold text-sm
               group-hover:translate-x-1 transition-transform"
      >
        Seleccionar →
      </span>
    </button>

    <button
      (click)="selectMode('specialty-doctor')"
      class="bg-white rounded-2xl shadow-lg p-8 text-left border-2 border-transparent
             hover:border-[#4e92d9] hover:shadow-xl transition-all group"
    >
      <div
        class="w-14 h-14 rounded-xl bg-blue-100 group-hover:bg-[#4e92d9] transition-colors
               mb-5 flex items-center justify-center"
      >
        <svg
          lucideUserSearch
          [size]="28"
          class="text-[#215c98] group-hover:text-white transition-colors"
        ></svg>
      </div>
      <h2 class="text-[#215c98] text-xl font-bold mb-2">Por Especialidad y Médico</h2>
      <p class="text-gray-500 text-sm leading-relaxed">
        Elija la especialidad y luego el médico de su preferencia.
      </p>
      <span
        class="inline-block mt-5 text-[#215c98] font-semibold text-sm
               group-hover:translate-x-1 transition-transform"
      >
        Seleccionar →
      </span>
    </button>

  </div>
</div>
