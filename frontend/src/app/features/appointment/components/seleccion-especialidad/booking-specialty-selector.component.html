<!-- booking-specialty-selector.component.html -->
<div class="space-y-5">
  <h2 class="text-blue-800 text-2xl mb-4">
    {{ state.bookingMode() === 'specialty' ? 'Seleccionar Especialidad' : 'Seleccionar Especialidad y Médico' }}
  </h2>

  <!-- Selector de especialidad -->
  <div>
    <label class="block text-gray-700 mb-1">Especialidad *</label>
    <select
      [ngModel]="state.selectedSpecialty()"
      (ngModelChange)="onSpecialtyChange($event)"
      class="w-full border-2 border-blue-200 rounded-xl px-4 py-3"
    >
      <option value="">Seleccione una especialidad...</option>
      <option *ngFor="let s of state.uniqueSpecialties()" [value]="s">{{ s }}</option>
    </select>
  </div>

  <!-- Aviso sin especialidades disponibles -->
  <p
    *ngIf="state.noSpecialtyAvailable()"
    class="text-amber-600 bg-amber-50 border border-amber-200 rounded-xl px-4 py-3 text-sm"
  >
    ⚠️ {{ state.errorMessageSpecialty() }}
  </p>

  <!-- Médico asignado automáticamente (modo 'specialty') -->
  <div *ngIf="state.bookingMode() === 'specialty' && state.assignedDoctor()">
    <div class="bg-blue-50 border border-blue-200 rounded-xl p-4 flex items-center gap-3">
      <lucide-angular [img]="UserSearch" [size]="22" class="text-blue-500 shrink-0"></lucide-angular>
      <div>
        <p class="text-gray-500 text-sm">Médico asignado</p>
        <p class="text-blue-800 font-semibold">{{ state.assignedDoctor()!.name }}</p>
      </div>
    </div>
  </div>

  <!-- Selector de médico (modo 'specialty-doctor') -->
  <div *ngIf="state.bookingMode() === 'specialty-doctor' && state.doctorsBySpecialty().length > 0">
    <label class="block text-gray-700 mb-1">Médico *</label>
    <select
      [ngModel]="state.selectedDoctorId()"
      (ngModelChange)="onDoctorChange($event)"
      class="w-full border-2 border-blue-200 rounded-xl px-4 py-3"
    >
      <option value="">Seleccione un médico...</option>
      <option *ngFor="let d of state.doctorsBySpecialty()" [value]="d.id">{{ d.name }}</option>
    </select>
  </div>

  <!-- Aviso sin médicos disponibles para la especialidad -->
  <p
    *ngIf="state.noDoctorsFound()"
    class="text-amber-600 bg-amber-50 border border-amber-200 rounded-xl px-4 py-3 text-sm"
  >
    ⚠️ {{ state.errorMessageDoctors() }}
  </p>

  <!-- Navegación -->
  <div class="flex gap-4 mt-6">
    <button
      (click)="goBack()"
      class="border-2 border-gray-300 px-6 py-3 rounded-xl text-gray-600 hover:bg-gray-50 transition-colors"
    >
      ← {{ state.isSchedulerContext() ? 'Atrás' : 'Cambiar modo' }}
    </button>
    <button
      [disabled]="!state.canGoToScheduleStep()"
      (click)="goToSchedule()"
      class="flex-1 bg-blue-600 text-white py-3 rounded-xl disabled:opacity-50
             hover:bg-blue-700 transition-colors"
    >
      Seleccionar Horario →
    </button>
  </div>
</div>
