<div class="mb-8">
  <h3 class="text-gray-700 text-xl font-semibold mb-1">Roles del Usuario</h3>
  <p class="text-gray-500 text-base mb-4">
    Seleccione uno o ambos roles. Al menos uno es requerido.
  </p>
  <div class="grid grid-cols-2 gap-4">
    <!-- Médico -->
    <button
      type="button"
      (click)="roleToggled.emit('doctor')"
      [class]="
        'p-6 rounded-xl border-2 transition-all ' +
        (selectedRoles.includes('doctor')
          ? 'border-[#215c98] bg-[#d9e9f8] shadow-lg ring-2 ring-[#a7c9ec]'
          : 'border-gray-300 hover:border-[#4e92d9] bg-white')
      "
    >
      <div class="flex flex-col items-center gap-3">
        <div class="relative">
          <lucide-angular
            [img]="Stethoscope"
            [size]="40"
            [class]="
              selectedRoles.includes('doctor')
                ? 'text-[#215c98]'
                : 'text-gray-500'
            "
          ></lucide-angular>
          @if (selectedRoles.includes('doctor')) {
            <div
              class="absolute -top-2 -right-2 bg-[#215c98] text-white rounded-full w-6 h-6 flex items-center justify-center text-xs font-bold"
            >
              ✓
            </div>
          }
        </div>
        <span
          [class]="
            'text-lg font-semibold ' +
            (selectedRoles.includes('doctor')
              ? 'text-[#215c98]'
              : 'text-gray-700')
          "
        >
          Médico / Terapista
        </span>
      </div>
    </button>

    <!-- Agendador -->
    <button
      type="button"
      (click)="roleToggled.emit('scheduler')"
      [class]="
        'p-6 rounded-xl border-2 transition-all ' +
        (selectedRoles.includes('scheduler')
          ? 'border-green-600 bg-green-50 shadow-lg ring-2 ring-green-200'
          : 'border-gray-300 hover:border-green-400 bg-white')
      "
    >
      <div class="flex flex-col items-center gap-3">
        <div class="relative">
          <lucide-angular
            [img]="Calendar"
            [size]="40"
            [class]="
              selectedRoles.includes('scheduler')
                ? 'text-green-600'
                : 'text-gray-500'
            "
          ></lucide-angular>
          @if (selectedRoles.includes('scheduler')) {
            <div
              class="absolute -top-2 -right-2 bg-green-600 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs font-bold"
            >
              ✓
            </div>
          }
        </div>
        <span
          [class]="
            'text-lg font-semibold ' +
            (selectedRoles.includes('scheduler')
              ? 'text-green-700'
              : 'text-gray-700')
          "
        >
          Agendador
        </span>
      </div>
    </button>
  </div>

  @if (errorRoles) {
    <p class="mt-2 text-sm text-red-600 flex items-center gap-1">
      <lucide-angular [img]="CircleAlert" [size]="14"></lucide-angular>
      {{ errorRoles }}
    </p>
  }
</div>
