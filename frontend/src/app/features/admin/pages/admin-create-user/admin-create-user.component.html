<div class="min-h-screen bg-blue-50 py-8 px-4">
  <div class="max-w-4xl mx-auto space-y-6">
    <!-- Header -->
    <div
      class="bg-linear-to-r from-[#163c63] to-[#215c98] text-white rounded-2xl p-7 shadow-lg"
    >
      <button
        (click)="navigateBack()"
        class="flex items-center gap-2 text-white hover:text-[#a7c9ec] mb-4 text-lg cursor-pointer"
      >
        <svg lucideArrowLeft [size]="20"></svg>
        Volver a Gestión de Usuarios
      </button>
      <div class="flex items-center gap-3">
        <svg lucideUserPlus [size]="34"></svg>
        <div>
          <h1 class="text-3xl font-bold">Crear Nuevo Usuario</h1>
          <p class="text-[#a7c9ec] text-lg mt-2">
            Registre un nuevo médico y/o agendador en el sistema
          </p>
        </div>
      </div>
    </div>

    <!-- Error global -->
    @if (submitError) {
      <div
        class="bg-red-50 border-2 border-red-300 text-red-700 rounded-xl px-5 py-4 flex items-start gap-3"
      >
        <svg lucideCircleAlert [size]="20" class="shrink-0 mt-0.5"></svg>
        <p class="text-base">{{ submitError }}</p>
      </div>
    }

    <div class="bg-white rounded-2xl shadow-md p-8">
      <!-- Roles -->
      <app-create-user-roles
        id="error-anchor-roles"
        [selectedRoles]="selectedRoles"
        [errorRoles]="errors.roles"
        (roleToggled)="onRoleToggled($event)"
      />

      <!-- Información Básica -->
      <div class="space-y-6">
        <h3
          class="text-gray-700 text-xl font-semibold border-b-2 border-[#d9e9f8] pb-3"
        >
          Información Básica
        </h3>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
          <!-- Documento -->
          <div>
            <label
              for="documentId"
              class="block text-gray-700 text-base font-medium mb-2"
            >
              Documento de Identidad *
              <span class="text-sm text-gray-500">(solo dígitos)</span>
            </label>
            <app-input
              id="documentId"
              type="text"
              [inputMode]="'numeric'"
              [(ngModel)]="userForm.documentId"
              name="documentId"
              sanitize="numeric"
              [maxLength]="15"
              placeholder="1234567890"
              autocomplete="off"
              [errorMessage]="
                hasError('documentId') ? errors.documentId : undefined
              "
              (inputBlur)="validateField('documentId')"
            >
              <svg lucideCreditCard [size]="20" suffix></svg>
            </app-input>
          </div>
          <!-- Contraseña -->
          <div>
            <label
              for="password"
              class="block text-gray-700 text-base font-medium mb-2"
              >Contraseña *</label
            >
            <app-input
              id="password"
              [type]="showPassword ? 'text' : 'password'"
              [(ngModel)]="userForm.password"
              name="password"
              placeholder="Mín. 6 caracteres"
              autocomplete="new-password"
              [errorMessage]="
                hasError('password') ? errors.password : undefined
              "
              (inputBlur)="validateField('password')"
            >
              <button
                type="button"
                suffix
                (click)="showPassword = !showPassword"
                class="pointer-events-auto text-gray-400 hover:text-gray-600"
              >
                <svg
                  [lucideIcon]="showPassword ? EyeOff : Eye"
                  [size]="20"
                ></svg>
              </button>
            </app-input>
          </div>

          <!-- Nombre -->
          <div>
            <label
              for="firstName"
              class="block text-gray-700 text-base font-medium mb-2"
              >Nombre *</label
            >
            <app-input
              id="firstName"
              type="text"
              [(ngModel)]="userForm.firstName"
              name="firstName"
              placeholder="Juan"
              autocomplete="off"
              [errorMessage]="
                hasError('firstName') ? errors.firstName : undefined
              "
              (inputBlur)="validateField('firstName')"
            >
              <svg lucideUser [size]="20" suffix></svg>
            </app-input>
          </div>

          <!-- Apellido -->
          <div>
            <label
              for="lastName"
              class="block text-gray-700 text-base font-medium mb-2"
              >Apellido *</label
            >
            <app-input
              id="lastName"
              type="text"
              [(ngModel)]="userForm.lastName"
              name="lastName"
              placeholder="Pérez"
              autocomplete="off"
              [errorMessage]="
                hasError('lastName') ? errors.lastName : undefined
              "
              (inputBlur)="validateField('lastName')"
            >
              <svg lucideUser [size]="20" suffix></svg>
            </app-input>
          </div>

          <!-- Email (siempre visible) -->
          <div class="sm:col-span-2">
            <label
              for="email"
              class="block text-gray-700 text-base font-medium mb-2"
              >Correo Electrónico *</label
            >
            <app-input
              id="email"
              type="email"
              [(ngModel)]="userForm.email"
              name="email"
              placeholder="usuario@piedrazul.dev"
              autocomplete="off"
              [validateEmailFormat]="false"
              [errorMessage]="hasError('email') ? errors.email : undefined"
              (inputBlur)="validateField('email')"
            >
              <svg lucideMail [size]="20" suffix></svg>
            </app-input>
          </div>
        </div>
      </div>

      <!-- Sección Médico -->
      @if (hasDoctorRole) {
        <app-create-user-doctor-form
          [data]="doctorFormData"
          [specialtyOptions]="specialtyOptions"
          [documentTypes]="documentTypes"
          [loadingSpecialties]="loadingSpecialties"
          [loadingDocumentTypes]="loadingDocumentTypes"
          [timeOptions]="timeOptions"
          [maxInterval]="maxInterval"
          [daysOfWeek]="daysOfWeek"
          [errors]="errors"
          (dataChange)="onDoctorFormChange($event)"
          (fieldBlurred)="validateField($any($event))"
        />
      }

      <!-- Botones -->
      <div class="flex gap-4 pt-8 border-t-2 border-gray-100 mt-8">
        <div class="flex-1">
          <app-button
            variant="secondary"
            size="lg"
            [disabled]="isSubmitting"
            [fullWidth]="true"
            (buttonClick)="navigateBack()"
          >
            Cancelar
          </app-button>
        </div>
        <div class="flex-1">
          <app-button
            variant="primary"
            size="lg"
            [disabled]="isSubmitting"
            [loading]="isSubmitting"
            [fullWidth]="true"
            (buttonClick)="openConfirmModal()"
          >
            @if (isSubmitting) {
              <span
                class="w-6 h-6 border-2 border-white border-t-transparent rounded-full animate-spin"
              ></span>
              Guardando...
            } @else {
              <svg lucideUserPlus [size]="24"></svg>
              Crear Usuario
            }
          </app-button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal de confirmación -->
@if (showConfirmModal) {
  <app-create-user-confirm-modal
    [userForm]="userForm"
    [hasDoctorRole]="hasDoctorRole"
    [hasSchedulerRole]="hasSchedulerRole"
    [dayLabels]="dayLabels"
    (confirmed)="confirmAndCreate()"
    (cancelled)="closeConfirmModal()"
  />
}
