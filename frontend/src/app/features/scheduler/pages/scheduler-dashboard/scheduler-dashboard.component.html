<div class="min-h-screen bg-blue-50 py-1 px-4">
  <div class="max-w-5xl mx-auto">
    @if (errorMessage()) {
      <div
        class="bg-red-50 border border-red-200 text-red-700 rounded-xl px-4 py-1 text-sm"
      >
        ⚠️ {{ errorMessage() }}
      </div>
    }
    <div class="bg-white rounded-2xl shadow-md px-7 py-3 mt-1">
      <div>
        <app-filters-panel
          [fields]="filterFields()"
          [appliedValues]="appliedFilterValues()"
          closedHint="Toca aquí para filtrar por médico o estado"
          (apply)="onApplyFilters($event)"
        ></app-filters-panel>
      </div>
      <div class="mb-2 flex justify-between">
        <div>
          <h2 class="text-[#163c63] text-lg font-semibold">Citas de Hoy</h2>
          <p class="text-gray-500 text-sm">
            {{ formatDate(today) }}
            @if (selectedDoctor()) {
              — {{ selectedDoctor()?.name }}
            }
          </p>
        </div>
        <div>
          <app-pagination
            [pagination]="pagination()"
            (pageChange)="onPageChange($event)"
          ></app-pagination>
        </div>
      </div>
      <app-appointment-table
        view="today"
        [results]="results()"
        (cancelRequested)="requestCancelAppointment($event)"
      ></app-appointment-table>
    </div>
  </div>
</div>

<app-confirm-modal
  [visible]="showCancelModal()"
  title="¿Cancelar cita médica?"
  message="Esta acción no se puede deshacer. ¿Está seguro de que desea cancelar esta cita?"
  confirmLabel="Sí, cancelar"
  cancelLabel="Volver"
  (dismissed)="dismissCancelModal()"
  (confirmed)="confirmCancelAppointment()"
>
  <svg icon lucideX [size]="32" class="text-red-500"></svg>
</app-confirm-modal>

<app-toast [message]="toastMessage()" [type]="toastType()"></app-toast>
