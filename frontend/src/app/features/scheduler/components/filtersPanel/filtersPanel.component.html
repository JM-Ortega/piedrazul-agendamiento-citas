<div
  id="filters-panel"
  class="bg-white rounded-xl shadow-md mb-3.5 overflow-hidden"
>
  <button
    type="button"
    (click)="toggleFilters()"
    [attr.aria-expanded]="filtersOpen()"
    class="w-full flex items-center justify-between gap-3 px-5 py-1 hover:bg-blue-50/60 active:bg-blue-50 transition-colors cursor-pointer text-left"
  >
    <div class="flex items-center gap-3">
      <div class="bg-blue-100 rounded-full p-2 shrink-0">
        <svg lucideFilter [size]="20" class="text-[#215c98]"></svg>
      </div>
      <div>
        <h2
          class="text-[#163c63] text-2sm font-semibold flex items-center gap-2 flex-wrap"
        >
          Filtros
          @if (hasActiveFilters()) {
            <span
              class="bg-[#215c98] text-white text-sm font-semibold px-2.5 py-0.5 rounded-full"
            >
              {{ activeFilterCount() }} activo{{
                activeFilterCount() > 1 ? 's' : ''
              }}
            </span>
          }
        </h2>
        <p class="text-gray-500 text-sm">
          {{
            filtersOpen()
              ? 'Selecciona los filtros y aplica los cambios'
              : 'Toca aquí para filtrar por médico, fecha o estado'
          }}
        </p>
      </div>
    </div>
    <svg
      lucideChevronDown
      [size]="26"
      [class]="
        'text-[#215c98] shrink-0 transition-transform duration-300 ease-in-out ' +
        (filtersOpen() ? 'rotate-180' : '')
      "
    ></svg>
  </button>

  <div
    [class]="
      'grid transition-[grid-template-rows] duration-300 ease-in-out ' +
      (filtersOpen() ? 'grid-rows-[1fr]' : 'grid-rows-[0fr]')
    "
  >
    <div class="overflow-hidden">
      <div class="px-5 pb-5 pt-1 border-t-2 border-blue-50">
        <app-filters
          [fields]="fields()"
          [appliedValues]="appliedValues()"
          (apply)="onFiltersApply($event)"
        ></app-filters>
      </div>
    </div>
  </div>
</div>
