<div class="min-h-screen bg-blue-50 py-4 px-4">
  <div class="max-w-7xl mx-auto space-y-6">
    <div class="bg-white rounded-2xl shadow-md p-6">
      <div class="flex items-center gap-3 mb-5">
        <svg lucideFileText [size]="24" class="text-[#163c63]"></svg>
        <div>
          <h2 class="text-xl font-bold text-[#163c63]">
            Auditoría de Control Médico
          </h2>
          <p class="text-gray-500 text-sm">
            Registro y modificación de controles médicos
          </p>
        </div>
        <span
          class="ml-auto text-sm text-gray-400 bg-gray-100 px-3 py-1 rounded-full font-medium"
        >
          {{ rows().length }} registro{{ rows().length !== 1 ? 's' : '' }}
        </span>
      </div>

      <app-audit-filter-bar
        [filters]="filters()"
        (filtersChange)="filters.set($event)"
      />

      <app-audit-table
        [rows]="rows()"
        headClass="bg-teal-50"
        headTextClass="text-teal-800"
      />
    </div>

    <div
      class="bg-blue-50 border border-blue-200 rounded-xl p-4 flex items-start gap-3"
    >
      <svg lucideShield [size]="18" class="text-blue-600 shrink-0 mt-0.5"></svg>
      <p class="text-sm text-blue-800">
        <span class="font-semibold">Información confidencial.</span>
        Los registros de auditoría son de acceso restringido y solo para fines
        de control interno.
      </p>
    </div>
  </div>
</div>
