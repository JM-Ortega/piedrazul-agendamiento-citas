<div class="min-h-screen bg-blue-50 py-4 px-4">
  <div class="max-w-7xl mx-auto space-y-6">
    @if (errorMessage()) {
      <div
        class="bg-red-50 border border-red-200 text-red-700 rounded-xl px-4 py-2 text-sm"
      >
        ⚠️ {{ errorMessage() }}
      </div>
    }

    <div class="bg-white rounded-2xl shadow-md p-6">
      <div class="flex items-center gap-3 mb-5">
        <svg lucideUsers [size]="24" class="text-[#163c63]"></svg>
        <div>
          <h2 class="text-xl font-bold text-[#163c63]">
            Auditoría de Usuarios
          </h2>
          <p class="text-gray-500 text-sm">
            Creación, cambios y desactivaciones
          </p>
        </div>
        <div class="ml-auto">
          <app-pagination
            [pagination]="pagination()"
            (pageChange)="onPageChange($event)"
          ></app-pagination>
        </div>
      </div>

      <app-audit-filter-bar
        [catalog]="catalog()"
        (apply)="onApplyFilters($event)"
      ></app-audit-filter-bar>

      <app-audit-table
        [rows]="events()"
        [actionNames]="actionNames()"
        headClass="bg-purple-50"
        headTextClass="text-purple-800"
      ></app-audit-table>
    </div>

    <div
      class="bg-blue-50 border border-blue-200 rounded-xl p-4 flex items-start gap-3"
    >
      <svg lucideShield [size]="18" class="text-blue-600 shrink-0 mt-0.5"></svg>
      <p class="text-sm text-blue-800">
        <span class="font-semibold">Información confidencial.</span>
        Los registros de auditoría son de acceso restringido y solo para fines
        de control interno.
      </p>
    </div>
  </div>
</div>
