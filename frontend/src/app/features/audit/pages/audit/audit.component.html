<div class="min-h-screen bg-blue-50 py-4 px-4">
  <div class="max-w-7xl mx-auto space-y-6">
    @if (errorMessage()) {
      <div
        class="bg-red-50 border border-red-200 text-red-700 rounded-xl px-4 py-2 text-sm"
      >
        ⚠️ {{ errorMessage() }}
      </div>
    }

    <div class="bg-white rounded-2xl shadow-md p-6">
      <div class="flex items-center gap-3 mb-5">
        <svg lucideShield [size]="24" class="text-[#163c63]"></svg>
        <div>
          <h2 class="text-xl font-bold text-[#163c63]">
            Auditoría del Sistema
          </h2>
          <p class="text-gray-500 text-sm">
            Control y trazabilidad de acciones sobre citas, usuarios e historias
            clínicas
          </p>
        </div>
      </div>

      <app-audit-filter-bar
        [catalog]="catalog()"
        (apply)="onApplyFilters($event)"
      ></app-audit-filter-bar>

      <div class="w-full flex justify-end">
        <app-pagination
          [pagination]="pagination()"
          (pageChange)="onPageChange($event)"
        ></app-pagination>
      </div>

      <app-audit-table
        [rows]="events()"
        [actionNames]="actionNames()"
        headClass="bg-blue-50"
        headTextClass="text-blue-800"
      ></app-audit-table>
    </div>
  </div>
</div>
