<div class="flex items-center justify-between flex-wrap mb-2">
  <h5 class="flex items-center gap-2 text-2sm font-semibold text-[#163c63]">
    <svg lucideFolderOpen [size]="28" class="text-[#163c63]"></svg>
    Historial de Consultas
  </h5>
  <app-pagination
    [pagination]="pagination()"
    (pageChange)="pageChange.emit($event)"
  ></app-pagination>
</div>
@if (records().length === 0) {
  <div
    class="bg-blue-50 border border-blue-200 text-[#215c98] px-4 py-3 rounded-xl"
  >
    Sin registros clínicos.
  </div>
}
@for (r of records(); track r.idClinicalHistory) {
  <div class="bg-white rounded-2xl shadow-md px-6 py-2 mb-2">
    <div
      class="flex items-center justify-between flex-wrap gap-2 pb-1 mb-2 border-b border-gray-100"
    >
      <span class="flex items-center gap-2 text-gray-700 text-sm">
        <svg lucideCalendar [size]="20" class="text-[#163c63]"></svg>
        <strong class="text-[#163c63]">Fecha:</strong>
        {{ r.attendedAt }}
      </span>
      <span class="flex items-center gap-2 text-gray-700 text-sm">
        <strong class="text-[#163c63]">Médico:</strong>
        {{ r.doctorName }}
      </span>
    </div>
    <p class="text-gray-700 leading-relaxed">{{ r.description }}</p>
  </div>
}
@if (loading()) {
  <p class="text-sm text-gray-400 text-center mt-2">Cargando...</p>
}
