<div class="min-h-screen bg-blue-50 py-3 px-6">
  <div>
    <div class="mb-3">
      <div class="bg-amber-100 rounded-xl p-2 shrink-0 flex items-center gap-2">
        <svg lucideAlertTriangle [size]="20" class="text-amber-600"></svg>
        <div class="flex-1 min-w-0">
          <p class="font-bold text-amber-900 text-base leading-tight">
            Paciente no encontrado — registrar
          </p>
          <p class="text-amber-700 text-xs">
            Complete los datos del paciente y registre la atención.
          </p>
        </div>
      </div>
    </div>

    <div class="flex flex-col lg:flex-row gap-6">
      <div class="w-full lg:w-2/3 bg-white rounded-2xl shadow-md p-6">
        <app-patient-data-form
          #patientForm
          [showDocumentNumber]="true"
          [maxBirthDate]="maxBirthDate"
          [ngModel]="patientFormValue()"
          (valueChange)="onPatientFormChange($event)"
        ></app-patient-data-form>
      </div>

      <div class="w-full lg:w-1/3">
        <div class="bg-white rounded-2xl shadow-md p-6 mb-2">
          <label
            for="specialty"
            class="block text-gray-700 mb-1 text-sm font-medium"
          >
            Tipo de atención <span class="text-red-500">*</span>
          </label>
          <app-select
            [id]="'specialty'"
            [options]="specialtyOptions"
            [ngModel]="selectedSpecialty()"
            (valueChange)="onSpecialtyChange($event)"
            [errorMessage]="specialtyError()"
          ></app-select>
        </div>

        <div class="bg-white rounded-2xl shadow-md p-6">
          <label
            for="observation"
            class="block text-gray-700 mb-1 text-sm font-medium"
          >
            Observación del control clínico
          </label>
          <textarea
            id="observation"
            [value]="observation()"
            (input)="onObservationChange($any($event.target).value)"
            rows="6"
            [maxLength]="observationMaxLength"
            placeholder="Escriba las observaciones de la consulta..."
            class="w-full border-2 border-[#d9e9f8] focus:border-[#a7c9ec] rounded-xl px-4 py-3 outline-none transition-colors resize-none"
          ></textarea>
          <p class="text-sm text-gray-500 text-right">
            {{ remainingObservationChars() }} caracteres restantes
          </p>
        </div>
      </div>
    </div>

    @if (saveError()) {
      <div
        class="mt-4 bg-red-50 border border-red-300 text-red-700 px-4 py-3 rounded-xl"
      >
        ⚠️ {{ saveError() }}
      </div>
    }

    <div class="flex gap-4 mt-3">
      <app-button variant="secondary" (buttonClick)="onGoBack()">
        <svg lucideArrowLeft [size]="16"></svg> Buscar de nuevo
      </app-button>
      <app-button
        variant="primary"
        [disabled]="isSaving()"
        [fullWidth]="true"
        class="flex-1"
        (buttonClick)="onSave(patientForm)"
      >
        @if (isSaving()) {
          Guardando...
        } @else {
          <svg lucideSave [size]="18"></svg> Guardar atención
        }
      </app-button>
    </div>
  </div>
</div>

<app-confirm-modal
  [visible]="showExistsModal()"
  title="Este documento ya existe"
  [message]="
    'El paciente con el documento ' +
    existingDocument() +
    ' ya existe en el sistema. Será redirigido al paso de búsqueda para mostrar su información.'
  "
  confirmLabel="Aceptar"
  cancelLabel="Cancelar"
  confirmVariant="primary"
  (dismissed)="dismissExistsModal()"
  (confirmed)="confirmExistingDocument()"
>
  <svg icon lucideAlertCircle [size]="32" class="text-amber-500"></svg>
</app-confirm-modal>
