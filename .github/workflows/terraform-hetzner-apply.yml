name: Terraform — Hetzner Apply

on:
  push:
    branches:
      - main
    paths:
      - "infra/terraform/live/prod/**"
      - "infra/terraform/modules/hetzner/**"
      - "infra/terraform/modules/cloudflare/**"
      - ".github/workflows/terraform-hetzner-*.yml"
  workflow_dispatch:

concurrency:
  group: piedrazul-production-hetzner
  cancel-in-progress: false

env:
  TF_CLOUD_ORGANIZATION: "Piedrazul"
  TF_API_TOKEN: "${{ secrets.TF_API_TOKEN }}"
  TF_WORKSPACE: "piedrazul-hetzner"
  CONFIG_DIRECTORY: "infra/terraform"

jobs:
  apply:
    name: Apply — Hetzner
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: production-hetzner

    steps:
      - uses: actions/checkout@v4

      - name: Upload configuration
        uses: hashicorp/tfc-workflows-github/actions/upload-configuration@v1.3.2
        id: upload
        with:
          workspace: ${{ env.TF_WORKSPACE }}
          directory: ${{ env.CONFIG_DIRECTORY }}

      - name: Create apply run
        uses: hashicorp/tfc-workflows-github/actions/create-run@v1.3.2
        id: run
        continue-on-error: true
        with:
          workspace: ${{ env.TF_WORKSPACE }}
          configuration_version: ${{ steps.upload.outputs.configuration_version_id }}
          message: "Apply — merge a main ${{ github.sha }}"

      - name: Apply run
        uses: hashicorp/tfc-workflows-github/actions/apply-run@v1.3.2
        if: fromJSON(steps.run.outputs.payload).data.attributes.actions.is-confirmable
        id: apply
        continue-on-error: true
        with:
          run: ${{ steps.run.outputs.run_id }}
          comment: "Apply desde GitHub Actions — commit ${{ github.sha }}"

      - name: Fail if apply did not finish cleanly
        if: |
          steps.run.outputs.run_status != 'applied' &&
          steps.run.outputs.run_status != 'planned_and_finished'
        run: |
          echo "HCP Terraform apply did not finish cleanly"
          echo "Status: ${{ steps.run.outputs.run_status }}"
          echo "${{ steps.run.outputs.run_link }}"
          exit 1
