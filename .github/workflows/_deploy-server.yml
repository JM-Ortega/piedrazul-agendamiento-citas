name: Deploy — Servidor (reusable)

on:
  workflow_call:
    inputs:
      workspace_id:
        description: "ID del workspace de HCP Terraform"
        type: string
        required: true
      ansible_host:
        description: "Nombre del host en el inventario de Ansible (vps o vps_oci)"
        type: string
        required: true
      github_environment:
        description: "Environment de GitHub para el deployment"
        type: string
        required: true
      run_host_config:
        description: "Correr configuración del servidor (common, docker, hardening)"
        type: boolean
        default: false
      run_build:
        description: "Construir nueva imagen del backend"
        type: boolean
        default: false
      run_build_postgres:
        description: "Construir nueva imagen de postgres"
        type: boolean
        default: false
      run_app_deploy:
        description: "Desplegar aplicación"
        type: boolean
        default: false
      image_tag:
        description: "Tag explícito de imagen backend para rollback (vacío = imagen construida si run_build=true, si no el último deploy exitoso del servidor)"
        type: string
        default: ""
      force_init_keycloak:
        description: "Forzar re-inicialización de Keycloak (borra marker)"
        type: boolean
        default: false
      kc_realm:
        description: "Realm de Keycloak para health check"
        type: string
        default: "piedrazul"
    secrets:
      TF_API_TOKEN:
        required: true
      ANSIBLE_SSH_KEY:
        required: true
      DB_PASSWORD:
        required: true
      KC_DB_PASSWORD:
        required: true
      KC_BOOTSTRAP_ADMIN_PASSWORD:
        required: true
      KC_ADMIN_PASSWORD:
        required: true
      CLOUDFLARE_DNS_API_TOKEN:
        required: true
      IDENTITY_SEED_ADMIN_PASSWORD:
        required: true
      KC_BACKEND_CLIENT_SECRET:
        required: true
      KC_AUTOMATION_CLIENT_SECRET:
        required: true
      PIEDRAZUL_BACKEND_MAIL_SEND:
        required: true
      NOTIFICATION_ENCRYPTION_KEY:
        required: true

concurrency:
  group: deploy-${{ inputs.github_environment }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: jm-ortega/piedrazul-agendamiento-citas/backend
  POSTGRES_IMAGE_NAME: jm-ortega/piedrazul-agendamiento-citas/postgres

jobs:
  validate_inputs:
    name: Validar inputs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      rollback_image_index_digest: ${{ steps.rollback.outputs.image_index_digest }}
      rollback_image_amd64_digest: ${{ steps.rollback.outputs.image_amd64_digest }}
      rollback_image_ref: ${{ steps.rollback.outputs.image_ref }}
    steps:
      - name: Verificar combinaciones inválidas
        env:
          ROLLBACK_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail

          if [ "${{ inputs.run_host_config }}" = "false" ] && \
             [ "${{ inputs.run_build }}" = "false" ] && \
             [ "${{ inputs.run_build_postgres }}" = "false" ] && \
             [ "${{ inputs.run_app_deploy }}" = "false" ]; then
            echo "Error: todos los flags están en false — no hay nada que hacer"
            exit 1
          fi

          if [ "${{ inputs.run_build }}" = "true" ] && \
             [ -n "${ROLLBACK_IMAGE_TAG}" ]; then
            echo "Error: no se puede especificar image_tag cuando run_build=true"
            exit 1
          fi

          if [ -n "${ROLLBACK_IMAGE_TAG}" ]; then
            if [ "${{ inputs.run_app_deploy }}" != "true" ]; then
              echo "Error: image_tag solo tiene efecto con run_app_deploy=true"
              exit 1
            fi
            if ! [[ "${ROLLBACK_IMAGE_TAG}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] || \
               [[ "${ROLLBACK_IMAGE_TAG,,}" =~ ^(none|null|undefined|latest)$ ]]; then
              echo "Error: image_tag '${ROLLBACK_IMAGE_TAG}' no es un tag OCI explícito válido"
              exit 1
            fi
          fi

          if [ "${{ inputs.ansible_host }}" != "vps" ] && \
             [ "${{ inputs.ansible_host }}" != "vps_oci" ]; then
            echo "Error: ansible_host debe ser 'vps' o 'vps_oci', recibido: ${{ inputs.ansible_host }}"
            exit 1
          fi

      - name: Checkout
        if: |
          inputs.run_app_deploy == true &&
          inputs.run_build == false &&
          inputs.image_tag != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Login a GHCR
        if: |
          inputs.run_app_deploy == true &&
          inputs.run_build == false &&
          inputs.image_tag != ''
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Única lectura del tag de rollback: verifica que exista en GHCR y fija su
      # índice OCI y su manifiesto linux/amd64. Después solo se usan esos digests.
      - name: Verificar image_tag en GHCR y resolver su identidad inmutable
        id: rollback
        if: |
          inputs.run_app_deploy == true &&
          inputs.run_build == false &&
          inputs.image_tag != ''
        env:
          ROLLBACK_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}
        run: |
          set -euo pipefail

          if ! IDENTITY=$(.github/scripts/resolve-amd64-image.sh "${ROLLBACK_IMAGE}"); then
            echo "Error: imagen ${ROLLBACK_IMAGE} no existe, no es accesible en GHCR o no tiene una identidad linux/amd64 única"
            exit 1
          fi

          echo "${IDENTITY}" >> "$GITHUB_OUTPUT"
          echo "Imagen ${ROLLBACK_IMAGE} verificada"
          echo "${IDENTITY}"

  infra:
    name: Obtener infraestructura
    runs-on: ubuntu-latest
    needs: validate_inputs
    outputs:
      server_ip: ${{ steps.tf_outputs.outputs.server_ip }}
      api_fqdn: ${{ steps.tf_outputs.outputs.api_fqdn }}
      auth_fqdn: ${{ steps.tf_outputs.outputs.auth_fqdn }}
    steps:
      - name: Esperar a que Terraform no esté en curso
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            RESPONSE=$(curl -sf \
              -H "Authorization: Bearer ${{ secrets.TF_API_TOKEN }}" \
              -H "Content-Type: application/vnd.api+json" \
              "https://app.terraform.io/api/v2/workspaces/${{ inputs.workspace_id }}/runs?page%5Bsize%5D=1")

            STATUS=$(echo "$RESPONSE" | jq -r '.data[0].attributes.status // "none"')

            case "$STATUS" in
              applied|planned_and_finished|discarded|canceled|force_canceled|none)
                echo "Terraform libre (status: ${STATUS}) — procediendo"
                exit 0
                ;;
              errored|policy_soft_failed)
                echo "Error: último run de Terraform terminó mal (status: ${STATUS})"
                exit 1
                ;;
              *)
                echo "Terraform no está libre todavía (status: ${STATUS}) — esperando 15s... ($i/30)"
                sleep 15
                ;;
            esac
          done
          echo "Error: Terraform no liberó el workspace después de 7.5 minutos"
          exit 1

      - name: Obtener outputs del workspace de Terraform
        id: tf_outputs
        run: |
          set -euo pipefail

          RESPONSE=$(curl -sf \
            -H "Authorization: Bearer ${{ secrets.TF_API_TOKEN }}" \
            -H "Content-Type: application/vnd.api+json" \
            "https://app.terraform.io/api/v2/workspaces/${{ inputs.workspace_id }}/current-state-version-outputs")

          SERVER_IP=$(echo "$RESPONSE" | \
            jq -r '.data[] | select(.attributes.name=="server_ip") | .attributes.value')
          API_FQDN=$(echo "$RESPONSE" | \
            jq -r '.data[] | select(.attributes.name=="api_fqdn") | .attributes.value')
          AUTH_FQDN=$(echo "$RESPONSE" | \
            jq -r '.data[] | select(.attributes.name=="auth_fqdn") | .attributes.value')

          if [ -z "$SERVER_IP" ] || [ "$SERVER_IP" = "null" ]; then
            echo "Error: no se pudo obtener server_ip"
            exit 1
          fi
          if [ -z "$API_FQDN" ] || [ "$API_FQDN" = "null" ]; then
            echo "Error: no se pudo obtener api_fqdn"
            exit 1
          fi
          if [ -z "$AUTH_FQDN" ] || [ "$AUTH_FQDN" = "null" ]; then
            echo "Error: no se pudo obtener auth_fqdn"
            exit 1
          fi

          echo "server_ip=${SERVER_IP}" >> $GITHUB_OUTPUT
          echo "api_fqdn=${API_FQDN}" >> $GITHUB_OUTPUT
          echo "auth_fqdn=${AUTH_FQDN}" >> $GITHUB_OUTPUT
          echo "Servidor: ${SERVER_IP} | API: ${API_FQDN} | Auth: ${AUTH_FQDN}"

  inventory:
    name: Generar inventario
    runs-on: ubuntu-latest
    needs: infra
    steps:
      - name: Generar hosts.runtime.yml
        run: |
          set -euo pipefail
          printf 'all:\n  hosts:\n    %s:\n      ansible_host: %s\n' \
            "${{ inputs.ansible_host }}" \
            "${{ needs.infra.outputs.server_ip }}" \
            > hosts.runtime.yml
          cat hosts.runtime.yml

      - name: Subir inventario como artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hosts-runtime-${{ github.run_id }}
          path: hosts.runtime.yml
          retention-days: 1

  readiness:
    name: Verificar SSH
    runs-on: ubuntu-latest
    needs: infra
    timeout-minutes: 10
    steps:
      - name: Configurar clave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ANSIBLE_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Esperar SSH en el servidor
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if ssh -o StrictHostKeyChecking=no \
                   -o ConnectTimeout=5 \
                   -o BatchMode=yes \
                   -i ~/.ssh/id_ed25519 \
                   ansible@${{ needs.infra.outputs.server_ip }} true 2>/dev/null; then
              echo "SSH disponible"
              exit 0
            fi
            echo "Intento $i/30 — esperando 10s..."
            sleep 10
          done
          echo "Error: SSH no disponible después de 5 minutos"
          exit 1

  app_build:
    name: Build imagen backend
    runs-on: ubuntu-latest
    needs: validate_inputs
    if: inputs.run_build == true
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.tag.outputs.value }}
      image_index_digest: ${{ steps.identity.outputs.image_index_digest }}
      image_amd64_digest: ${{ steps.identity.outputs.image_amd64_digest }}
      image_ref: ${{ steps.identity.outputs.image_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Generar IMAGE_TAG
        id: tag
        run: |
          set -euo pipefail
          echo "value=$(echo ${{ github.sha }} | cut -c1-10)" >> $GITHUB_OUTPUT

      - name: Configurar QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login a GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push imagen multi-arch
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: backend/
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # El índice se lee por el digest que devolvió este mismo push; el tag no se vuelve a resolver
      - name: Resolver identidad inmutable linux/amd64
        id: identity
        env:
          BUILT_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          IDENTITY=$(.github/scripts/resolve-amd64-image.sh "${BUILT_IMAGE}")
          echo "${IDENTITY}" >> "$GITHUB_OUTPUT"
          echo "${IDENTITY}"

  postgres_build:
    name: Build imagen postgres
    runs-on: ubuntu-latest
    needs: validate_inputs
    if: inputs.run_build_postgres == true
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.tag.outputs.value }}
      image_index_digest: ${{ steps.identity.outputs.image_index_digest }}
      image_amd64_digest: ${{ steps.identity.outputs.image_amd64_digest }}
      image_ref: ${{ steps.identity.outputs.image_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Generar POSTGRES_IMAGE_TAG
        id: tag
        run: |
          set -euo pipefail
          echo "value=$(echo ${{ github.sha }} | cut -c1-10)" >> $GITHUB_OUTPUT

      - name: Configurar QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login a GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push imagen multi-arch
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: infra/postgres/
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.POSTGRES_IMAGE_NAME }}:${{ steps.tag.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # El índice se lee por el digest que devolvió este mismo push; el tag no se vuelve a resolver
      - name: Resolver identidad inmutable linux/amd64
        id: identity
        env:
          BUILT_IMAGE: ${{ env.REGISTRY }}/${{ env.POSTGRES_IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          IDENTITY=$(.github/scripts/resolve-amd64-image.sh "${BUILT_IMAGE}")
          echo "${IDENTITY}" >> "$GITHUB_OUTPUT"
          echo "${IDENTITY}"

  # Única fuente de la identidad de imagen backend que reciben converge y deploy.
  # Precedencia: rollback explícito > imagen construida en este run > reuso del
  # último deploy exitoso registrado en el servidor (vacío; Ansible lo lee, valida
  # y verifica que la imagen exista).
  # Para build y rollback también arrastra la identidad inmutable ya resuelta
  # (índice OCI + manifiesto linux/amd64); en reuso esa identidad vive en el servidor.
  select_backend_image:
    name: Seleccionar imagen backend
    runs-on: ubuntu-latest
    needs: [validate_inputs, app_build]
    if: |
      always() &&
      needs.validate_inputs.result == 'success' &&
      (needs.app_build.result == 'success' || needs.app_build.result == 'skipped')
    outputs:
      image_source: ${{ steps.select.outputs.image_source }}
      image_tag: ${{ steps.select.outputs.image_tag }}
      image_index_digest: ${{ steps.select.outputs.image_index_digest }}
      image_amd64_digest: ${{ steps.select.outputs.image_amd64_digest }}
      image_ref: ${{ steps.select.outputs.image_ref }}
    steps:
      - name: Resolver IMAGE_TAG
        id: select
        env:
          RUN_APP_DEPLOY: ${{ inputs.run_app_deploy }}
          RUN_BUILD: ${{ inputs.run_build }}
          ROLLBACK_IMAGE_TAG: ${{ inputs.image_tag }}
          ROLLBACK_INDEX_DIGEST: ${{ needs.validate_inputs.outputs.rollback_image_index_digest }}
          ROLLBACK_AMD64_DIGEST: ${{ needs.validate_inputs.outputs.rollback_image_amd64_digest }}
          ROLLBACK_IMAGE_REF: ${{ needs.validate_inputs.outputs.rollback_image_ref }}
          BUILT_IMAGE_TAG: ${{ needs.app_build.outputs.image_tag }}
          BUILT_INDEX_DIGEST: ${{ needs.app_build.outputs.image_index_digest }}
          BUILT_AMD64_DIGEST: ${{ needs.app_build.outputs.image_amd64_digest }}
          BUILT_IMAGE_REF: ${{ needs.app_build.outputs.image_ref }}
        run: |
          set -euo pipefail

          INDEX_DIGEST=""
          AMD64_DIGEST=""
          IMAGE_REF=""

          # Sin deploy de app, converge conserva la identidad que ya corre en el servidor
          if [ "${RUN_APP_DEPLOY}" != "true" ]; then
            SOURCE="reuso"
            TAG=""
          elif [ -n "${ROLLBACK_IMAGE_TAG}" ]; then
            SOURCE="rollback"
            TAG="${ROLLBACK_IMAGE_TAG}"
            INDEX_DIGEST="${ROLLBACK_INDEX_DIGEST}"
            AMD64_DIGEST="${ROLLBACK_AMD64_DIGEST}"
            IMAGE_REF="${ROLLBACK_IMAGE_REF}"
          elif [ "${RUN_BUILD}" = "true" ]; then
            SOURCE="build"
            TAG="${BUILT_IMAGE_TAG}"
            INDEX_DIGEST="${BUILT_INDEX_DIGEST}"
            AMD64_DIGEST="${BUILT_AMD64_DIGEST}"
            IMAGE_REF="${BUILT_IMAGE_REF}"
            if [ -z "${TAG}" ]; then
              echo "Error: run_build=true pero app_build no produjo image_tag"
              exit 1
            fi
          else
            SOURCE="reuso"
            TAG=""
          fi

          # Build y rollback ya resolvieron su identidad inmutable una sola vez; aquí solo se arrastra
          if [ "${SOURCE}" != "reuso" ]; then
            if ! [[ "${INDEX_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]] || \
               ! [[ "${AMD64_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]] || \
               [ "${IMAGE_REF}" != "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${AMD64_DIGEST}" ]; then
              echo "Error: la imagen backend (${SOURCE}) no tiene una identidad inmutable linux/amd64 válida"
              exit 1
            fi
          fi

          if [ -n "${TAG}" ]; then
            if ! [[ "${TAG}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] || \
               [[ "${TAG,,}" =~ ^(none|null|undefined|latest)$ ]]; then
              echo "Error: image_tag '${TAG}' (${SOURCE}) no es un tag OCI explícito válido"
              exit 1
            fi
          fi

          {
            echo "image_source=${SOURCE}"
            echo "image_tag=${TAG}"
            echo "image_index_digest=${INDEX_DIGEST}"
            echo "image_amd64_digest=${AMD64_DIGEST}"
            echo "image_ref=${IMAGE_REF}"
          } >> "$GITHUB_OUTPUT"
          echo "Imagen backend seleccionada (${SOURCE}): ${TAG:-<identidad actual del servidor>} ${IMAGE_REF}"

  host_config:
    name: Configurar servidor
    runs-on: ubuntu-latest
    needs: [infra, inventory, readiness, postgres_build, select_backend_image]
    if: |
      always() &&
      inputs.run_host_config == true &&
      needs.infra.result == 'success' &&
      needs.inventory.result == 'success' &&
      needs.readiness.result == 'success' &&
      needs.select_backend_image.result == 'success' &&
      (needs.postgres_build.result == 'success' || needs.postgres_build.result == 'skipped')
    timeout-minutes: 30
    environment: ${{ inputs.github_environment }}
    env:
      ANSIBLE_CONFIG: infra/ansible/ansible.cfg
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configurar clave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ANSIBLE_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Descargar inventario
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hosts-runtime-${{ github.run_id }}

      - name: Instalar colecciones de Ansible
        run: |
          set -euo pipefail
          ansible-galaxy collection install \
            -r infra/ansible/requirements.yml \
            -p infra/ansible/collections

      - name: Borrar marker de Keycloak
        if: inputs.force_init_keycloak == true
        run: |
          set -euo pipefail
          ansible ${{ inputs.ansible_host }} \
            -i infra/ansible/inventories/prod \
            -i hosts.runtime.yml \
            -m file \
            -a "path=/opt/piedrazul/.keycloak_initialized state=absent" \
            --become
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"

      - name: Correr converge
        run: |
          set -euo pipefail
          ansible-playbook \
            -i infra/ansible/inventories/prod \
            -i hosts.runtime.yml \
            -e "image_tag=${IMAGE_TAG}" \
            -e "postgres_image_tag=${POSTGRES_IMAGE_TAG}" \
            infra/ansible/playbooks/converge.yml
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          IMAGE_TAG: ${{ needs.select_backend_image.outputs.image_tag }}
          POSTGRES_IMAGE_TAG: ${{ needs.postgres_build.outputs.image_tag }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          KC_DB_PASSWORD: ${{ secrets.KC_DB_PASSWORD }}
          KC_BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.KC_BOOTSTRAP_ADMIN_PASSWORD }}
          KC_ADMIN_PASSWORD: ${{ secrets.KC_ADMIN_PASSWORD }}
          CLOUDFLARE_DNS_API_TOKEN: ${{ secrets.CLOUDFLARE_DNS_API_TOKEN }}
          KC_BACKEND_CLIENT_SECRET: ${{ secrets.KC_BACKEND_CLIENT_SECRET }}
          KC_AUTOMATION_CLIENT_SECRET: ${{ secrets.KC_AUTOMATION_CLIENT_SECRET }}
          IDENTITY_SEED_ENABLED: ${{ vars.IDENTITY_SEED_ENABLED }}
          IDENTITY_SEED_ADMIN_USERNAME: ${{ vars.IDENTITY_SEED_ADMIN_USERNAME }}
          IDENTITY_SEED_ADMIN_FIRST_NAME: ${{ vars.IDENTITY_SEED_ADMIN_FIRST_NAME }}
          IDENTITY_SEED_ADMIN_LAST_NAME: ${{ vars.IDENTITY_SEED_ADMIN_LAST_NAME }}
          IDENTITY_SEED_ADMIN_EMAIL: ${{ vars.IDENTITY_SEED_ADMIN_EMAIL }}
          IDENTITY_SEED_ADMIN_PASSWORD: ${{ secrets.IDENTITY_SEED_ADMIN_PASSWORD }}
          PIEDRAZUL_BACKEND_MAIL_SEND: ${{ secrets.PIEDRAZUL_BACKEND_MAIL_SEND }}
          NOTIFICATION_ENCRYPTION_KEY: ${{ secrets.NOTIFICATION_ENCRYPTION_KEY }}

  app_deploy:
    name: Desplegar aplicación
    runs-on: ubuntu-latest
    needs:
      [
        validate_inputs,
        infra,
        inventory,
        readiness,
        host_config,
        select_backend_image,
        postgres_build,
      ]
    if: |
      always() &&
      inputs.run_app_deploy == true &&
      needs.validate_inputs.result == 'success' &&
      needs.infra.result == 'success' &&
      needs.inventory.result == 'success' &&
      needs.readiness.result == 'success' &&
      (needs.host_config.result == 'success' || needs.host_config.result == 'skipped') &&
      needs.select_backend_image.result == 'success' &&
      (needs.postgres_build.result == 'success' || needs.postgres_build.result == 'skipped')
    timeout-minutes: 15
    environment: ${{ inputs.github_environment }}
    env:
      ANSIBLE_CONFIG: infra/ansible/ansible.cfg
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configurar clave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ANSIBLE_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Descargar inventario
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hosts-runtime-${{ github.run_id }}

      - name: Instalar colecciones de Ansible
        run: |
          set -euo pipefail
          ansible-galaxy collection install \
            -r infra/ansible/requirements.yml \
            -p infra/ansible/collections

      - name: Resolver POSTGRES_IMAGE_TAG
        id: postgres_tag
        run: |
          set -euo pipefail
          if [ "${{ inputs.run_build_postgres }}" = "true" ]; then
            echo "value=${{ needs.postgres_build.outputs.image_tag }}" >> $GITHUB_OUTPUT
          else
            echo "value=" >> $GITHUB_OUTPUT
          fi

      - name: Correr deploy
        run: |
          set -euo pipefail
          ansible-playbook \
            -i infra/ansible/inventories/prod \
            -i hosts.runtime.yml \
            -e "image_tag=${IMAGE_TAG}" \
            -e "postgres_image_tag=${POSTGRES_IMAGE_TAG}" \
            infra/ansible/playbooks/deploy.yml
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          IMAGE_TAG: ${{ needs.select_backend_image.outputs.image_tag }}
          POSTGRES_IMAGE_TAG: ${{ steps.postgres_tag.outputs.value }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          KC_DB_PASSWORD: ${{ secrets.KC_DB_PASSWORD }}
          KC_BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.KC_BOOTSTRAP_ADMIN_PASSWORD }}
          KC_ADMIN_PASSWORD: ${{ secrets.KC_ADMIN_PASSWORD }}
          CLOUDFLARE_DNS_API_TOKEN: ${{ secrets.CLOUDFLARE_DNS_API_TOKEN }}
          IDENTITY_SEED_ENABLED: ${{ vars.IDENTITY_SEED_ENABLED }}
          IDENTITY_SEED_ADMIN_USERNAME: ${{ vars.IDENTITY_SEED_ADMIN_USERNAME }}
          IDENTITY_SEED_ADMIN_FIRST_NAME: ${{ vars.IDENTITY_SEED_ADMIN_FIRST_NAME }}
          IDENTITY_SEED_ADMIN_LAST_NAME: ${{ vars.IDENTITY_SEED_ADMIN_LAST_NAME }}
          IDENTITY_SEED_ADMIN_EMAIL: ${{ vars.IDENTITY_SEED_ADMIN_EMAIL }}
          IDENTITY_SEED_ADMIN_PASSWORD: ${{ secrets.IDENTITY_SEED_ADMIN_PASSWORD }}
          PIEDRAZUL_BACKEND_MAIL_SEND: ${{ secrets.PIEDRAZUL_BACKEND_MAIL_SEND }}
          NOTIFICATION_ENCRYPTION_KEY: ${{ secrets.NOTIFICATION_ENCRYPTION_KEY }}

  health_check:
    name: Health check
    runs-on: ubuntu-latest
    needs: [validate_inputs, infra, app_deploy]
    if: |
      always() &&
      needs.app_deploy.result == 'success'
    timeout-minutes: 5
    steps:
      - name: Verificar health del backend
        run: |
          set -euo pipefail
          URL="https://${{ needs.infra.outputs.api_fqdn }}/actuator/health"
          echo "Verificando ${URL}..."
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${URL}" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Backend healthy"
              exit 0
            fi
            echo "Intento $i/12 — status: ${STATUS} — esperando 10s..."
            sleep 10
          done
          echo "Error: backend no responde después de 2 minutos"
          exit 1

      - name: Verificar health de Keycloak
        run: |
          set -euo pipefail
          URL="https://${{ needs.infra.outputs.auth_fqdn }}/realms/${{ inputs.kc_realm }}/.well-known/openid-configuration"
          echo "Verificando ${URL}..."
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${URL}" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Keycloak healthy"
              exit 0
            fi
            echo "Intento $i/12 — status: ${STATUS} — esperando 10s..."
            sleep 10
          done
          echo "Error: Keycloak no responde después de 2 minutos"
          exit 1

  # ── Escaneo de imágenes (solo reporte) ─────────────────────────────────────
  # Escanea con Trivy el manifiesto linux/amd64 exacto de cada imagen que este run
  # construye o aplica en el servidor y cuya identidad inmutable se conoce aquí.
  # Los hallazgos NO bloquean: ningún job de configuración o deploy depende de estos
  # jobs. Un job en rojo aquí es un fallo operativo (resolución, registry, DB o
  # Trivy), nunca "hay vulnerabilidades".
  # Transitorio mientras el escaneo sea solo reporte: continue-on-error a nivel de job
  # deja el job en rojo y una anotación de error, pero no cambia la conclusión del run
  # (ni la del job que llama a este workflow), que sigue reflejando solo el deploy.
  image_targets:
    name: Identidades a escanear
    runs-on: ubuntu-latest
    needs: [app_build, postgres_build, select_backend_image]
    if: |
      always() &&
      needs.select_backend_image.result == 'success' &&
      (needs.postgres_build.result == 'success' || needs.postgres_build.result == 'skipped')
    continue-on-error: true
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Reunir identidades inmutables
        id: targets
        env:
          RUN_HOST_CONFIG: ${{ inputs.run_host_config }}
          RUN_APP_DEPLOY: ${{ inputs.run_app_deploy }}
          BACKEND_SOURCE: ${{ needs.select_backend_image.outputs.image_source }}
          BACKEND_TAG: ${{ needs.select_backend_image.outputs.image_tag }}
          BACKEND_INDEX_DIGEST: ${{ needs.select_backend_image.outputs.image_index_digest }}
          BACKEND_IMAGE_REF: ${{ needs.select_backend_image.outputs.image_ref }}
          BUILT_BACKEND_TAG: ${{ needs.app_build.outputs.image_tag }}
          BUILT_BACKEND_INDEX_DIGEST: ${{ needs.app_build.outputs.image_index_digest }}
          BUILT_BACKEND_IMAGE_REF: ${{ needs.app_build.outputs.image_ref }}
          POSTGRES_TAG: ${{ needs.postgres_build.outputs.image_tag }}
          POSTGRES_INDEX_DIGEST: ${{ needs.postgres_build.outputs.image_index_digest }}
          POSTGRES_IMAGE_REF: ${{ needs.postgres_build.outputs.image_ref }}
        run: |
          set -euo pipefail

          TARGETS='[]'
          PENDING='[]'
          NOT_APPLIED='[]'

          add_target() {
            TARGETS=$(jq -c --arg surface "$1" --arg source "$2" --arg label "$3" \
              --arg index "$4" --arg ref "$5" \
              '. + [{surface: $surface, source: $source, label: $label, image_index_digest: $index, image_ref: $ref}]' \
              <<< "${TARGETS}")
          }
          add_pending() {
            PENDING=$(jq -c --arg surface "$1" --arg reason "$2" \
              '. + [{surface: $surface, reason: $reason}]' <<< "${PENDING}")
          }
          add_not_applied() {
            NOT_APPLIED=$(jq -c --arg surface "$1" '. + [$surface]' <<< "${NOT_APPLIED}")
          }

          # Qué aplica este run en el servidor:
          #   converge (setup.yml) → postgres, keycloak, traefik y backend
          #   deploy.yml           → backend, y por depends_on también postgres y keycloak
          APPLIES_STACK=false
          if [ "${RUN_HOST_CONFIG}" = "true" ] || [ "${RUN_APP_DEPLOY}" = "true" ]; then
            APPLIES_STACK=true
          fi

          # Backend: identidad seleccionada (build o rollback) o, si se construyó sin
          # desplegarla, la imagen construida; el reuso solo se conoce en el servidor
          if [ -n "${BACKEND_IMAGE_REF}" ]; then
            add_target backend "${BACKEND_SOURCE}" "${BACKEND_TAG}" "${BACKEND_INDEX_DIGEST}" "${BACKEND_IMAGE_REF}"
          elif [ -n "${BUILT_BACKEND_IMAGE_REF}" ]; then
            add_target backend "build (no desplegada en este run)" "${BUILT_BACKEND_TAG}" "${BUILT_BACKEND_INDEX_DIGEST}" "${BUILT_BACKEND_IMAGE_REF}"
          fi
          if [ "${APPLIES_STACK}" = "true" ] && [ -z "${BACKEND_IMAGE_REF}" ]; then
            add_pending backend "reuso: la identidad del último deploy exitoso solo existe en el servidor"
          elif [ "${APPLIES_STACK}" != "true" ] && [ -z "${BUILT_BACKEND_IMAGE_REF}" ]; then
            add_not_applied backend
          fi

          if [ -n "${POSTGRES_IMAGE_REF}" ]; then
            if [ "${APPLIES_STACK}" = "true" ]; then
              add_target postgres build "${POSTGRES_TAG}" "${POSTGRES_INDEX_DIGEST}" "${POSTGRES_IMAGE_REF}"
            else
              add_target postgres "build (no desplegada en este run)" "${POSTGRES_TAG}" "${POSTGRES_INDEX_DIGEST}" "${POSTGRES_IMAGE_REF}"
            fi
          elif [ "${APPLIES_STACK}" = "true" ]; then
            add_pending postgres "sin build en este run: el servidor conserva su POSTGRES_IMAGE_TAG"
          else
            add_not_applied postgres
          fi

          # Terceros: la referencia configurada en Compose se resuelve una vez, solo si este
          # run aplica ese servicio. Compose sigue desplegando por tag, así que esto no
          # garantiza escaneado = desplegado.
          for SURFACE in keycloak traefik; do
            if [ "${SURFACE}" = "traefik" ] && [ "${RUN_HOST_CONFIG}" != "true" ]; then
              add_not_applied "${SURFACE}"
              continue
            fi
            if [ "${APPLIES_STACK}" != "true" ]; then
              add_not_applied "${SURFACE}"
              continue
            fi
            CONFIGURED=$(yq -r ".services.${SURFACE}.image" "infra/compose/${SURFACE}.yml")
            IDENTITY=$(.github/scripts/resolve-amd64-image.sh "${CONFIGURED}")
            INDEX_DIGEST=$(sed -n 's/^image_index_digest=//p' <<< "${IDENTITY}")
            IMAGE_REF=$(sed -n 's/^image_ref=//p' <<< "${IDENTITY}")
            add_target "${SURFACE}" "compose (tag)" "${CONFIGURED}" "${INDEX_DIGEST}" "${IMAGE_REF}"
          done

          echo "targets=${TARGETS}" >> "$GITHUB_OUTPUT"

          {
            echo "## Identidades de imagen a escanear"
            echo
            if [ "$(jq 'length' <<< "${TARGETS}")" -gt 0 ]; then
              echo "| imagen | origen | referencia | índice OCI | escaneada (linux/amd64) |"
              echo "|---|---|---|---|---|"
              jq -r '.[] | "| \(.surface) | \(.source) | `\(.label)` | `\(.image_index_digest)` | `\(.image_ref)` |"' <<< "${TARGETS}"
            else
              echo "Ninguna imagen con identidad conocida en este run."
            fi
            if [ "$(jq 'length' <<< "${PENDING}")" -gt 0 ]; then
              echo
              echo "**Aplicadas por este run pero sin escanear (identidad solo en el servidor):**"
              echo
              jq -r '.[] | "- \(.surface): \(.reason)"' <<< "${PENDING}"
            fi
            if [ "$(jq 'length' <<< "${NOT_APPLIED}")" -gt 0 ]; then
              echo
              echo "No aplicadas por este run: $(jq -r 'join(", ")' <<< "${NOT_APPLIED}")."
            fi
            echo
            echo "> Solo reporte: los hallazgos no bloquean el deploy. Las imágenes se siguen"
            echo "> desplegando por tag, así que escaneado = desplegado todavía no está garantizado."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Reportar fallo operativo
        if: failure()
        run: |
          echo "::error title=Escaneo de imagen (solo reporte)::No se pudieron resolver las identidades a escanear; ninguna imagen fue escaneada. El deploy no depende de este job."
          {
            echo "## Identidades a escanear: FALLO OPERATIVO"
            echo
            echo "Ninguna imagen fue escaneada en este run. Esto no equivale a cero hallazgos."
          } >> "$GITHUB_STEP_SUMMARY"

  image_scan:
    name: Escanear ${{ matrix.surface }} (solo reporte)
    runs-on: ubuntu-latest
    needs: image_targets
    if: |
      !cancelled() &&
      needs.image_targets.outputs.targets != '' &&
      needs.image_targets.outputs.targets != '[]'
    # Transitorio mientras el escaneo sea solo reporte (ver image_targets)
    continue-on-error: true
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.image_targets.outputs.targets) }}
    env:
      # Trivy v0.74.0, imagen oficial fijada por digest del índice OCI
      TRIVY_IMAGE: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
    steps:
      # Sin socket de Docker ni credenciales: Trivy lee las capas directo del registry
      # (--image-src remote). --exit-code 0: un código distinto de cero es fallo operativo.
      - name: Escanear con Trivy
        env:
          IMAGE_REF: ${{ matrix.image_ref }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/trivy-cache" scan

          docker run --rm \
            -v "${RUNNER_TEMP}/trivy-cache:/root/.cache/trivy" \
            -v "${PWD}/scan:/scan" \
            "${TRIVY_IMAGE}" image \
              --image-src remote \
              --platform linux/amd64 \
              --scanners vuln \
              --format json \
              --output /scan/trivy.json \
              --exit-code 0 \
              --no-progress \
              --skip-version-check \
              "${IMAGE_REF}"

          docker run --rm \
            -v "${RUNNER_TEMP}/trivy-cache:/root/.cache/trivy" \
            "${TRIVY_IMAGE}" version --format json > scan/trivy-version.json

          jq -e --arg ref "${IMAGE_REF}" \
            '.SchemaVersion == 2 and .ArtifactName == $ref and (.Results | type == "array" or . == null)' \
            scan/trivy.json > /dev/null || {
              echo "Error: el reporte de Trivy no corresponde a ${IMAGE_REF} o está incompleto"
              exit 1
            }
          jq -e '.VulnerabilityDB.UpdatedAt' scan/trivy-version.json > /dev/null || {
            echo "Error: Trivy no reporta metadatos de la base de vulnerabilidades"
            exit 1
          }

      - name: Resumen del escaneo
        env:
          SURFACE: ${{ matrix.surface }}
          SOURCE: ${{ matrix.source }}
          LABEL: ${{ matrix.label }}
          INDEX_DIGEST: ${{ matrix.image_index_digest }}
          IMAGE_REF: ${{ matrix.image_ref }}
        run: |
          set -euo pipefail

          jq -n \
            --arg surface "${SURFACE}" --arg source "${SOURCE}" --arg label "${LABEL}" \
            --arg index "${INDEX_DIGEST}" --arg ref "${IMAGE_REF}" \
            --slurpfile report scan/trivy.json --slurpfile version scan/trivy-version.json '
            [$report[0].Results[]?.Vulnerabilities[]?] as $v
            | def sev($s): [$v[] | select(.Severity == $s)]
                | {findings: length, unique_ids: ([.[].VulnerabilityID] | unique | length)};
            {
              surface: $surface, source: $source, label: $label,
              image_index_digest: $index, image_ref: $ref,
              platform: "linux/amd64",
              trivy_version: $version[0].Version,
              vulnerability_db: $version[0].VulnerabilityDB,
              critical: sev("CRITICAL"),
              high: sev("HIGH"),
              enforcement: "report-only"
            }' > scan/summary.json

          jq -r '
            "## Escaneo de `\(.surface)` (solo reporte)",
            "",
            "| campo | valor |",
            "|---|---|",
            "| origen | \(.source) (`\(.label)`) |",
            "| índice OCI | `\(.image_index_digest)` |",
            "| escaneado (linux/amd64) | `\(.image_ref)` |",
            "| Trivy | \(.trivy_version) |",
            "| DB de vulnerabilidades | v\(.vulnerability_db.Version), actualizada \(.vulnerability_db.UpdatedAt) |",
            "| CRITICAL | \(.critical.findings) hallazgos, \(.critical.unique_ids) CVE únicos |",
            "| HIGH | \(.high.findings) hallazgos, \(.high.unique_ids) CVE únicos |",
            "",
            "> Los hallazgos no bloquean el deploy: la política de vulnerabilidades todavía no está activa."
          ' scan/summary.json >> "$GITHUB_STEP_SUMMARY"

          jq -c . scan/summary.json

      - name: Reportar fallo operativo
        if: failure()
        env:
          SURFACE: ${{ matrix.surface }}
          IMAGE_REF: ${{ matrix.image_ref }}
        run: |
          echo "::error title=Escaneo de imagen (solo reporte)::Fallo operativo escaneando ${SURFACE} (${IMAGE_REF}); no equivale a cero hallazgos. El deploy no depende de este job."
          {
            echo "## Escaneo de \`${SURFACE}\`: FALLO OPERATIVO"
            echo
            echo "No se pudo escanear \`${IMAGE_REF}\`. Esto no equivale a cero hallazgos."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Subir evidencia del escaneo
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-scan-${{ matrix.surface }}-${{ github.run_id }}
          path: |
            scan/trivy.json
            scan/trivy-version.json
            scan/summary.json
          if-no-files-found: error
          retention-days: 30
