name: Terraform — Hetzner Plan

on:
  pull_request:
    branches: [main]
    paths:
      - "infra/terraform/live/prod/**"
      - "infra/terraform/modules/hetzner/**"
      - "infra/terraform/modules/cloudflare/**"
      - "infra/terraform/modules/shared/**"
      - ".github/workflows/terraform-hetzner-*.yml"

concurrency:
  group: terraform-hetzner-${{ github.head_ref }}
  cancel-in-progress: true

env:
  TF_CLOUD_ORGANIZATION: "Piedrazul"
  TF_WORKSPACE: "piedrazul-hetzner"
  CONFIG_DIRECTORY: "infra/terraform"
jobs:
  plan:
    name: Speculative plan — Hetzner
    runs-on: ubuntu-latest
    # El token de HCP se consume vía el environment terraform-plan: el plan ejecuta código
    # Terraform/workflow controlado por el PR contra el workspace productivo, así que
    # requiere aprobación privilegiada (revisar infra/terraform/** y .github/workflows/**).
    environment: terraform-plan
    env:
      TF_API_TOKEN: "${{ secrets.TF_API_TOKEN }}"
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Upload configuration
        uses: hashicorp/tfc-workflows-github/actions/upload-configuration@8e08d1ba957673f5fbf971a22b3219639dc45661 # v1.3.2
        id: upload
        with:
          workspace: ${{ env.TF_WORKSPACE }}
          directory: ${{ env.CONFIG_DIRECTORY }}
          speculative: true

      - name: Create plan run
        uses: hashicorp/tfc-workflows-github/actions/create-run@8e08d1ba957673f5fbf971a22b3219639dc45661 # v1.3.2
        id: run
        continue-on-error: true
        with:
          workspace: ${{ env.TF_WORKSPACE }}
          configuration_version: ${{ steps.upload.outputs.configuration_version_id }}
          plan_only: true
          message: "PR #${{ github.event.pull_request.number }} — Hetzner speculative plan"

      - name: Get plan output
        uses: hashicorp/tfc-workflows-github/actions/plan-output@8e08d1ba957673f5fbf971a22b3219639dc45661 # v1.3.2
        id: plan_output
        with:
          plan: ${{ steps.run.outputs.plan_id }}

      - name: Upsert plan comment on PR
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const marker = '<!-- hcp-terraform-hetzner-plan -->';
            const body = `${marker}
            ### Terraform Plan — Hetzner \`${{ steps.run.outputs.run_status }}\`

            | | Count |
            |---|---|
            | Add | ${{ steps.plan_output.outputs.add }} |
            | Change | ${{ steps.plan_output.outputs.change }} |
            | Destroy | ${{ steps.plan_output.outputs.destroy }} |

            **Workspace:** \`${{ env.TF_WORKSPACE }}\`
            **Commit:** \`${{ github.sha }}\`
            **Triggered by:** @${{ github.actor }}

            [Ver plan completo en HCP Terraform](${{ steps.run.outputs.run_link }})`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if run did not finish cleanly
        if: ${{ steps.run.outputs.run_status != 'planned_and_finished' }}
        run: |
          echo "HCP Terraform run did not finish cleanly"
          echo "Status: ${{ steps.run.outputs.run_status }}"
          echo "${{ steps.run.outputs.run_link }}"
          exit 1
