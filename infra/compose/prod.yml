name: ${PROJECT_NAME}

networks:
  piedrazul_net:
    name: piedrazul_net

include:
  - ./db.yml
  - ./keycloak.yml
  - ./backend.yml
  - ./migrate.yml
  - ./traefik.yml

services:
  # Imágenes propias: siempre por identidad exacta (repo@sha256), nunca por tag
  postgres:
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE no definido — image.env debe contener la identidad exacta de postgres (repo@sha256)}

  keycloak:
    # Sin --import-realm: el realm solo se importa en un evento P2 (kc.sh import, ver
    # ansible/roles/app/tasks/keycloak_bootstrap.yml). Un reinicio o una recuperación nunca
    # recrean un realm que falta.
    command: ["start"]
    environment:
      KC_HOSTNAME: ${KC_HOSTNAME}
      KC_HOSTNAME_STRICT: "true"
      KC_PROXY_HEADERS: xforwarded
    expose:
      - "${KC_PORT}"
    labels:
      # Traefik — enrutamiento de Keycloak
      - "traefik.enable=true"
      - "traefik.http.routers.keycloak.rule=Host(`${KC_HOSTNAME}`)"
      - "traefik.http.routers.keycloak.entrypoints=websecure"
      - "traefik.http.routers.keycloak.tls.certresolver=letsencrypt"
      - "traefik.http.routers.keycloak.tls.options=cloudflare-aop@file"
      - "traefik.http.services.keycloak.loadbalancer.server.port=${KC_PORT}"

  backend:
    expose:
      - "${SERVER_PORT}"
    labels:
      # Traefik — enrutamiento del backend API
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`${API_PUBLIC_DOMAIN}`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.backend.tls.options=cloudflare-aop@file"
      - "traefik.http.services.backend.loadbalancer.server.port=${SERVER_PORT}"
