name: ${PROJECT_NAME}

networks:
  piedrazul_net:
    name: piedrazul_net

# Logs de los cuatro servicios principales (docs/operations/runbooks/logs.md, "Activación de
# una fuente"): cada uno extiende una base de logging.yml que elige .env (<SERVICIO>_LOGGING, de
# env.j2 y obs_log_services): journald (al journal del host, non-blocking) o default (sin
# configuración propia: driver y rotación de daemon.json, como antes). Sin la variable
# (desarrollo, harnesses, .env anterior) es default. Un valor desconocido hace fallar Compose.

include:
  - ./db.yml
  - ./keycloak.yml
  - ./backend.yml
  - ./migrate.yml
  - ./traefik.yml

services:
  # Imágenes propias: siempre por identidad exacta (repo@sha256), nunca por tag
  postgres:
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE no definido — image.env debe contener la identidad exacta de postgres (repo@sha256)}
    # Diagnóstico sin volcar SQL: el prefijo agrega rol@base en las líneas de sesión (backend,
    # Keycloak y migraciones comparten el clúster) y log_lock_waits registra esperas de lock de
    # más de deadlock_timeout (1 s) con la sentencia, aunque la consulta termine bien (con $n en
    # los clientes de la aplicación; un literal de un psql por la red sí queda). El resto queda en los valores de la imagen: errores con su
    # SQLSTATE, DETAIL y la sentencia que falló (log_min_error_statement=error, con $n y sin
    # valores de parámetros: log_parameter_max_length_on_error=0), sin log_statement ni
    # log_min_duration_statement. El entrypoint pasa estos argumentos también al servidor
    # temporal de la inicialización.
    command: ["postgres", "-c", "log_line_prefix=%m [%p] %q%u@%d ", "-c", "log_lock_waits=on"]
    environment:
      # Solo clientes libpq dentro del contenedor (01-init-databases.sh en la inicialización y en
      # cada reconciliación por docker exec, psql de un operador): una sentencia que falla no se
      # registra con su texto, que en la reconciliación lleva contraseñas (ALTER ROLE ...
      # PASSWORD). backend, Keycloak y migrate se conectan por la red con su propio entorno y
      # conservan la sentencia en sus errores.
      PGOPTIONS: "-c log_min_error_statement=panic"
    extends:
      file: ./logging.yml
      service: ${POSTGRES_LOGGING:-default}

  keycloak:
    # Tercero fijado: manifiesto linux/amd64 exacto (repo@sha256) del índice que declara
    # keycloak.yml, resuelto y escaneado por el workflow y escrito por converge (setup.yml).
    # Nunca por tag.
    image: ${KEYCLOAK_IMAGE:?KEYCLOAK_IMAGE no definido — image.env debe contener la identidad exacta de keycloak (repo@sha256); corre converge}
    # Sin --import-realm: el realm solo se importa en un evento P2 (kc.sh import, ver
    # ansible/roles/app/tasks/keycloak_bootstrap.yml). Un reinicio o una recuperación nunca
    # recrean un realm que falta.
    command: ["start"]
    extends:
      file: ./logging.yml
      service: ${KEYCLOAK_LOGGING:-default}
    environment:
      KC_HOSTNAME: ${KC_HOSTNAME}
      KC_HOSTNAME_STRICT: "true"
      KC_PROXY_HEADERS: xforwarded
    # Traefik lo enruta por el file provider (routes.yml, generado por Ansible): sin labels
    expose:
      - "${KC_PORT}"

  backend:
    # Traefik lo enruta por el file provider (routes.yml, generado por Ansible): sin labels
    expose:
      - "${SERVER_PORT}"
    extends:
      file: ./logging.yml
      service: ${BACKEND_LOGGING:-default}

  traefik:
    # Tercero fijado: manifiesto linux/amd64 exacto (repo@sha256) del índice que declara
    # traefik.yml, resuelto y escaneado por el workflow y escrito por converge (setup.yml).
    # Nunca por tag.
    image: ${TRAEFIK_IMAGE:?TRAEFIK_IMAGE no definido — image.env debe contener la identidad exacta de traefik (repo@sha256); corre converge}
    extends:
      file: ./logging.yml
      service: ${TRAEFIK_LOGGING:-default}
