services:
  backend:
    image: ghcr.io/${GITHUB_OWNER}/${GITHUB_REPO}:${IMAGE_TAG:-latest}
    container_name: backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JPA_DDL_AUTO: validate
      JPA_SHOW_SQL: "false"
      JPA_FORMAT_SQL: "false"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SCHEMA: ${DB_SCHEMA}
      SERVER_PORT: 8080
      CORS_ALLOWED_ORIGINS: https://${API_PUBLIC_DOMAIN}
      KC_ISSUER_URI: https://${KC_HOSTNAME}/realms/${KC_REALM}
      KC_SERVER_URL: https://${KC_HOSTNAME}
      KC_REALM: ${KC_REALM}
      KC_BACKEND_CLIENT_ID: ${KC_BACKEND_CLIENT_ID}
      KC_BACKEND_CLIENT_SECRET: ${KC_BACKEND_CLIENT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - piedrazul_net
