services:
  backend:
    image: ghcr.io/${GITHUB_OWNER}/${GITHUB_REPO}/backend:${IMAGE_TAG}
    container_name: backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SERVER_PORT: ${SERVER_PORT}
      SERVER_FORWARD_HEADERS_STRATEGY: ${SERVER_FORWARD_HEADERS_STRATEGY}

      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SCHEMA: ${DB_SCHEMA}

      JPA_DDL_AUTO: ${JPA_DDL_AUTO}
      JPA_SHOW_SQL: ${JPA_SHOW_SQL}
      JPA_FORMAT_SQL: ${JPA_FORMAT_SQL}

      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

      KC_ISSUER_URI: ${KC_ISSUER_URI}
      KC_SERVER_URL: ${KC_SERVER_URL}
      KC_REALM: ${KC_REALM}
      KC_BACKEND_CLIENT_ID: ${KC_BACKEND_CLIENT_ID}
      KC_BACKEND_CLIENT_SECRET: ${KC_BACKEND_CLIENT_SECRET}

      ERROR_INCLUDE_STACKTRACE: ${ERROR_INCLUDE_STACKTRACE}
      ERROR_INCLUDE_MESSAGE: ${ERROR_INCLUDE_MESSAGE}

      MAX_FILE_SIZE: ${MAX_FILE_SIZE}
      MAX_REQUEST_SIZE: ${MAX_REQUEST_SIZE}

      APP_TIMEZONE: ${APP_TIMEZONE}

      MANAGEMENT_EXPOSED_ENDPOINTS: ${MANAGEMENT_EXPOSED_ENDPOINTS}
      MANAGEMENT_HEALTH_DETAILS: ${MANAGEMENT_HEALTH_DETAILS}

      LOG_LEVEL_ROOT: ${LOG_LEVEL_ROOT}
      LOG_LEVEL_SECURITY: ${LOG_LEVEL_SECURITY}
      LOG_LEVEL_SQL: ${LOG_LEVEL_SQL}
      LOG_LEVEL_SQL_BIND: ${LOG_LEVEL_SQL_BIND}

      IDENTITY_SEED_ENABLED: ${IDENTITY_SEED_ENABLED}
      IDENTITY_SEED_ADMIN_USERNAME: ${IDENTITY_SEED_ADMIN_USERNAME}
      IDENTITY_SEED_ADMIN_FIRST_NAME: ${IDENTITY_SEED_ADMIN_FIRST_NAME}
      IDENTITY_SEED_ADMIN_LAST_NAME: ${IDENTITY_SEED_ADMIN_LAST_NAME}
      IDENTITY_SEED_ADMIN_EMAIL: ${IDENTITY_SEED_ADMIN_EMAIL}
      IDENTITY_SEED_ADMIN_PASSWORD: ${IDENTITY_SEED_ADMIN_PASSWORD}

      NOTIFICATION_ENCRYPTION_KEY: ${NOTIFICATION_ENCRYPTION_KEY}
      NOTIFICATIONS_SENDGRID_ENABLED: ${NOTIFICATIONS_SENDGRID_ENABLED}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      SENDGRID_SANDBOX_MODE: ${SENDGRID_SANDBOX_MODE}
      NOTIFICATIONS_EMAIL_FROM: ${NOTIFICATIONS_EMAIL_FROM}
      NOTIFICATIONS_EMAIL_FROM_NAME: ${NOTIFICATIONS_EMAIL_FROM_NAME}

    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

    networks:
      - piedrazul_net
