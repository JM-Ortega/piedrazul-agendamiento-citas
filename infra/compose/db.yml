services:
  postgres:
    image: ghcr.io/${GITHUB_OWNER}/${GITHUB_REPO}/postgres:${POSTGRES_IMAGE_TAG}
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      APP_DB_USERNAME: ${APP_DB_USERNAME}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}

      MIGRATION_DB_USERNAME: ${MIGRATION_DB_USERNAME}
      MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD}

      KC_DB_USERNAME: ${KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - piedrazul_net

volumes:
  pgdata:
