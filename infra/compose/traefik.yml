services:
  traefik:
    # Referencia fijada: <tag>@sha256:<índice OCI>. El digest es la identidad (el tag solo la
    # hace legible y Ansible lo contrasta con la versión de la imagen). En producción prod.yml
    # la reemplaza por TRAEFIK_IMAGE de image.env: el manifiesto linux/amd64 exacto de este
    # índice, el mismo que se escaneó (ver ansible/roles/app/tasks/traefik_image.yml).
    image: traefik:v3.7.17@sha256:f4bb143d1135a579b630ed491e17ec50f6f7c9c6a30585ff3d385471d2a86f5a
    container_name: traefik
    restart: unless-stopped
    command:
      # API y dashboard
      - "--api.dashboard=false"
      # Entrypoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Métricas Prometheus en un entrypoint propio, solo dentro de piedrazul_net: sin puerto
      # publicado y sin router (los de routes.yml declaran websecure). Etiquetas por entrypoint
      # y servicio; las de router repetirían las de servicio (uno a uno).
      - "--entrypoints.metrics.address=:8082"
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.entrypoint=metrics"
      - "--metrics.prometheus.addEntryPointsLabels=true"
      - "--metrics.prometheus.addServicesLabels=true"
      - "--metrics.prometheus.addRoutersLabels=false"
      # Redirigir HTTP → HTTPS globalmente
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      # Un conflicto de opciones TLS sobre un mismo host desactiva sus routers en vez de
      # caer a las opciones TLS por defecto (que no exigen el certificado de cliente de AOP)
      - "--core.strictTLSOptions=true"
      # File provider: única fuente de rutas. tls.yml (opciones TLS de AOP, del repositorio)
      # y routes.yml (routers y servicios, generado por Ansible desde el inventario). Sin
      # Docker provider ni socket de Docker.
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      # Let's Encrypt via Cloudflare DNS challenge
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.provider=cloudflare"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53"
    environment:
      CF_DNS_API_TOKEN: ${CLOUDFLARE_DNS_API_TOKEN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Almacenamiento persistente de certificados Let's Encrypt
      - traefik_letsencrypt:/letsencrypt
      # Configuración dinámica: opciones TLS de AOP y rutas (file provider)
      - ../traefik/dynamic:/etc/traefik/dynamic:ro
      # CA de Cloudflare para Authenticated Origin Pulls
      - ../traefik/certs:/certs:ro
    networks:
      - piedrazul_net
      - obs_edge

volumes:
  traefik_letsencrypt:

networks:
  # Red interna (sin salida) que Traefik comparte solo con Grafana del stack de observabilidad
  # (proyecto aparte, la usa como externa). La crea la aplicación para no depender de ese stack;
  # Traefik solo la usa si routes.yml declara el router grafana (grafana_public_domain). Ningún
  # otro servicio de la aplicación se une a ella.
  obs_edge:
    name: piedrazul_obs_edge
    internal: true
