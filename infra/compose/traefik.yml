services:
  traefik:
    image: traefik:v3.6
    container_name: traefik
    restart: unless-stopped
    command:
      # API y dashboard
      - "--api.dashboard=false"
      # Entrypoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Redirigir HTTP → HTTPS globalmente
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      # Docker provider
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=piedrazul_net"
      # File provider — configuración dinámica TLS (AOP y opciones TLS)
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      # Let's Encrypt via Cloudflare DNS challenge
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.provider=cloudflare"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53"
    environment:
      CF_DNS_API_TOKEN: ${CLOUDFLARE_DNS_API_TOKEN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Runtime Docker socket (read-only)
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Almacenamiento persistente de certificados Let's Encrypt
      - traefik_letsencrypt:/letsencrypt
      # Configuración dinámica — opciones TLS para AOP
      - ../traefik/dynamic:/etc/traefik/dynamic:ro
      # CA de Cloudflare para Authenticated Origin Pulls
      - ../traefik/certs:/certs:ro
    networks:
      - piedrazul_net

volumes:
  traefik_letsencrypt:
