---
# Directorios
app_dir: /opt/piedrazul
compose_project_name: piedrazul
compose_file: "{{ app_dir }}/compose/prod.yml"
compose_src_dir: "{{ playbook_dir }}/../../compose"
# Raíz del checkout que corre Ansible (fuente de realm y valores conocidos del repositorio)
repo_root: "{{ playbook_dir }}/../../.."
# CLI de Compose equivalente a docker_compose_v2 (para run/config). Se usa con
# chdir={{ app_dir }}/compose.
compose_cli:
  - docker
  - compose
  - --project-name
  - "{{ compose_project_name }}"
  - --file
  - prod.yml
  - --env-file
  - ../.env
  - --env-file
  - ../image.env
# Último despliegue exitoso: identidades exactas de backend y postgres verificadas en
# ejecución y healthy (única fuente de reuso; ver app/tasks/record_release.yml)
release_state_file: "{{ app_dir }}/last-success.env"

# Container registry
ghcr_registry: ghcr.io
ghcr_namespace: jm-ortega/piedrazul-agendamiento-citas
backend_image: "{{ ghcr_registry }}/{{ ghcr_namespace }}/backend"
postgres_image: "{{ ghcr_registry }}/{{ ghcr_namespace }}/postgres"
# Keycloak (tercero): repositorio y archivo Compose que declara su referencia fijada
# <tag>@sha256:<índice OCI>. Ver app/tasks/keycloak_image.yml.
keycloak_image: quay.io/keycloak/keycloak
keycloak_compose_file: "{{ compose_src_dir }}/keycloak.yml"
# Traefik (tercero): igual que Keycloak, referencia fijada en su archivo Compose. Ver
# app/tasks/traefik_image.yml. Sus rutas las genera app/tasks/traefik_routes.yml.
traefik_image: docker.io/library/traefik
traefik_compose_file: "{{ compose_src_dir }}/traefik.yml"

# Dominio base
base_domain: piedrazul.org

# ── Grafana detrás de Cloudflare Access ─────────────────────────────────────
# Una sola fuente para los dos consumidores: el stack de observabilidad (rol observability: JWT
# de Access en Grafana) y el router de Traefik de la aplicación (grafana_public_domain, por la red
# piedrazul_obs_edge). La aplicación de Access, su política y el DNS los administra el operador
# en Cloudflare, fuera del repositorio; estos son sus identificadores (no secretos). Las listas
# de correos Viewer/Editor no van aquí: secretos del environment (grafana-acceso.md).
obs_grafana_access_enabled: true
obs_grafana_public_domain: "grafana.{{ base_domain }}"
obs_grafana_access_team_domain: piedrazul.cloudflareaccess.com
# Application Audience (AUD) Tag de la aplicación de Access de Grafana
obs_grafana_access_aud: cbe625163be1c4f35c9d1b8c5a314665c07e0401c7f5ab6da5020caf41cd4984
# Router de Traefik hacia Grafana: solo con el acceso habilitado (vacío: Grafana solo por túnel)
grafana_public_domain: "{{ obs_grafana_public_domain if obs_grafana_access_enabled | bool else '' }}"

# ── Notificaciones del stack de observabilidad ──────────────────────────────
# Receptor de Alertmanager y entorno que encabeza cada mensaje. El webhook es el secreto
# OBS_DISCORD_WEBHOOK_URL del environment (alertas.md).
obs_alert_receiver: discord
obs_environment: produccion

# Spring / backend
spring_profiles_active: prod
server_port: 8080
server_forward_headers_strategy: framework
app_timezone: America/Bogota

# Base de datos: conexión y autoridades (nombres; las contraseñas llegan del entorno del
# runner, ver app/tasks/setup.yml). El backend en ejecución corre siempre con Flyway
# deshabilitado y JPA en validate (fijo en compose/backend.yml).
db_host: postgres
db_port: 5432
db_name: piedrazul_db
db_schema: piedrazul
postgres_user: postgres # superusuario administrativo (POSTGRES_*)
app_db_username: piedrazul_app # backend en ejecución (APP_DB_*)
migration_db_username: piedrazul_migration # servicio migrate (MIGRATION_DB_*)

# Exclusividad del host para mutaciones de la base (reconciliación de roles y migración):
# flock sobre este archivo, con espera acotada.
db_lock_file: "{{ app_dir }}/db.lock"
db_lock_timeout: 600

# JPA / Hibernate
jpa_show_sql: false
jpa_format_sql: false

# Errores
error_include_stacktrace: never
error_include_message: always

# Uploads
max_file_size: 10MB
max_request_size: 10MB

# Actuator
# Listener privado de gestión: métricas Prometheus, solo dentro de la red de contenedores.
# /actuator/health sigue también en server_port (HEALTHCHECK de la imagen y health público).
management_exposed_endpoints: health,info,prometheus
management_health_details: when-authorized
management_server_port: 8081

# Logging
log_level_root: INFO
log_level_security: INFO
log_level_sql: WARN
log_level_sql_bind: WARN
log_level_modulith: WARN

# Logs centralizados: una sola lista para los dos lados de la canalización. converge escribe
# <SERVICIO>_LOGGING=journald en .env para estos servicios (prod.yml extiende logging.yml: driver
# journald al journal del host) y default para el resto (sin configuración propia: el driver y la
# rotación de daemon.json, como antes); observability.yml selecciona los mismos en Alloy. La
# política (roles/observability/tasks/log_policy.yml) rechaza en los dos playbooks lo no admitido:
# backend, keycloak y postgres exigen obs_log_privacy_controls_done (decisión de privacidad para
# datos reales) o, solo con datos sintéticos, el perfil profiles/logs-lab-synthetic.yml.
# Ver docs/operations/runbooks/logs.md.
obs_log_services: [traefik, keycloak, backend, postgres]
obs_log_privacy_controls_done: [keycloak, backend, postgres]

# Verificación de la configuración de logs EFECTIVA de los contenedores (verify_log_config.yml):
# journald para obs_log_services y, para el resto, los valores por defecto de /etc/docker/daemon.json
# (json-file y su rotación). Solo producción: desarrollo, harnesses y laboratorios no la activan.
app_verify_log_config: true

# Keycloak
kc_realm: piedrazul
kc_port: 8180
kc_backend_client_id: piedrazul-backend
# Cliente público del frontend: su alcance de roles (los roles de negocio) lo declara el realm
kc_frontend_client_id: piedrazul-frontend
# Autoridad de reconciliación (service account en master, secreto solo en el runner).
# Roles exactos: solo del realm de la aplicación, nada en master. manage-realm lo exige el
# correo nativo (keycloak_smtp.yml): la API solo admite escribir SMTP con ese rol.
kc_automation_client_id: piedrazul-keycloak-automation
kc_automation_roles:
  - "{{ kc_realm }}-realm:manage-clients"
  - "{{ kc_realm }}-realm:manage-realm"
  - "{{ kc_realm }}-realm:view-clients"
# API de administración (Keycloak >= 26.8.2, CVE-2026-19688): solo acepta tokens con la
# audiencia y el alcance del client scope incorporado kc-admin-api. Keycloak lo crea en cada
# realm y lo asigna solo a admin-cli y security-admin-console: la automatización y el backend lo
# reciben como alcance por defecto en el evento con autoridad temporal (keycloak-admin.sh
# establish); el frontend nunca. No agrega roles: la autoridad sigue siendo la de sus roles.
# Desde kc_admin_api_scope_since (versión que migró la base) su ausencia es P3 recuperable.
kc_admin_api_scope: kc-admin-api
kc_admin_api_scope_since: "26.8.2"
# Autoridad temporal de un evento (P2 o recuperación P3): kc.sh bootstrap-admin service con
# este prefijo + sufijo aleatorio y secreto aleatorio generado en el runner. Se elimina al
# terminar el evento. Ver app/tasks/keycloak_lifecycle.yml.
kc_temp_admin_prefix: piedrazul-tmp-admin
# Forma exacta del clientId que generan esos eventos (keycloak_bootstrap.yml). Solo una
# autoridad temporal con esta forma (y los roles que da bootstrap-admin) se considera propia
# y puede eliminarse; cualquier otra es ajena y bloquea hasta que un operador decida.
kc_temp_admin_owned_regex: "^{{ kc_temp_admin_prefix }}-[0-9]{14}-[a-z0-9]{8}$"
# Administrador humano permanente de master: lo crea solo el evento P2, con la contraseña
# inicial de un solo uso KC_PLATFORM_ADMIN_INITIAL_PASSWORD y las acciones requeridas
# UPDATE_PASSWORD y CONFIGURE_TOTP. Después pertenece al operador: ningún converge ni
# recuperación lo modifica, repara ni recrea. Nombre de rol, no personal (no identifica a
# quien lo custodia). Ver docs/operations/runbooks/administrador-keycloak.md.
kc_platform_admin_username: piedrazul-platform-admin
# Rol de realm de master que da la autoridad completa de la plataforma
kc_platform_admin_role: admin
# Política de contraseñas de master (alcance: todo el realm, no solo esta cuenta): mínimo de
# 16 caracteres, sin categorías obligatorias ni rotación. Solo la fija el evento P2, sobre un
# master recién creado sin política; nunca se reaplica. Sin hashAlgorithm: se mantiene el hash
# por defecto de Keycloak.
kc_master_password_policy: "length(16)"
# Bootstrap del primer ADMIN de negocio: solo se entrega habilitado a una imagen del backend con
# esta etiqueta (backend/Dockerfile). Ver app/tasks/identity_seed_image_gate.yml.
identity_bootstrap_image_label: org.piedrazul.identity-bootstrap
identity_bootstrap_image_contract: create-only-v1
# Realm de la aplicación (fuente de la forma y los roles esperados del backend)
kc_realm_file: "{{ repo_root }}/infra/keycloak/realm/piedrazul-realm.json"
kc_health_enabled: true
kc_metrics_enabled: true
kc_db_username: keycloak_user
kc_db_schema: keycloak

# Notificaciones. La decisión de usar SES y sus credenciales vienen del GitHub Environment,
# no de aquí (roles/app/tasks/ses_inputs.yml); el remitente se aplica solo con SES habilitado.
notifications_email_from: no-reply@mail.piedrazul.org
notifications_email_from_name: Piedrazul Salud
# Endpoint SMTP público de SES: estándar o FIPS, en amazonaws.com o api.aws. Misma expresión que
# .github/scripts/ses-config.sh; la región y la conectividad no se comprueban aquí.
ses_smtp_host_pattern: '^email-smtp(-fips)?\.[a-z]{2}(-[a-z]+)+-[0-9]+\.(amazonaws\.com|api\.aws)\Z'
# Conexión del SMTP nativo de Keycloak (keycloak_smtp.yml): STARTTLS obligatorio, sin degradar
# (Keycloak fija mail.smtp.starttls.required). Valores de texto, como los guarda el realm.
kc_smtp_connection:
  port: "587"
  starttls: "true"
  ssl: "false"
  auth: "true"
# Lo que Compose debe entregar al backend, y solo a él (ses_delivery.yml, ses_runtime.yml)
ses_backend_env_keys:
  - NOTIFICATIONS_SES_ENABLED
  - SES_SMTP_HOST
  - SES_SMTP_USERNAME
  - SES_SMTP_PASSWORD
  - NOTIFICATIONS_EMAIL_FROM
  - NOTIFICATIONS_EMAIL_FROM_NAME
# Clase que demuestra que una imagen del backend trae el proveedor SES (ses_image_gate.yml)
ses_image_provider_class: BOOT-INF/classes/co/edu/unicauca/piedrazul/backend/notifications/infrastructure/provider/email/ses/SesEmailProvider.class
