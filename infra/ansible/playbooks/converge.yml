---
# Playbook principal: configura el servidor y levanta la aplicación desde cero.
# Idempotente: seguro de correr en cualquier momento sin efectos no deseados.

- name: Converge piedrazul
  hosts: vps
  gather_facts: true

  roles:
    - role: common
    - role: docker_host
    - role: hardening

  tasks:
    - name: Setup aplicación (compose files, .env, stack)
      ansible.builtin.include_role:
        name: app
        tasks_from: setup.yml

    # Clasifica por el estado de Keycloak (P1/P2/P3) y reconcilia credenciales técnicas.
    # -e keycloak_recovery=true solo para una recuperación P3 autorizada.
    - name: Ciclo técnico de Keycloak
      ansible.builtin.include_role:
        name: app
        tasks_from: keycloak_lifecycle.yml

    - name: Entregar la configuración vigente al backend en ejecución
      ansible.builtin.include_role:
        name: app
        tasks_from: refresh_backend.yml
