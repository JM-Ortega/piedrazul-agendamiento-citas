---
- name: Verificar que fail2ban está activo
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true

- name: Recopilar facts de servicios
  ansible.builtin.service_facts:

- name: Deshabilitar snapd si existe
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
    enabled: false
    masked: true
  loop:
    - snapd.service
    - snapd.socket
  when: "item in ansible_facts.services"

- name: Deshabilitar apport si existe
  ansible.builtin.systemd_service:
    name: apport
    state: stopped
    enabled: false
  when: "'apport.service' in ansible_facts.services"

- name: Configurar parámetros del kernel via sysctl
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    reload: true
  loop:
    - { name: "net.ipv4.tcp_syncookies", value: "1" }
    - { name: "net.ipv4.conf.all.rp_filter", value: "1" }
    - { name: "net.ipv4.conf.default.rp_filter", value: "1" }
    - { name: "net.ipv4.icmp_echo_ignore_broadcasts", value: "1" }
    - { name: "kernel.dmesg_restrict", value: "1" }
