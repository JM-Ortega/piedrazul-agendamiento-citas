---
# Configuración de SES en el backend que corre, al final de refresh_backend.yml y de deploy.yml.
# Ver docs/operations/runbooks/correo-ses.md.
#
# "En vigor" no se deduce del .env ni del health: el contenedor está en vigor solo si recibió
# exactamente lo que Compose entregaría hoy (variables de ses_backend_env_keys, credenciales
# incluidas, comparadas sin mostrarlas). Esto establece configuración, no entrega de correo.
#
# Modos (app_ses_runtime_mode):
#   enforce (por defecto) — falla si el GitHub Environment y Compose no coinciden en la decisión o
#     el endpoint (app_ses_intended, si se pasa), si el contenedor no refleja Compose, o si SES
#     está habilitado y no hay backend. Deshabilitado y sin backend no hay nada obsoleto.
#   deferred — converge cuyo backend no se recreó y al que sigue un deploy en el mismo run: solo
#     informa; el deploy exige.

- name: Leer lo que Compose entregaría al backend (SES)
  ansible.builtin.command:
    argv: "{{ compose_cli + ['config', '--format', 'json'] }}"
    chdir: "{{ app_dir }}/compose"
  register: app_ses_runtime_compose
  changed_when: false
  no_log: true

- name: Leer el contenedor backend (SES)
  community.docker.docker_container_info:
    name: backend
  register: app_ses_container
  no_log: true

# Solo booleanos y nombres de variable salen de aquí: Compose y el contenedor tienen secretos.
# Una clave ausente del contenedor (creado antes de este contrato) vale lo mismo que su defecto.
- name: Evaluar SES en Compose y el contenedor
  ansible.builtin.set_fact:
    app_ses_compose_enabled: "{{ (_expected.NOTIFICATIONS_SES_ENABLED | default('') | string) == 'true' }}"
    app_ses_compose_host_matches: >-
      {{ (_expected.SES_SMTP_HOST | default('') | string) == (app_ses_intended_host | default('') | string) }}
    app_ses_container_exists: "{{ app_ses_container.exists }}"
    app_ses_stale_keys: >-
      {%- set actual = {} -%}
      {%- if app_ses_container.exists -%}
        {%- for entry in app_ses_container.container.Config.Env | default([]) -%}
          {%- if entry.split('=', 1)[0] in ses_backend_env_keys -%}
            {%- set _ = actual.update({entry.split('=', 1)[0]: entry.split('=', 1)[1]}) -%}
          {%- endif -%}
        {%- endfor -%}
      {%- endif -%}
      {%- set stale = [] -%}
      {%- for key in ses_backend_env_keys -%}
        {%- set absent = 'false' if key == 'NOTIFICATIONS_SES_ENABLED' else '' -%}
        {%- if (_expected[key] | default('') | string | replace('$$', '$')) != (actual[key] | default(absent)) -%}
          {%- set _ = stale.append(key) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ stale if app_ses_container.exists else [] }}
  vars:
    _expected: "{{ (app_ses_runtime_compose.stdout | from_json).services.backend.environment }}"
  no_log: true

- name: Fijar el modo de verificación de SES
  ansible.builtin.set_fact:
    app_ses_enforce: "{{ (app_ses_runtime_mode | default('enforce')) == 'enforce' }}"

- name: Informar la configuración de SES pendiente del deploy de este run
  when: not (app_ses_enforce | bool)
  ansible.builtin.debug:
    msg: >-
      SES {{ 'habilitado' if app_ses_compose_enabled | bool else 'deshabilitado' }} en .env; backend
      {{ 'pendiente de crear' if not (app_ses_container_exists | bool)
         else ('pendiente de recreación (' ~ (app_ses_stale_keys | join(', ')) ~ ')' if app_ses_stale_keys | length > 0
               else 'sin cambios pendientes') }}. Lo verifica el deploy de este run.

- name: Verificar que Compose corresponde a la decisión del environment
  when:
    - app_ses_enforce | bool
    - app_ses_intended is defined
  ansible.builtin.assert:
    that:
      - ((app_ses_intended | string) == 'true') == (app_ses_compose_enabled | bool)
      - not (app_ses_compose_enabled | bool) or (app_ses_compose_host_matches | bool)
    fail_msg: >-
      La decisión o el endpoint de SES del GitHub Environment no coinciden con lo que Compose
      entregaría desde el .env del host. Correr la configuración del servidor.
    quiet: true

- name: Verificar que el backend tiene la configuración de SES en vigor
  when: app_ses_enforce | bool
  ansible.builtin.assert:
    that:
      - app_ses_container_exists | bool or not (app_ses_compose_enabled | bool)
      - app_ses_stale_keys | length == 0
    fail_msg: >-
      {{ 'SES habilitado en .env, pero no hay contenedor backend que lo aplique: correr un deploy.'
      if not (app_ses_container_exists | bool) else
      'El backend en ejecución no refleja la configuración de SES de .env (' ~ (app_ses_stale_keys | join(', '))
      ~ '; valores no mostrados): el cambio está pendiente de recrearlo. Correr un deploy.' }}
    quiet: true
