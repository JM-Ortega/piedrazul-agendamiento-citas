---
# Selecciona la identidad de la imagen del backend para este run.
# Lo incluyen setup.yml y deploy.yml antes de escribir image.env.
#
# Dos estados en el servidor:
#   image.env              → entrada de Compose; puede contener un candidato aún no desplegado
#   backend_deployed_file  → último IMAGE_TAG desplegado con éxito (lo escribe deploy.yml
#                            solo cuando el backend quedó healthy). Única fuente de reuso.
#
# Precedencia:
#   1. image_tag explícito — el workflow ya resolvió rollback > imagen construida en este run
#   2. IMAGE_TAG del último deploy exitoso (reuso)
# Sin identidad válida falla cerrado: nunca se inventa ni se persiste un placeholder.
#
# Antes de persistir o arrancar, la imagen se descarga del registry. Si no existe,
# image.env no se toca.
#
# Produce:
#   selected_backend_image_tag  → valor de IMAGE_TAG para image.env
#   selected_backend_image_ref  → referencia completa registry/repo:tag
#   selected_backend_image_pull → resultado del pull (incluye RepoDigests)

- name: Verificar identidad del último deploy exitoso del backend
  ansible.builtin.stat:
    path: "{{ backend_deployed_file }}"
  register: backend_deployed_stat

- name: Leer identidad del último deploy exitoso del backend
  ansible.builtin.slurp:
    src: "{{ backend_deployed_file }}"
  register: backend_deployed_current
  when: backend_deployed_stat.stat.exists

- name: Resolver identidad de la imagen del backend
  ansible.builtin.set_fact:
    deployed_backend_image_tag: >-
      {{
        (
          backend_deployed_current.content
          | b64decode
          | regex_findall('(?m)^IMAGE_TAG=(.+)$')
          | first
          | default('')
        )
        if backend_deployed_stat.stat.exists
        else ''
      }}
    selected_backend_image_source: "{{ 'explícita' if (image_tag | default('') | string | length > 0) else 'reuso' }}"

- name: Seleccionar identidad de la imagen del backend
  ansible.builtin.set_fact:
    selected_backend_image_tag: "{{ (image_tag | string) if selected_backend_image_source == 'explícita' else deployed_backend_image_tag }}"

- name: Validar identidad de la imagen del backend
  ansible.builtin.assert:
    that:
      - selected_backend_image_tag is match(backend_image_tag_pattern)
      - (selected_backend_image_tag | lower) not in backend_image_tag_placeholders
    fail_msg: >-
      Identidad de imagen del backend inválida ({{ selected_backend_image_source }}):
      '{{ selected_backend_image_tag }}'.
      {{ 'No hay un deploy exitoso registrado en ' ~ backend_deployed_file ~
         ' — corre con run_build=true o pasa un image_tag válido existente en GHCR.'
         if selected_backend_image_source == 'reuso' else
         'image_tag debe ser un tag OCI explícito (no vacío, sin placeholders).' }}
    quiet: true
  vars:
    # Gramática de tag OCI. \Z en vez de $ para no aceptar un salto de línea final.
    backend_image_tag_pattern: '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}\Z'
    # Valores que no identifican un artefacto concreto
    backend_image_tag_placeholders: [none, "null", undefined, latest]

- name: Verificar que la imagen del backend existe en el registry
  block:
    - name: Descargar imagen del backend seleccionada
      community.docker.docker_image:
        name: "{{ backend_image }}"
        tag: "{{ selected_backend_image_tag }}"
        source: pull
        force_source: true
      register: selected_backend_image_pull
  rescue:
    - name: Fallar si la imagen del backend no existe
      ansible.builtin.fail:
        msg: >-
          La imagen {{ backend_image }}:{{ selected_backend_image_tag }} no existe o no es
          accesible en el registry — no se modifica image.env.

- name: Registrar imagen del backend seleccionada
  ansible.builtin.set_fact:
    selected_backend_image_ref: "{{ backend_image }}:{{ selected_backend_image_tag }}"

- name: Mostrar imagen del backend seleccionada
  ansible.builtin.debug:
    msg: >-
      Backend ({{ selected_backend_image_source }}): {{ selected_backend_image_ref }}
      digest={{ selected_backend_image_pull.image.RepoDigests | default([]) | first | default('n/a') }}
