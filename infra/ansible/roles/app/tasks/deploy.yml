---
# Rollout de nueva imagen. No toca Keycloak ni secretos.
# image_tag (inyectado por el workflow) es opcional: vacío reusa el último deploy exitoso del backend.

# Validar que .env existe y tiene claves críticas
- name: Verificar que .env existe
  ansible.builtin.stat:
    path: "{{ app_dir }}/.env"
  register: app_env_stat

- name: Fallar si .env no existe
  ansible.builtin.fail:
    msg: ".env no existe en {{ app_dir }} — corre converge primero"
  when: not app_env_stat.stat.exists

- name: Leer .env para validación
  ansible.builtin.slurp:
    src: "{{ app_dir }}/.env"
  register: app_env_file
  no_log: true

- name: Validar que KC_BACKEND_CLIENT_SECRET no está vacío
  ansible.builtin.assert:
    that:
      - >-
        (app_env_file.content | b64decode).split('\n') | select('match',
        '^KC_BACKEND_CLIENT_SECRET=.+') | list | length > 0
    fail_msg: "KC_BACKEND_CLIENT_SECRET está vacío en .env — corre converge primero"
  no_log: true

# Resolver tags
- name: Verificar image.env actual
  ansible.builtin.stat:
    path: "{{ app_dir }}/image.env"
  register: image_env_stat

- name: Leer image.env actual
  ansible.builtin.slurp:
    src: "{{ app_dir }}/image.env"
  register: image_env_current
  when: image_env_stat.stat.exists

- name: Extraer POSTGRES_IMAGE_TAG actual
  ansible.builtin.set_fact:
    current_postgres_image_tag: >-
      {{
        (
          image_env_current.content
          | b64decode
          | regex_findall('(?m)^POSTGRES_IMAGE_TAG=(.+)$')
          | first
          | default('')
        )
        if image_env_stat.stat.exists
        else ''
      }}

- name: Resolver POSTGRES_IMAGE_TAG final
  ansible.builtin.set_fact:
    final_postgres_image_tag: >-
      {{
        postgres_image_tag
        if (postgres_image_tag | default('') | length > 0)
        else current_postgres_image_tag
      }}

- name: Validar que POSTGRES_IMAGE_TAG está disponible
  ansible.builtin.fail:
    msg: "No hay POSTGRES_IMAGE_TAG actual en el servidor y postgres_image_tag vino vacío — corre con run_build_postgres=true"
  when: final_postgres_image_tag | length == 0

- name: Seleccionar imagen del backend
  ansible.builtin.include_tasks: backend_image.yml

# Actualizar image.env
- name: Actualizar image.env
  ansible.builtin.copy:
    dest: "{{ app_dir }}/image.env"
    owner: ansible
    group: ansible
    mode: "0640"
    content: |
      IMAGE_TAG={{ selected_backend_image_tag }}
      POSTGRES_IMAGE_TAG={{ final_postgres_image_tag }}

# Desplegar stack con tags resueltos
- name: Desplegar backend con tags resueltos
  community.docker.docker_compose_v2:
    project_src: "{{ app_dir }}/compose"
    project_name: "{{ compose_project_name }}"
    files:
      - prod.yml
    services:
      - backend
    state: present
    # La imagen exacta ya se descargó en backend_image.yml
    pull: missing
    env_files:
      - ../.env
      - ../image.env

# Solo un backend healthy con la imagen seleccionada avanza la identidad reusable.
# Si falla, backend_deployed_file conserva el último deploy exitoso (o sigue sin existir).
- name: Esperar que el backend esté healthy con la imagen seleccionada
  ansible.builtin.command:
    cmd: >
      docker inspect backend
      --format="{{ '{{' }}.Config.Image{{ '}}' }} {{ '{{' }}if .State.Health{{ '}}' }}{{ '{{' }}.State.Health.Status{{ '}}' }}{{ '{{' }}end{{ '}}' }}"
  register: app_backend_health
  until: app_backend_health.stdout.split(' ') | last in ['healthy', 'unhealthy']
  retries: 36
  delay: 10
  changed_when: false
  failed_when: false

- name: Fallar si el backend no quedó healthy con la imagen seleccionada
  ansible.builtin.assert:
    that:
      - app_backend_health.stdout == selected_backend_image_ref ~ ' healthy'
    fail_msg: >-
      El backend no quedó healthy con {{ selected_backend_image_ref }}
      (docker inspect: '{{ app_backend_health.stdout | default('') }}{{ app_backend_health.stderr | default('') }}').
      Se conserva la identidad del último deploy exitoso.
    quiet: true

- name: Registrar identidad del último deploy exitoso del backend
  ansible.builtin.copy:
    dest: "{{ backend_deployed_file }}"
    owner: ansible
    group: ansible
    mode: "0640"
    content: |
      IMAGE_TAG={{ selected_backend_image_tag }}
