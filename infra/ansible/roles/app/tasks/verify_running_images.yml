---
# Verifica que los contenedores de las imágenes propias (y de Keycloak y Traefik, terceros fijados)
# corren exactamente la identidad esperada. No mira health: eso es verify_health.yml, y un health OK no prueba que corra
# el contenido esperado.
#
# Variables:
#   app_release_services → servicios a verificar (subconjunto de [postgres, backend, keycloak, traefik])
#   backend_image_ref / postgres_image_ref / keycloak_image_ref / traefik_image_ref → identidades exactas
#     esperadas (repo@sha256:<manifiesto linux/amd64>); solo se exigen las de los servicios
#     a verificar
#
# Identidad en ejecución: el contenedor existe y corre, se creó desde la referencia
# exacta (Config.Image), y la imagen local que ejecuta (Image) es la que el daemon
# registró bajo ese digest (RepoDigests). Es el manifiesto de plataforma, no el índice OCI:
# no se compara con el Id local (que según el almacén de imágenes del daemon es el digest
# de la configuración o del manifiesto).
# Docker abrevia las imágenes oficiales de Docker Hub (docker.io/library/traefik → traefik)
# en RepoDigests: las comparaciones quitan ese prefijo de ambos lados (misma referencia; no
# cambia las de ghcr.io ni quay.io).

- name: Validar servicios a verificar
  ansible.builtin.assert:
    that:
      - app_release_services | length > 0
      - app_release_services | difference(['postgres', 'backend', 'keycloak', 'traefik']) | length == 0
    fail_msg: "app_release_services debe ser un subconjunto no vacío de [postgres, backend, keycloak, traefik]"
    quiet: true

- name: Definir identidades esperadas
  ansible.builtin.set_fact:
    app_release_expected:
      backend: "{{ backend_image_ref | default('') | string }}"
      postgres: "{{ postgres_image_ref | default('') | string }}"
      keycloak: "{{ keycloak_image_ref | default('') | string }}"
      traefik: "{{ traefik_image_ref | default('') | string }}"

# Una identidad esperada vacía o por tag nunca puede "coincidir"
- name: Validar las identidades esperadas
  ansible.builtin.assert:
    that:
      - app_release_expected[item] is match('^[a-z0-9./_:-]+@sha256:[0-9a-f]{64}\Z')
    fail_msg: "IDENTIDAD EN EJECUCIÓN: la identidad esperada de {{ item }} no es exacta ('{{ app_release_expected[item] }}')"
    quiet: true
  loop: "{{ app_release_services }}"

# El resultado de docker_container_info trae el entorno del contenedor (contraseñas, secretos
# de clientes): nunca se muestra ni se itera en una tarea que lo imprima. Las verificaciones
# usan solo el resumen sin entorno.
- name: Leer contenedores de las imágenes propias
  community.docker.docker_container_info:
    name: "{{ item }}"
  loop: "{{ app_release_services }}"
  register: app_release_containers
  no_log: true

- name: Resumir los contenedores (sin su entorno)
  ansible.builtin.set_fact:
    app_release_running: >-
      {%- set r = {} -%}
      {%- for c in app_release_containers.results -%}
        {%- set k = c.container | default({}, true) -%}
        {%- set _ = r.update({c.item: {'exists': c.exists | default(false),
                                       'running': (k.State | default({}, true)).Running | default(false),
                                       'config_image': (k.Config | default({}, true)).Image | default(''),
                                       'image': k.Image | default('')}}) -%}
      {%- endfor -%}
      {{ r }}
  no_log: true

- name: Leer imágenes que ejecutan los contenedores
  community.docker.docker_image_info:
    name: "{{ app_release_running[item].image }}"
  loop: "{{ app_release_services }}"
  when: app_release_running[item].exists and app_release_running[item].image | length > 0
  register: app_release_images

- name: Verificar identidad exacta en ejecución
  ansible.builtin.assert:
    that:
      - _c.exists
      - _c.running
      - _c.config_image | regex_replace(_hub, '') == _expected
      - _i | length == 1
      - _i[0].Id == _c.image
      - _expected in (_i[0].RepoDigests | default([]) | map('regex_replace', _hub, '') | list)
    fail_msg: >-
      IDENTIDAD EN EJECUCIÓN: {{ item }} no corre {{ app_release_expected[item] }}
      (contenedor: {{ _c.config_image if _c.exists else 'ausente' }}, en ejecución: {{ _c.running }},
      imagen: {{ _c.image or 'n/a' }},
      RepoDigests: {{ (_i | first | default({}, true)).RepoDigests | default([]) }}).
      No se registra como éxito.
    success_msg: "{{ item }} corre {{ app_release_expected[item] }}"
  loop: "{{ app_release_services }}"
  vars:
    _c: "{{ app_release_running[item] }}"
    _hub: '^docker\.io/library/'
    _expected: "{{ app_release_expected[item] | regex_replace(_hub, '') }}"
    _i: "{{ (app_release_images.results | selectattr('item', 'equalto', item) | first).images | default([], true) }}"
