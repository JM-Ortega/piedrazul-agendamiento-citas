# Crea directorios, copia compose files y assets, genera .env
# y levanta solo la infraestructura base (sin backend).

- name: Crear directorio de la aplicación
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: ansible
    group: ansible
    mode: "0750"

# KC secrets desde el entorno
- name: Tomar KC secrets desde el entorno
  ansible.builtin.set_fact:
    app_kc_backend_secret: "{{ lookup('env', 'KC_BACKEND_CLIENT_SECRET') | trim | string }}"
    app_kc_automation_secret: "{{ lookup('env', 'KC_AUTOMATION_CLIENT_SECRET') | trim | string }}"
  no_log: true

- name: Verificar que los KC secrets están definidos
  ansible.builtin.assert:
    that:
      - app_kc_backend_secret | length > 0
      - app_kc_automation_secret | length > 0
    fail_msg: >-
      KC_BACKEND_CLIENT_SECRET o KC_AUTOMATION_CLIENT_SECRET no están definidos.
      Ambos deben existir como GitHub Secrets e inyectarse al workflow de Ansible.
  no_log: true

# Compose files
- name: Copiar archivos compose al servidor
  ansible.builtin.copy:
    src: "{{ compose_src_dir }}/"
    dest: "{{ app_dir }}/compose/"
    owner: ansible
    group: ansible
    directory_mode: "0750"
    mode: "0640"

# Assets del stack
- name: Copiar directorio keycloak
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../keycloak/"
    dest: "{{ app_dir }}/keycloak/"
    owner: ansible
    group: ansible
    directory_mode: "0750"
    mode: "0640"

# .env
- name: Generar .env desde template
  ansible.builtin.template:
    src: env.j2
    dest: "{{ app_dir }}/.env"
    owner: ansible
    group: ansible
    mode: "0640"
  no_log: true

# image.env — solo si no existe (deploy.yml lo actualiza con el tag real)
- name: Copiar image.env al servidor
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../image.env"
    dest: "{{ app_dir }}/image.env"
    owner: ansible
    group: ansible
    mode: "0640"
    force: false

# Levantar solo infraestructura base (sin backend)
- name: Levantar servicios de infraestructura
  community.docker.docker_compose_v2:
    project_src: "{{ app_dir }}/compose"
    project_name: "{{ compose_project_name }}"
    files:
      - prod.yml
    services:
      - postgres
      - keycloak
      - traefik
    state: present
    env_files:
      - ../.env
      - ../image.env
