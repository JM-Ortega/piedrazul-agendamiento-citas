# Crea directorios, copia compose files y assets, genera .env
# y levanta solo la infraestructura base (sin backend).
# Idempotente: si .env ya existe, preserva KC_BACKEND_CLIENT_SECRET existente.

- name: Crear directorio de la aplicación
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: ansible
    group: ansible
    mode: "0750"

# KC_BACKEND_CLIENT_SECRET
- name: Leer .env existente
  ansible.builtin.slurp:
    src: "{{ app_dir }}/.env"
  register: app_env_file
  failed_when: false
  no_log: true

- name: Extraer KC_BACKEND_CLIENT_SECRET del .env existente
  ansible.builtin.set_fact:
    app_kc_backend_secret: >-
      {{ (app_env_file.content | b64decode).split('\n')
         | select('match', '^KC_BACKEND_CLIENT_SECRET=')
         | map('regex_replace', '^KC_BACKEND_CLIENT_SECRET=', '')
         | first | default('') }}
  no_log: true
  when: app_env_file.content is defined

- name: Generar KC_BACKEND_CLIENT_SECRET nuevo
  ansible.builtin.command:
    cmd: "openssl rand -hex 32"
  register: app_new_secret
  changed_when: false
  when: app_kc_backend_secret | default('') == ""
  no_log: true

- name: Establecer kc_backend_secret como fact
  ansible.builtin.set_fact:
    app_kc_backend_secret: "{{ app_new_secret.stdout }}"
  no_log: true
  when: app_kc_backend_secret | default('') == ""

# Compose files
- name: Copiar archivos compose al servidor
  ansible.builtin.copy:
    src: "{{ compose_src_dir }}/"
    dest: "{{ app_dir }}/compose/"
    owner: ansible
    group: ansible
    directory_mode: "0750"
    mode: "0640"

# Assets del stack
- name: Copiar directorio keycloak
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../keycloak/"
    dest: "{{ app_dir }}/keycloak/"
    owner: ansible
    group: ansible
    directory_mode: "0750"
    mode: "0640"

- name: Copiar directorio postgres
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../postgres/"
    dest: "{{ app_dir }}/postgres/"
    owner: ansible
    group: ansible
    directory_mode: "0750"
    mode: "0750"

# .env
- name: Generar .env desde template
  ansible.builtin.template:
    src: env.j2
    dest: "{{ app_dir }}/.env"
    owner: ansible
    group: ansible
    mode: "0640"
  no_log: true

# image.env — solo si no existe (deploy.yml lo actualiza con el tag real)
- name: Copiar image.env al servidor
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../image.env"
    dest: "{{ app_dir }}/image.env"
    owner: ansible
    group: ansible
    mode: "0640"
    force: false

# Levantar solo infraestructura base (sin backend)
- name: Levantar servicios de infraestructura
  community.docker.docker_compose_v2:
    project_src: "{{ app_dir }}/compose"
    project_name: "{{ compose_project_name }}"
    files:
      - prod.yml
    services:
      - postgres
      - keycloak
      - traefik
    state: present
    env_files:
      - ../.env
      - ../image.env
