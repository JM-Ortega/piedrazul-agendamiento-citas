# Crea directorios, copia compose files y assets, genera .env
# y levanta solo la infraestructura base (sin backend).

- name: Crear directorio de la aplicación
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: ansible
    group: ansible
    mode: "0750"

# KC secrets desde el entorno
- name: Tomar KC secrets desde el entorno
  ansible.builtin.set_fact:
    app_kc_backend_secret: "{{ lookup('env', 'KC_BACKEND_CLIENT_SECRET') | trim | string }}"
    app_kc_automation_secret: "{{ lookup('env', 'KC_AUTOMATION_CLIENT_SECRET') | trim | string }}"
  no_log: true

- name: Verificar que los KC secrets están definidos
  ansible.builtin.assert:
    that:
      - app_kc_backend_secret | length > 0
      - app_kc_automation_secret | length > 0
    fail_msg: >-
      KC_BACKEND_CLIENT_SECRET o KC_AUTOMATION_CLIENT_SECRET no están definidos.
      Ambos deben existir como GitHub Secrets e inyectarse al workflow de Ansible.
  no_log: true

# Compose files
- name: Copiar archivos compose al servidor
  ansible.builtin.copy:
    src: "{{ compose_src_dir }}/"
    dest: "{{ app_dir }}/compose/"
    owner: ansible
    group: ansible
    directory_mode: "0750"
    mode: "0640"

# Assets del stack
- name: Copiar directorio keycloak
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../keycloak/"
    dest: "{{ app_dir }}/keycloak/"
    owner: ansible
    group: ansible
    directory_mode: "0750"
    mode: "0640"

# .env
- name: Generar .env desde template
  ansible.builtin.template:
    src: env.j2
    dest: "{{ app_dir }}/.env"
    owner: ansible
    group: ansible
    mode: "0640"
  no_log: true

# Resolver tags para image.env
- name: Verificar image.env actual
  ansible.builtin.stat:
    path: "{{ app_dir }}/image.env"
  register: image_env_stat

- name: Leer image.env actual
  ansible.builtin.slurp:
    src: "{{ app_dir }}/image.env"
  register: image_env_current
  when: image_env_stat.stat.exists

- name: Extraer IMAGE_TAG actual
  ansible.builtin.set_fact:
    current_image_tag: >-
      {{
        (image_env_current.content | b64decode | regex_search('(?m)^IMAGE_TAG=(.+)$', '\\1') | first)
        if image_env_stat.stat.exists and
           ((image_env_current.content | b64decode | regex_search('(?m)^IMAGE_TAG=(.+)$', '\\1')) is not none)
        else ''
      }}

- name: Extraer POSTGRES_IMAGE_TAG actual
  ansible.builtin.set_fact:
    current_postgres_image_tag: >-
      {{
        (image_env_current.content | b64decode | regex_search('(?m)^POSTGRES_IMAGE_TAG=(.+)$', '\\1') | first)
        if image_env_stat.stat.exists and
           ((image_env_current.content | b64decode | regex_search('(?m)^POSTGRES_IMAGE_TAG=(.+)$', '\\1')) is not none)
        else ''
      }}

- name: Resolver POSTGRES_IMAGE_TAG final
  ansible.builtin.set_fact:
    final_postgres_image_tag: >-
      {{
        postgres_image_tag
        if (postgres_image_tag | default('') | length > 0)
        else current_postgres_image_tag
      }}

- name: Validar que POSTGRES_IMAGE_TAG está disponible
  ansible.builtin.fail:
    msg: "No hay POSTGRES_IMAGE_TAG actual y postgres_image_tag vino vacío — corre con run_build_postgres=true"
  when: final_postgres_image_tag | length == 0

# Generar image.env con tags resueltos
- name: Generar image.env con tags resueltos
  ansible.builtin.copy:
    dest: "{{ app_dir }}/image.env"
    owner: ansible
    group: ansible
    mode: "0640"
    content: |
      IMAGE_TAG={{ current_image_tag | default('none', true) }}
      POSTGRES_IMAGE_TAG={{ final_postgres_image_tag }}

# Levantar solo infraestructura base (sin backend)
- name: Levantar servicios de infraestructura
  community.docker.docker_compose_v2:
    project_src: "{{ app_dir }}/compose"
    project_name: "{{ compose_project_name }}"
    files:
      - prod.yml
    services:
      - postgres
      - keycloak
      - traefik
    state: present
    env_files:
      - ../.env
      - ../image.env
