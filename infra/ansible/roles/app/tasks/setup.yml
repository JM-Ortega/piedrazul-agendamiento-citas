# Crea directorios, copia compose files y assets, genera .env, converge postgres y
# reconcilia las autoridades de la base, y después levanta Traefik. Keycloak lo arranca
# keycloak_lifecycle.yml (después de setup, en converge.yml). No arranca un backend nuevo
# ni migra (eso es deploy.yml); refresh_backend.yml, al final de converge, solo recrea el
# backend que ya corre la identidad seleccionada.

- name: Crear directorio de la aplicación
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: ansible
    group: ansible
    mode: "0750"

- name: Tomar y validar las credenciales técnicas de Keycloak
  ansible.builtin.include_tasks: keycloak_credentials.yml

# Autoridades de la base desde el entorno (contraseñas; los nombres están en group_vars)
- name: Tomar contraseñas de la base desde el entorno
  ansible.builtin.set_fact:
    app_db_secrets:
      POSTGRES_PASSWORD: "{{ lookup('env', 'POSTGRES_PASSWORD') | string }}"
      APP_DB_PASSWORD: "{{ lookup('env', 'APP_DB_PASSWORD') | string }}"
      MIGRATION_DB_PASSWORD: "{{ lookup('env', 'MIGRATION_DB_PASSWORD') | string }}"
      KC_DB_PASSWORD: "{{ lookup('env', 'KC_DB_PASSWORD') | string }}"
  no_log: true

# Solo nombres en el mensaje, nunca valores
- name: Detectar contraseñas de la base ausentes o no representables en .env
  ansible.builtin.set_fact:
    app_db_secrets_invalid: >-
      {{ app_db_secrets | dict2items
         | selectattr('value', 'match', '^$|.*[\'\r\n]')
         | map(attribute='key') | list }}
  no_log: true

- name: Verificar las contraseñas de la base
  ansible.builtin.assert:
    that:
      - app_db_secrets_invalid | length == 0
    fail_msg: >-
      Contraseñas de la base vacías o con comilla simple / salto de línea:
      {{ app_db_secrets_invalid | join(', ') }}. Deben existir como secretos del
      GitHub Environment production-hetzner e inyectarse al paso de converge.
    quiet: true

# Compose files
- name: Copiar archivos compose al servidor
  ansible.builtin.copy:
    src: "{{ compose_src_dir }}/"
    dest: "{{ app_dir }}/compose/"
    owner: ansible
    group: ansible
    directory_mode: "0750"
    mode: "0640"

# Assets del stack
- name: Copiar directorio keycloak
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../keycloak/"
    dest: "{{ app_dir }}/keycloak/"
    owner: ansible
    group: ansible
    directory_mode: "0750"
    mode: "0640"

- name: Copiar directorio traefik
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../traefik/"
    dest: "{{ app_dir }}/traefik/"
    owner: ansible
    group: ansible
    directory_mode: "0750"
    mode: "0640"

# .env
- name: Generar .env desde template
  ansible.builtin.template:
    src: env.j2
    dest: "{{ app_dir }}/.env"
    owner: ansible
    group: ansible
    mode: "0640"
  no_log: true

# Identidades exactas de las imágenes propias para image.env
- name: Validar y descargar imágenes propias
  ansible.builtin.include_tasks: release_images.yml

# image.env es la entrada de Compose: referencias exactas, nunca tags
- name: Generar image.env con identidades exactas
  ansible.builtin.copy:
    dest: "{{ app_dir }}/image.env"
    owner: ansible
    group: ansible
    mode: "0640"
    content: |
      BACKEND_IMAGE={{ backend_image_ref }}
      POSTGRES_IMAGE={{ postgres_image_ref }}

- name: Verificar la entrega de KC_BACKEND_CLIENT_SECRET al backend
  ansible.builtin.include_tasks: keycloak_backend_delivery.yml

# Base primero: ningún consumidor arranca con credenciales que postgres aún no acepta
- name: Converger postgres y reconciliar autoridades de la base
  ansible.builtin.include_tasks: db_converge.yml

# Infraestructura restante (sin backend ni Keycloak). Keycloak lo arranca
# keycloak_lifecycle.yml: en una base nunca inicializada (P2) no debe arrancar antes de
# crear la autoridad temporal del evento.
- name: Levantar servicios de infraestructura
  community.docker.docker_compose_v2:
    project_src: "{{ app_dir }}/compose"
    project_name: "{{ compose_project_name }}"
    files:
      - prod.yml
    services:
      - traefik
    state: present
    env_files:
      - ../.env
      - ../image.env
