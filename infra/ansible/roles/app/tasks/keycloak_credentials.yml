---
# Credenciales técnicas de Keycloak desde el entorno del runner:
#   KC_BACKEND_CLIENT_SECRET     → backend en ejecución (.env) y reconciliación en Keycloak
#   KC_AUTOMATION_CLIENT_SECRET  → keycloak_lifecycle.yml. No se persiste en el host (ni .env
#                                  ni Compose); solo viaja en tránsito al exec administrativo
#                                  de kcadm dentro del contenedor keycloak
- name: Tomar credenciales técnicas de Keycloak desde el entorno
  ansible.builtin.set_fact:
    app_kc_backend_secret: "{{ lookup('env', 'KC_BACKEND_CLIENT_SECRET') | trim | string }}"
    app_kc_automation_secret: "{{ lookup('env', 'KC_AUTOMATION_CLIENT_SECRET') | trim | string }}"
  no_log: true

# Sin lista de caracteres prohibidos ni otro requisito de formato nuevo: el valor (con el
# `trim` de espacios en los extremos que ya se aplicaba) llega a Keycloak en JSON armado por
# Ansible y al backend por .env con escape (keycloak_backend_delivery.yml verifica la entrega).
# Solo se exigen las invariantes de seguridad ya aprobadas, nombrando la regla y nunca el valor:
#   - presentes (como antes);
#   - ninguno igual a un valor conocido por el repositorio (.env.example, realm): un valor
#     del repositorio nunca puede quedar válido en producción;
#   - distintos entre sí: el secreto del backend se persiste en el host y el de automatización
#     no debe persistirse en él.
- name: Detectar credenciales técnicas de Keycloak inválidas
  ansible.builtin.set_fact:
    app_kc_secrets_invalid: >-
      {{ []
         + (['KC_BACKEND_CLIENT_SECRET vacío'] if app_kc_backend_secret | length == 0 else [])
         + (['KC_AUTOMATION_CLIENT_SECRET vacío'] if app_kc_automation_secret | length == 0 else [])
         + (['KC_BACKEND_CLIENT_SECRET y KC_AUTOMATION_CLIENT_SECRET son iguales']
              if app_kc_backend_secret | length > 0 and app_kc_backend_secret == app_kc_automation_secret else [])
         + (['KC_BACKEND_CLIENT_SECRET coincide con un valor del repositorio']
              if app_kc_backend_secret in _known else [])
         + (['KC_AUTOMATION_CLIENT_SECRET coincide con un valor del repositorio']
              if app_kc_automation_secret in _known else []) }}
  vars:
    _example: "{{ lookup('ansible.builtin.file', repo_root ~ '/.env.example') }}"
    _realm: "{{ lookup('ansible.builtin.file', kc_realm_file) | from_json }}"
    _known: >-
      {{ (_example.splitlines() | select('match', '^[A-Z_]*(SECRET|PASSWORD|KEY)=.')
          | map('regex_replace', '^[^=]+=', '') | list)
         + (_realm.clients | selectattr('secret', 'defined') | map(attribute='secret') | list) }}
  no_log: true

- name: Verificar las credenciales técnicas de Keycloak
  ansible.builtin.assert:
    that:
      - app_kc_secrets_invalid | length == 0
    fail_msg: >-
      Credenciales técnicas de Keycloak inválidas: {{ app_kc_secrets_invalid | join('; ') }}.
      Ambas deben existir como GitHub Secrets e inyectarse al paso de converge.
    quiet: true

# KC_PLATFORM_ADMIN_INITIAL_PASSWORD: contraseña inicial (temporal) del administrador humano
# permanente. Solo la consume el evento P2 (keycloak_bootstrap.yml), en tránsito al exec de
# kcadm; nunca se persiste en el host. Fuera de P2 no se usa ni se exige: aquí solo se
# evalúa, y keycloak_lifecycle.yml la exige únicamente cuando el estado es P2, antes del
# evento. Sin `trim`: el valor es el que custodia el operador, y espacios en los extremos se
# rechazan en lugar de recortarse en silencio.
- name: Tomar la contraseña inicial del administrador humano desde el entorno
  ansible.builtin.set_fact:
    app_kc_platform_admin_password: "{{ lookup('env', 'KC_PLATFORM_ADMIN_INITIAL_PASSWORD') | string }}"
  no_log: true

# El mínimo de 16 coincide con kc_master_password_policy: Keycloak también la rechazaría,
# pero ya dentro del evento; aquí falla antes de empezarlo
- name: Evaluar la contraseña inicial del administrador humano
  ansible.builtin.set_fact:
    app_kc_platform_admin_password_present: "{{ _pw | length > 0 }}"
    app_kc_platform_admin_password_invalid: >-
      {{ []
         + (['KC_PLATFORM_ADMIN_INITIAL_PASSWORD vacío'] if _pw | length == 0 else [])
         + (['KC_PLATFORM_ADMIN_INITIAL_PASSWORD con menos de 16 caracteres']
              if 0 < _pw | length < 16 else [])
         + (['KC_PLATFORM_ADMIN_INITIAL_PASSWORD con espacios o saltos de línea en los extremos']
              if _pw | length > 0 and _pw != _pw | trim else [])
         + (['KC_PLATFORM_ADMIN_INITIAL_PASSWORD con saltos de línea'] if '\n' in _pw or '\r' in _pw else [])
         + (['KC_PLATFORM_ADMIN_INITIAL_PASSWORD contiene el nombre de la cuenta']
              if _pw | length > 0 and kc_platform_admin_username | lower in _pw | lower else [])
         + (['KC_PLATFORM_ADMIN_INITIAL_PASSWORD coincide con una credencial técnica']
              if _pw | length > 0 and _pw in [app_kc_backend_secret, app_kc_automation_secret] else [])
         + (['KC_PLATFORM_ADMIN_INITIAL_PASSWORD coincide con un valor de referencia de .env.example']
              if _pw | length > 0 and _pw in _known else []) }}
  vars:
    _pw: "{{ app_kc_platform_admin_password }}"
    _example: "{{ lookup('ansible.builtin.file', repo_root ~ '/.env.example') }}"
    _known: >-
      {{ _example.splitlines() | select('match', '^[A-Z_]*(SECRET|PASSWORD|KEY)=.')
         | map('regex_replace', '^[^=]+=', '') | list }}
  no_log: true

# El nombre se interpola en JSON y en consultas: forma de nombre de usuario de Keycloak (que
# los guarda en minúsculas) y distinto de todo principal técnico
- name: Verificar el nombre del administrador humano
  ansible.builtin.assert:
    that:
      - kc_platform_admin_username is match('^[a-z0-9][a-z0-9._-]{2,63}$')
      - not kc_platform_admin_username.startswith('service-account-')
      - not kc_platform_admin_username.startswith(kc_temp_admin_prefix)
      - kc_platform_admin_username not in [kc_automation_client_id, kc_backend_client_id]
      - kc_platform_admin_role is match('^[a-z0-9_-]+$')
    fail_msg: >-
      kc_platform_admin_username debe ser un nombre de usuario de Keycloak en minúsculas
      (a-z 0-9 . _ -, 3 a 64) distinto de los principales técnicos
      (service-account-*, {{ kc_temp_admin_prefix }}-*, {{ kc_automation_client_id }}, {{ kc_backend_client_id }})
    quiet: true
