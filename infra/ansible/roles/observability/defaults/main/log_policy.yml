# Defaults compartidos entre el núcleo y el stack de observabilidad: la política de fuentes de logs.
# Los cargan el rol completo (defaults/main/, todos los archivos) y converge, que solo carga este
# archivo (roles/app/tasks/setup.yml: include_role con defaults_from: main/log_policy.yml). Por eso
# classify-production.sh trata este archivo como compartido (converge y stack) y el resto de
# defaults/main/ (stack.yml) como solo del stack. Un default que lea tasks/log_policy.yml va aquí.

# ── Logs ─────────────────────────────────────────────────────────────────────
# Fuentes que Alloy envía a Loki: servicios del proyecto Compose obs_log_project. La misma lista
# (inventario, group_vars) decide en converge qué servicios escriben en el journal (driver
# journald, <SERVICIO>_LOGGING en el .env de la aplicación). Va a .env como OBS_LOG_PROJECT /
# OBS_LOG_SERVICES.
obs_log_project: piedrazul
obs_log_services: [traefik]
# Política de fuentes (tasks/log_policy.yml): la aplican converge (driver journald del servicio)
# y este rol (selección de Alloy), con la misma lista obs_log_services. Fallan, sin tocar nada,
# si la lista incluye un servicio fuera de lo admitido:
#   - admitidos: sus logs no llevan datos personales conocidos;
#   - condicionados: admitidos cuando figuran también en obs_log_privacy_controls_done, la
#     decisión humana de que sus logs son aceptables con datos reales (ver
#     docs/operations/runbooks/logs.md, "Política de fuentes" y "Adopción en operación");
#   - excluidos: nunca.
# Con logs_lab_authorization=synthetic-data-only (solo datos sintéticos, en el mismo run; sin
# valor por defecto) los condicionados se admiten sin esa decisión, que no cambia.
obs_log_services_allowed: [traefik]
obs_log_services_conditional: [backend, keycloak, postgres]
obs_log_privacy_controls_done: []
obs_log_services_excluded: [migrate, prometheus, grafana, alloy, loki]
