# Guarda el estado deseado de S3 ya resuelto y validado (access_alerts_preflight.yml) en el .env
# del host, que es su única fuente persistente, y el webhook de Discord en su archivo secreto.
# Las listas de Grafana no son estado del host (access_lists.yml, grafana_access_file.yml).
#
# Todas las claves se escriben en cada run, también con el acceso o el receptor deshabilitados:
# deshabilitar no borra identificadores ni listas, y volver a habilitar solo necesita el
# interruptor. GRAFANA_ROOT_URL solo existe con el acceso habilitado (si no, Compose usa el
# loopback). COMPOSE_FILE hace que un `docker compose` manual en el directorio use los mismos
# archivos que el rol. Un cambio recrea Grafana o Alertmanager al levantar.
- name: Mantener el estado deseado de S3 en .env
  ansible.builtin.lineinfile:
    path: "{{ obs_dir }}/.env"
    regexp: "^{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
    state: "{{ 'absent' if item.absent | default(false) else 'present' }}"
    owner: "{{ obs_env_owner }}"
    group: "{{ obs_env_owner }}"
    mode: "0600"
  loop:
    - {key: COMPOSE_FILE, value: "{{ obs_compose_files | join(':') }}"}
    - {key: OBS_EDGE_NETWORK, value: "{{ obs_edge_network }}"}
    - {key: OBS_ALERT_RECEIVER, value: "{{ obs_s3_receiver }}"}
    - {key: OBS_ENVIRONMENT, value: "{{ obs_s3_environment }}"}
    - {key: GRAFANA_ACCESS_ENABLED, value: "{{ obs_grafana_access_on | string | lower }}"}
    - {key: GRAFANA_PUBLIC_DOMAIN, value: "{{ obs_s3_public_domain }}"}
    - {key: GRAFANA_ROOT_URL, value: "https://{{ obs_s3_public_domain }}/", absent: "{{ not obs_grafana_access_on }}"}
    - {key: GRAFANA_ACCESS_TEAM_DOMAIN, value: "{{ obs_s3_team_domain }}"}
    - {key: GRAFANA_ACCESS_AUD, value: "{{ obs_s3_aud }}"}
    # Las listas de correos ya no se guardan en .env (archivo de acceso de Grafana): se retiran
    - {key: GRAFANA_ACCESS_EDITORS, value: "", absent: true}
    - {key: GRAFANA_ACCESS_VIEWERS, value: "", absent: true}
  loop_control:
    label: "{{ item.key }}"

# Webhook de Discord: directorio solo de root (ningún proceso del host sin privilegios lo
# atraviesa; Alloy, que monta la raíz del host como nobody, tampoco) y archivo del UID de
# Alertmanager, que Compose monta como secreto. Siempre existe (Compose lo exige); vacío mientras
# no haya webhook. Solo se reescribe si el controlador trae OBS_DISCORD_WEBHOOK_URL. La escritura
# es atómica (archivo nuevo): el contenedor, que monta el archivo, sigue viendo el anterior, así
# que activate_secrets.yml recrea Alertmanager cuando el inodo que ve no es el del host (también
# en un reintento). Recrear, no reiniciar: con Docker Desktop un reinicio sobre el archivo
# reemplazado ni siquiera arranca.
- name: Crear el directorio de secretos del stack
  ansible.builtin.file:
    path: "{{ obs_secrets_dir }}"
    state: directory
    owner: "{{ obs_secrets_owner | default('root') }}"
    group: "{{ obs_secrets_owner | default('root') }}"
    mode: "0700"

- name: Escribir el webhook de Discord
  ansible.builtin.copy:
    dest: "{{ obs_secrets_dir }}/discord_webhook_url"
    content: "{{ obs_discord_webhook_url }}"
    owner: "{{ obs_alertmanager_uid }}"
    group: "{{ obs_alertmanager_uid }}"
    mode: "{{ obs_secret_mode }}"
  no_log: true
  diff: false
  when: obs_discord_webhook_url | length > 0

- name: Asegurar el archivo del webhook (vacío si no hay)
  ansible.builtin.copy:
    dest: "{{ obs_secrets_dir }}/discord_webhook_url"
    content: ""
    force: false
    owner: "{{ obs_alertmanager_uid }}"
    group: "{{ obs_alertmanager_uid }}"
    mode: "{{ obs_secret_mode }}"
  no_log: true
  diff: false
  when: obs_discord_webhook_url | length == 0

- name: Ajustar dueño y modo del webhook
  ansible.builtin.file:
    path: "{{ obs_secrets_dir }}/discord_webhook_url"
    state: file
    owner: "{{ obs_alertmanager_uid }}"
    group: "{{ obs_alertmanager_uid }}"
    mode: "{{ obs_secret_mode }}"
