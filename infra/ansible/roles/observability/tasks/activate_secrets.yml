# Activación de los archivos secretos montados como archivo (webhook de Discord en Alertmanager,
# acceso de Grafana). Ansible los escribe de forma atómica (archivo nuevo): un contenedor en marcha
# sigue viendo el inodo anterior, y un reinicio no basta en todos los motores. Si el inodo que ve
# el contenedor no es el del archivo del host, o el servicio no corre, se recrea ese servicio
# (solo él, sin dependencias). Sin estado propio: un reintento tras una interrupción lo detecta
# igual. No lee el contenido de ningún secreto.
#
# Entrada: obs_activate_services (servicios de obs_secret_mounts a comprobar),
# obs_compose_files. Salida: obs_secret_recreated (servicios recreados).

- name: Leer el inodo de los archivos secretos en el host
  ansible.builtin.stat:
    path: "{{ obs_secrets_dir }}/{{ item.file }}"
    get_checksum: false
  loop: "{{ obs_secret_mounts | selectattr('service', 'in', obs_activate_services) | list }}"
  loop_control:
    label: "{{ item.service }}"
  register: obs_secret_host_stat

- name: Exigir los archivos secretos en el host
  ansible.builtin.assert:
    that: obs_secret_host_stat.results | rejectattr('stat.exists') | list | length == 0
    fail_msg: "Falta un archivo secreto del stack en {{ obs_secrets_dir }}: no se puede activar."
    quiet: true

- name: Leer el inodo que ve cada contenedor
  ansible.builtin.command:
    argv: "{{ ['docker', 'compose', '--project-name', obs_compose_project_name]
              + (obs_compose_files | map('regex_replace', '^', '--file=') | list)
              + ['exec', '-T', item.item.service, 'stat', '-c', '%i', item.item.target] }}"
    chdir: "{{ obs_dir }}"
  loop: "{{ obs_secret_host_stat.results }}"
  loop_control:
    label: "{{ item.item.service }}"
  register: obs_secret_ctr_inode
  changed_when: false
  failed_when: false

- name: Decidir qué servicios ven un archivo secreto anterior
  ansible.builtin.set_fact:
    obs_secret_recreate: >-
      {%- set out = [] -%}
      {%- for r in obs_secret_ctr_inode.results -%}
        {%- if r.rc != 0 or (r.stdout | trim) != (r.item.stat.inode | string) -%}
          {%- set _ = out.append(r.item.item.service) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ out }}

- name: Recrear los servicios con un archivo secreto nuevo
  community.docker.docker_compose_v2:
    project_src: "{{ obs_dir }}"
    project_name: "{{ obs_compose_project_name }}"
    files: "{{ obs_compose_files }}"
    services: "{{ obs_secret_recreate | unique }}"
    state: present
    recreate: always
    dependencies: false
    wait: true
    wait_timeout: 180
  when: obs_secret_recreate | length > 0

- name: Volver a leer el inodo que ve cada contenedor
  ansible.builtin.command:
    argv: "{{ ['docker', 'compose', '--project-name', obs_compose_project_name]
              + (obs_compose_files | map('regex_replace', '^', '--file=') | list)
              + ['exec', '-T', item.item.service, 'stat', '-c', '%i', item.item.target] }}"
    chdir: "{{ obs_dir }}"
  loop: "{{ obs_secret_host_stat.results }}"
  loop_control:
    label: "{{ item.item.service }}"
  register: obs_secret_ctr_inode_after
  changed_when: false
  failed_when: false

- name: Comparar el inodo que ve cada contenedor con el del host
  ansible.builtin.set_fact:
    obs_secret_stale_after: >-
      {%- set out = [] -%}
      {%- for r in obs_secret_ctr_inode_after.results -%}
        {%- if r.rc != 0 or (r.stdout | trim) != (r.item.stat.inode | string) -%}
          {%- set _ = out.append(r.item.item.service) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ out }}

- name: Exigir que cada contenedor vea el archivo secreto vigente
  ansible.builtin.assert:
    that: obs_secret_stale_after | length == 0
    fail_msg: >-
      Activación: {{ obs_secret_stale_after | join(', ') }} no corre o no ve el archivo secreto
      vigente después de recrearlo.
    quiet: true

- name: Registrar los servicios recreados por un archivo secreto
  ansible.builtin.set_fact:
    obs_secret_recreated: "{{ obs_secret_recreate | unique }}"
