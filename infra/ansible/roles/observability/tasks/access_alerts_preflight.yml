# Estado deseado de S3 (acceso a Grafana, notificaciones) y sus comprobaciones, antes de copiar o
# levantar nada. Un fallo aquí no cambia nada en el host. Los mensajes nunca incluyen la URL del
# webhook ni la contraseña de Grafana.
#
# Resolución de cada valor: variable dada (-e, host_vars) > valor guardado en el .env del host >
# valor inicial. Así un run de mantenimiento sin -e conserva lo activado; desactivar es explícito.
# Del .env solo se leen las claves de esta lista (nunca la contraseña).

# Sin .env (primera instalación) se parte del estado inicial. Con .env, leerlo es obligatorio: un
# fallo de lectura detiene el rol antes de cambiar nada, en vez de volver en silencio al estado
# inicial (que desactivaría Access o Discord).
# Listas de Grafana: obligatorias en cada run y nunca guardadas en el host (access_lists.yml)
- name: Validar las listas de Grafana
  ansible.builtin.include_tasks: access_lists.yml

- name: Buscar el estado deseado guardado en el host
  ansible.builtin.stat:
    path: "{{ obs_dir }}/.env"
  register: obs_env_stat

- name: Leer el estado deseado guardado en el host
  ansible.builtin.slurp:
    src: "{{ obs_dir }}/.env"
  register: obs_env_slurp
  when: obs_env_stat.stat.exists
  # El fallo lo informa la tarea siguiente con un mensaje propio (no_log oculta el del módulo)
  failed_when: false
  no_log: true

- name: Exigir el estado guardado legible
  ansible.builtin.assert:
    that: not obs_env_stat.stat.exists or (obs_env_stat.stat.isreg and obs_env_slurp.content is defined)
    fail_msg: >-
      ESTADO DESEADO: {{ obs_dir }}/.env existe pero no se pudo leer. No se continúa para no
      volver al estado inicial (Access y Discord deshabilitados). No se copió ni levantó nada.
    quiet: true

- name: Extraer las claves de S3 guardadas
  ansible.builtin.set_fact:
    obs_s3_saved: >-
      {%- set keys = ['GRAFANA_ACCESS_ENABLED', 'GRAFANA_PUBLIC_DOMAIN', 'GRAFANA_ACCESS_TEAM_DOMAIN',
                      'GRAFANA_ACCESS_AUD', 'OBS_ALERT_RECEIVER', 'OBS_ENVIRONMENT'] -%}
      {%- set d = {} -%}
      {%- if obs_env_stat.stat.exists -%}
        {%- for line in (obs_env_slurp.content | b64decode).splitlines() -%}
          {%- set kv = line.split('=', 1) -%}
          {%- if kv | length == 2 and kv[0] in keys -%}{%- set _ = d.update({kv[0]: kv[1]}) -%}{%- endif -%}
        {%- endfor -%}
      {%- endif -%}
      {{ d }}

- name: Resolver el estado deseado (dado > guardado > inicial)
  ansible.builtin.set_fact:
    obs_grafana_access_on: "{{ _enabled_raw | string | lower == 'true' }}"
    obs_s3_enabled_raw: "{{ _enabled_raw | string }}"
    obs_s3_public_domain: "{{ obs_grafana_public_domain if obs_grafana_public_domain is not none else obs_s3_saved.GRAFANA_PUBLIC_DOMAIN | default('') }}"
    obs_s3_team_domain: "{{ obs_grafana_access_team_domain if obs_grafana_access_team_domain is not none else obs_s3_saved.GRAFANA_ACCESS_TEAM_DOMAIN | default('') }}"
    obs_s3_aud: "{{ obs_grafana_access_aud if obs_grafana_access_aud is not none else obs_s3_saved.GRAFANA_ACCESS_AUD | default('') }}"
    obs_s3_receiver: "{{ obs_alert_receiver if obs_alert_receiver is not none else obs_s3_saved.OBS_ALERT_RECEIVER | default('none') }}"
    obs_s3_environment: "{{ obs_environment if obs_environment is not none else obs_s3_saved.OBS_ENVIRONMENT | default('') }}"
  vars:
    _enabled_raw: "{{ obs_grafana_access_enabled if obs_grafana_access_enabled is not none else obs_s3_saved.GRAFANA_ACCESS_ENABLED | default('false') }}"

- name: Archivos de Compose del stack
  ansible.builtin.set_fact:
    # Modo privado (S1/S2): solo compose.yml. Con el acceso público, además compose.access.yml
    # (red de entrada compartida con Traefik).
    obs_compose_files: "{{ ['compose.yml'] + (['compose.access.yml'] if obs_grafana_access_on else []) }}"

# Booleanos de Ansible (true/false, yes/no) para el interruptor
- name: Verificar los tipos del estado deseado
  ansible.builtin.assert:
    that:
      - obs_s3_enabled_raw | lower in ['true', 'false']
    fail_msg: >-
      ACCESO A GRAFANA: obs_grafana_access_enabled debe ser booleano. No se copió ni levantó nada.
    quiet: true

- name: Verificar la configuración de Cloudflare Access para Grafana
  ansible.builtin.assert:
    that:
      - not obs_grafana_access_on or obs_s3_public_domain is match(_host_re)
      - not obs_grafana_access_on or obs_s3_team_domain is match(_team_re)
      - not obs_grafana_access_on or obs_s3_aud is match('^[0-9a-f]{64}\Z')
      # Guardados aunque el acceso esté deshabilitado: deben ser válidos igual
      - obs_s3_public_domain | length == 0 or obs_s3_public_domain is match(_host_re)
      - obs_s3_team_domain | length == 0 or obs_s3_team_domain is match(_team_re)
      - obs_s3_aud | length == 0 or obs_s3_aud is match('^[0-9a-f]{64}\Z')
    fail_msg: >-
      ACCESO A GRAFANA: con el acceso habilitado hacen falta obs_grafana_public_domain (nombre DNS
      en minúsculas), obs_grafana_access_team_domain (<equipo>.cloudflareaccess.com) y
      obs_grafana_access_aud (AUD de 64 hex). Las listas de correos son aparte (access_lists.yml) y
      pueden estar vacías: nadie entra por JWT. Valores resueltos (dado > guardado en el host >
      inicial): enabled={{ obs_s3_enabled_raw }}, domain='{{ obs_s3_public_domain }}',
      team='{{ obs_s3_team_domain }}'. No se copió ni levantó nada.
    quiet: true
  vars:
    _host_re: '^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}\Z'
    _team_re: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.cloudflareaccess\.com\Z'

- name: Verificar el receptor de notificaciones
  ansible.builtin.assert:
    that:
      - obs_s3_receiver in ['none', 'discord']
      - obs_s3_environment | length == 0 or obs_s3_environment is match('^[a-z][a-z0-9-]{1,30}\Z')
      - obs_s3_receiver != 'discord' or obs_s3_environment | length > 0
      - obs_discord_webhook_url | length == 0 or obs_discord_webhook_url is match(obs_discord_webhook_re)
    fail_msg: >-
      NOTIFICACIONES: receptor '{{ obs_s3_receiver }}' debe ser none o discord; con discord hace
      falta obs_environment (minúsculas, dígitos y guiones: staging, produccion), hoy
      '{{ obs_s3_environment }}'; OBS_DISCORD_WEBHOOK_URL, si se da, una URL
      https://discord.com/api/webhooks/<id>/<token> (no se muestra). No se copió ni levantó nada.
    quiet: true

- name: Buscar el webhook de Discord en el host
  ansible.builtin.stat:
    path: "{{ obs_secrets_dir }}/discord_webhook_url"
  register: obs_discord_secret_stat

- name: Exigir un webhook para el receptor discord
  ansible.builtin.assert:
    that: >-
      obs_s3_receiver != 'discord' or obs_discord_webhook_url | length > 0
      or (not obs_require_authoritative_inputs | bool
          and obs_discord_secret_stat.stat.exists and obs_discord_secret_stat.stat.size > 0)
    fail_msg: >-
      NOTIFICACIONES: receptor discord sin webhook. {{ 'El workflow lo exige en cada run
      (secreto OBS_DISCORD_WEBHOOK_URL del environment): nunca usa el que conserva el host.'
      if obs_require_authoritative_inputs | bool else 'Pasarlo una vez en OBS_DISCORD_WEBHOOK_URL
      (entorno del controlador); después el host lo conserva.' }} No se copió ni levantó nada.
    quiet: true

# La red de entrada solo hace falta con el acceso público (compose.access.yml)
- name: Exigir la red de entrada de Grafana
  ansible.builtin.command:
    argv: [docker, network, inspect, --format, "{{ '{{' }}.Name{{ '}}' }} {{ '{{' }}.Internal{{ '}}' }}", "{{ obs_edge_network }}"]
  register: obs_edge_net
  changed_when: false
  failed_when: false
  when: obs_grafana_access_on

- name: Verificar la red de entrada de Grafana
  ansible.builtin.assert:
    that: obs_edge_net.rc == 0 and obs_edge_net.stdout | trim == obs_edge_network ~ ' true'
    fail_msg: >-
      No existe la red interna {{ obs_edge_network }} ({{ obs_edge_net.stdout | default('') | trim }}):
      el acceso público a Grafana la necesita y la crea la aplicación (compose/traefik.yml) desde
      esta versión; correr converge/deploy de la aplicación antes, o dejar el acceso deshabilitado
      (modo privado). No se copió ni levantó nada.
    quiet: true
  when: obs_grafana_access_on
