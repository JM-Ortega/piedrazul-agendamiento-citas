# Instala o actualiza el stack de observabilidad (métricas, logs, notificaciones y acceso a
# Grafana) en el host. No toca el proyecto de la aplicación (piedrazul): solo exige que sus redes
# existan y se une a ellas (Prometheus a la de la aplicación, Grafana a la de entrada de
# Traefik). Idempotente: un segundo run no cambia ni recrea nada salvo que cambien los archivos
# del repositorio, las variables del rol o las entradas del controlador.
#
# Operaciones (obs_operation): full (todo, abajo) y grafana-access (solo la autorización de
# Grafana, grafana_access.yml).
#
# Los directorios de configuración (obs_managed_dirs) son del repositorio: el rol copia sus
# archivos y borra en el host los que el repositorio ya no tiene. Los volúmenes no se tocan; de
# .env solo se mantienen las variables de logs, de acceso a Grafana, del receptor y los digests
# de configuración; la contraseña de Grafana no se reescribe. El webhook de Discord y el archivo
# de acceso de Grafana (listas de correos) son archivos secretos aparte (obs_secrets_dir).
#
# Activación sin estado propio: cada servicio lleva como etiqueta el digest de la configuración
# que lee al arrancar (config_digest.yml), así que Compose recrea lo que cambió, también en un
# reintento tras una interrupción; los archivos secretos se activan por inodo
# (activate_secrets.yml). verify_activation.yml exige paridad, digests, inodos e imágenes antes de
# las comprobaciones de lo que cada servicio cargó.
#
# Fuera de /opt/piedrazul-obs el rol solo escribe el drop-in de journald (obs_journald_dropin) y
# reinicia journald cuando ese archivo es más nuevo que su arranque.

- name: Validar la operación pedida
  ansible.builtin.assert:
    that:
      - obs_operation in ['full', 'grafana-access']
      - obs_verify_scope in ['install', 'integration', 'changed']
    fail_msg: "obs_operation debe ser full o grafana-access y obs_verify_scope install, integration o changed."
    quiet: true

# grafana-access: solo la autorización de Grafana (listas), sin tocar el resto del stack
- name: Reconciliar solo el acceso a Grafana
  ansible.builtin.include_tasks: grafana_access.yml
  when: obs_operation == 'grafana-access'

- name: Terminar la operación grafana-access
  ansible.builtin.meta: end_host
  when: obs_operation == 'grafana-access'

- name: Exigir Docker con el plugin Compose
  ansible.builtin.command:
    argv: [docker, compose, version, --short]
  register: obs_compose_cli
  changed_when: false
  failed_when: false

- name: Verificar Docker
  ansible.builtin.assert:
    that: obs_compose_cli.rc == 0
    fail_msg: >-
      docker compose no está disponible en el host (converge instala Docker). No se copió ni
      levantó nada.
    quiet: true

- name: Exigir la red de la aplicación
  ansible.builtin.command:
    argv: [docker, network, inspect, --format, "{{ '{{' }}.Name{{ '}}' }}", "{{ obs_app_network }}"]
  register: obs_app_net
  changed_when: false
  failed_when: false

- name: Verificar que la aplicación está instalada
  ansible.builtin.assert:
    that: obs_app_net.rc == 0
    fail_msg: >-
      No existe la red {{ obs_app_network }}: el stack de métricas se instala después de la
      aplicación (converge). No se copió ni levantó nada.
    quiet: true

- name: Comprobar la política de logs
  ansible.builtin.include_tasks: logs_preflight.yml

- name: Comprobar el acceso a Grafana y las notificaciones
  ansible.builtin.include_tasks: access_alerts_preflight.yml

- name: Preparar el journal del host
  ansible.builtin.include_tasks: journal.yml

- name: Crear los directorios del stack de métricas
  ansible.builtin.file:
    path: "{{ obs_dir }}/{{ item }}"
    state: directory
    owner: "{{ obs_owner }}"
    group: "{{ obs_owner }}"
    mode: "0755"
  loop: "{{ [''] + obs_managed_dirs }}"

# Legibles por todos: los contenedores (nobody, grafana) los leen por bind mount. No contienen
# secretos; el único (contraseña de Grafana) está en .env, solo de su dueño.
- name: Copiar compose.yml y compose.access.yml
  ansible.builtin.copy:
    src: "{{ obs_src_dir }}/{{ item }}"
    dest: "{{ obs_dir }}/{{ item }}"
    owner: "{{ obs_owner }}"
    group: "{{ obs_owner }}"
    mode: "0644"
  loop: [compose.yml, compose.access.yml]

- name: Copiar los directorios de configuración
  ansible.builtin.copy:
    src: "{{ obs_src_dir }}/{{ item }}/"
    dest: "{{ obs_dir }}/{{ item }}/"
    owner: "{{ obs_owner }}"
    group: "{{ obs_owner }}"
    directory_mode: "0755"
    mode: "0644"
  loop: "{{ obs_managed_dirs }}"
  register: obs_config_copy

# Retiro de configuración: un archivo que el repositorio ya no tiene (una regla, un dashboard)
# se borra del host. Solo dentro de obs_managed_dirs.
- name: Listar la configuración del repositorio
  ansible.builtin.find:
    paths: "{{ obs_src_dir }}/{{ item }}"
    recurse: true
    hidden: true
    file_type: file
  loop: "{{ obs_managed_dirs }}"
  register: obs_src_files
  delegate_to: localhost
  become: false

- name: Listar la configuración del host
  ansible.builtin.find:
    paths: "{{ obs_dir }}/{{ item }}"
    recurse: true
    hidden: true
    file_type: any
  loop: "{{ obs_managed_dirs }}"
  register: obs_host_files

- name: Calcular la configuración retirada
  ansible.builtin.set_fact:
    obs_retired: >-
      {%- set out = [] -%}
      {%- for r in obs_host_files.results -%}
        {%- set src = (obs_src_files.results | selectattr('item', 'equalto', r.item) | first).files
                      | map(attribute='path') | map('relpath', obs_src_dir) | list -%}
        {%- for f in r.files | rejectattr('isdir') -%}
          {%- set rel = f.path | relpath(obs_dir) -%}
          {%- if rel not in src -%}{%- set _ = out.append({'dir': r.item, 'path': rel}) -%}{%- endif -%}
        {%- endfor -%}
      {%- endfor -%}
      {{ out }}

- name: Borrar del host la configuración retirada del repositorio
  ansible.builtin.file:
    path: "{{ obs_dir }}/{{ item.path }}"
    state: absent
  loop: "{{ obs_retired }}"
  loop_control:
    label: "{{ item.path }}"

# Contraseña del administrador local de Grafana. La genera el controlador de Ansible (solo
# existe allí durante la tarea, en el temporal de copy) y solo viaja al host si .env no existe
# (force: false): un run posterior no la regenera ni la reescribe. Grafana la aplica solo al crear su base: cambiarla
# después se hace con grafana cli (runbook).
- name: Generar .env del stack (solo si no existe)
  ansible.builtin.copy:
    dest: "{{ obs_dir }}/.env"
    owner: "{{ obs_env_owner }}"
    group: "{{ obs_env_owner }}"
    mode: "0600"
    force: false
    content: |
      OBS_APP_NETWORK={{ obs_app_network }}
      GRAFANA_ADMIN_PASSWORD={{ lookup('ansible.builtin.password', '/dev/null', chars=['ascii_letters', 'digits'], length=32) }}
  no_log: true

# Variables de logs: se mantienen en cada run (a diferencia de la contraseña). Un cambio recrea
# Alloy en el paso de levantar (su configuración de Compose cambia).
- name: Mantener las variables de logs en .env
  ansible.builtin.lineinfile:
    path: "{{ obs_dir }}/.env"
    regexp: "^{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
    owner: "{{ obs_env_owner }}"
    group: "{{ obs_env_owner }}"
    mode: "0600"
  loop:
    - {key: OBS_JOURNAL_GID, value: "{{ obs_journal_gid }}"}
    - {key: OBS_LOG_PROJECT, value: "{{ obs_log_project }}"}
    - {key: OBS_LOG_SERVICES, value: "{{ obs_log_services | join('|') }}"}
  loop_control:
    label: "{{ item.key }}"

# Estado deseado de S3 en .env y webhook de Discord (access_alerts_state.yml)
- name: Guardar el estado deseado de S3 y el webhook
  ansible.builtin.include_tasks: access_alerts_state.yml

# Listas de Grafana (validadas en access_alerts_preflight.yml) en su archivo
- name: Escribir el archivo de acceso de Grafana
  ansible.builtin.include_tasks: grafana_access_file.yml

# Después de copiar y retirar: digest de lo que cada servicio leerá (etiqueta de Compose)
- name: Calcular el digest de la configuración
  ansible.builtin.include_tasks: config_digest.yml

- name: Validar la configuración de Compose
  ansible.builtin.command:
    argv: "{{ ['docker', 'compose', '--project-name', obs_compose_project_name]
              + (obs_compose_files | map('regex_replace', '^', '--file=') | list) + ['config', '--quiet'] }}"
    chdir: "{{ obs_dir }}"
  changed_when: false

- name: Leer los contenedores antes de levantar
  ansible.builtin.command:
    argv: "{{ ['docker', 'compose', '--project-name', obs_compose_project_name]
              + (obs_compose_files | map('regex_replace', '^', '--file=') | list) + ['ps', '-aq'] }}"
    chdir: "{{ obs_dir }}"
  register: obs_containers_before
  changed_when: false

# Compose recrea un servicio cuando cambia su definición: imagen, entorno (.env), compose.yml o
# la etiqueta del digest de su configuración. Así, un reintento tras una interrupción recrea lo
# que quedó pendiente aunque los archivos ya estuvieran escritos, y un run sin cambios no
# recrea nada. Los dashboards los recarga Grafana solo (≤ 60 s), incluido su retiro.
- name: Levantar el stack de métricas
  community.docker.docker_compose_v2:
    project_src: "{{ obs_dir }}"
    project_name: "{{ obs_compose_project_name }}"
    files: "{{ obs_compose_files }}"
    state: present
    pull: missing
    wait: true
    wait_timeout: 180

# Archivos secretos (webhook, acceso de Grafana): por inodo, sin derivar nada de su contenido
- name: Activar los archivos secretos
  ansible.builtin.include_tasks: activate_secrets.yml
  vars:
    obs_activate_services: [alertmanager, grafana]

- name: Leer los contenedores después de activar
  ansible.builtin.command:
    argv: "{{ ['docker', 'compose', '--project-name', obs_compose_project_name]
              + (obs_compose_files | map('regex_replace', '^', '--file=') | list) + ['ps', '-aq'] }}"
    chdir: "{{ obs_dir }}"
  register: obs_containers_after
  changed_when: false

- name: Verificar la activación (digests, archivos e imágenes en ejecución)
  ansible.builtin.include_tasks: verify_activation.yml

- name: Verificar la recolección y los dashboards
  ansible.builtin.include_tasks: verify.yml

- name: Verificar la canalización de logs
  ansible.builtin.include_tasks: verify_logs.yml
  when: obs_verify_logs_pipeline | bool

- name: Verificar las notificaciones y el acceso a Grafana
  ansible.builtin.include_tasks: verify_access_alerts.yml
