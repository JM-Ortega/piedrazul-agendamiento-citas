---
- name: Eliminar paquetes conflictivos de Docker si existen
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose
      - docker-compose-v2
      - docker-doc
      - podman-docker
      - containerd
      - runc
    state: absent
    purge: true

- name: Mapear arquitectura a formato Debian
  ansible.builtin.set_fact:
    docker_host_apt_arch: >-
      {{
        {
          'x86_64': 'amd64',
          'aarch64': 'arm64',
          'armv7l': 'armhf'
        }.get(ansible_architecture, ansible_architecture)
      }}

- name: Crear directorio para GPG key de Docker
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Descargar GPG key oficial de Docker
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Agregar repositorio oficial de Docker
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ docker_host_apt_arch }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu
      {{ ansible_distribution_release }} stable
    state: present
    filename: docker

- name: Instalar Docker CE y plugin Compose
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true
  notify: Restart Docker daemon

- name: Asegurar que Docker está habilitado y corriendo
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Agregar usuario ansible al grupo docker
  ansible.builtin.user:
    name: ansible
    groups: docker
    append: true

- name: Asegurar directorio de configuración de Docker
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    mode: "0755"

- name: Configurar Docker daemon
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "10m",
          "max-file": "3"
        },
        "live-restore": true,
        "default-ulimits": {
          "nofile": {
            "Name": "nofile",
            "Hard": 65536,
            "Soft": 65536
          }
        }
      }
    mode: "0644"
  notify: Restart Docker daemon

# El reinicio del daemon va ahora, antes de que exista cualquier contenedor, y no al final del play
# (donde Ansible vacía los handlers por defecto): reiniciar con contenedores ya creados los
# detiene a todos —live-restore solo protege si el daemon que se detiene ya lo tenía— y deja
# invalidadas las verificaciones de readiness hechas antes. Además, los valores por defecto de
# daemon.json (rotación de logs, ulimits) solo los heredan los contenedores creados después.
# Este role tiene un único handler (Restart Docker daemon); si se agrega otro, también se vacía
# aquí. Un handler que falla detiene el play. Sin cambios en este converge no hay notificación
# y no se reinicia nada.
- name: Aplicar la configuración de Docker antes de crear contenedores
  ansible.builtin.meta: flush_handlers

# Acotado y por estado (no una espera fija): el reinicio vuelve antes de que el socket responda
- name: Esperar a que el daemon de Docker responda con la configuración vigente
  ansible.builtin.command:
    argv:
      - docker
      - info
      - --format
      - "{% raw %}{{.LiveRestoreEnabled}} {{.LoggingDriver}}{% endraw %}"
  register: docker_host_info
  until: docker_host_info.rc == 0
  retries: 15
  delay: 2
  changed_when: false

# Si el daemon respondió pero no con lo que declara daemon.json, el reinicio no se aplicó
- name: Verificar que el daemon corre con la configuración de daemon.json
  ansible.builtin.assert:
    that:
      - docker_host_info.stdout | trim == 'true json-file'
    fail_msg: >-
      DOCKER: el daemon responde pero no corre con /etc/docker/daemon.json
      (live-restore y driver json-file esperados; informado: '{{ docker_host_info.stdout | trim }}').
      No se creó ningún contenedor.
    quiet: true
