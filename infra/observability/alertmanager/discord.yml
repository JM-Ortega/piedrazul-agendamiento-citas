# Alertmanager con Discord (OBS_ALERT_RECEIVER=discord). Recibe de Prometheus las alertas de
# prometheus/rules y las envía al webhook del secreto discord_webhook_url. Compose monta ese archivo:
# reemplazarlo (escritura atómica) exige recrear el contenedor, y el rol de Ansible lo hace al
# rotarlo. Ver docs/operations/runbooks/alertas.md.
#
# Semántica: Prometheus decide qué dispara y cuándo (expr, for); aquí solo se decide cómo se
# notifica. Ninguna regla se silencia ni se inhibe por configuración.
#
# Entrega: un mensaje por grupo (alertname) con las alertas en firing y, al resolverse, otro de
# resolución. Un fallo de Discord (5xx, 429, red) se reintenta con espera creciente hasta el
# siguiente ciclo del grupo; lo que sigue fallando cuenta en
# alertmanager_notifications_failed_total y dispara PiedrazulAlertNotificationsFailing (visible
# en Grafana aunque Discord no reciba nada). No hay mensaje periódico de "todo bien": lo que no
# se ve desde dentro (Prometheus, Alertmanager o el host caídos, o el webhook revocado sin nada
# que enviar) no llega a Discord.
global:
  resolve_timeout: 5m

templates:
  - /etc/alertmanager/templates/*.tmpl

route:
  receiver: discord
  group_by: [alertname]
  # Primer aviso de un grupo nuevo: espera breve para juntar las alertas que disparan juntas
  group_wait: 30s
  # Cambios en un grupo ya notificado (nueva alerta, resolución)
  group_interval: 5m
  # Recordatorio de lo que sigue en firing
  repeat_interval: 12h

receivers:
  - name: discord
    discord_configs:
      - webhook_url_file: /run/secrets/discord_webhook_url
        send_resolved: true
        title: '{{ template "piedrazul.discord.title" . }}'
        message: '{{ template "piedrazul.discord.message" . }}'
