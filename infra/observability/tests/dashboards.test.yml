  # ── Logs 18: alertas de la canalización de logs ─────────────────────────────
  - name: "Logs 18: grupo piedrazul-logs al día y sin alertas → 0"
    interval: 1m
    input_series:
      - series: 'prometheus_rule_group_last_evaluation_timestamp_seconds{job="prometheus", instance="localhost:9090", rule_group="/etc/prometheus/rules/logs.yml;piedrazul-logs"}'
        values: '0+60x10'
      - series: 'prometheus_rule_group_last_evaluation_timestamp_seconds{job="prometheus", instance="localhost:9090", rule_group="/etc/prometheus/rules/alerts.yml;piedrazul-host"}'
        values: '0+60x10'
    promql_expr_test:
      - expr: 'count(ALERTS{alertstate="firing", alertname=~"PiedrazulLoki.*|PiedrazulLogs.*|PiedrazulAlloyComponentUnhealthy"}) or on() (0 * (max(time() - prometheus_rule_group_last_evaluation_timestamp_seconds{job="prometheus", rule_group=~".+/logs.yml;piedrazul-logs"}) < 120))'
        eval_time: 5m
        exp_samples:
          - labels: '{}'
            value: 0

