  - name: "Logs 15 B: los 204 (envío correcto) no se dibujan; los 429 sí"
    interval: 1m
    input_series:
      - series: 'loki_write_request_duration_seconds_count{job="alloy", instance="alloy:12345", component_id="loki.write.default", host="loki:3100", status_code="204"}'
        values: '0+60x10'
      - series: 'loki_write_request_duration_seconds_count{job="alloy", instance="alloy:12345", component_id="loki.write.default", host="loki:3100", status_code="429"}'
        values: '0+6x10'
    promql_expr_test:
      - expr: 'sum by (status_code) (rate(loki_write_request_duration_seconds_count{job="alloy", status_code!~"2.."}[2m]))'
