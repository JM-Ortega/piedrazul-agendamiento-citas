# Stack privado de observabilidad: Prometheus, Grafana, Alloy (métricas del host y logs del
# journal) y Loki. Proyecto Compose propio, separado de la aplicación (prod.yml /
# docker-compose.yml): se levanta, reinicia o baja sin tocar ningún servicio de la aplicación, y
# ningún servicio de la aplicación depende de él. Sin trazas.
#
# Conectividad privada:
#   - obs_net (propia): prometheus, grafana, alloy y loki.
#   - red de la aplicación (externa, OBS_APP_NETWORK, piedrazul_net por defecto): solo
#     prometheus, para leer backend:8081, keycloak:9000 y traefik:8082 por nombre. Debe
#     existir antes (la crea la aplicación); si no existe, `up` falla sin crear nada.
# Ningún puerto publicado salvo Grafana en loopback del host (acceso local o por túnel SSH). Sin
# socket de Docker ni contenedores privilegiados. Loki solo en obs_net.
#
# Logs: Alloy lee el journal persistente del host (solo lectura, con el grupo dueño del journal)
# y envía a Loki solo las fuentes seleccionadas (alloy/config.alloy). Qué contenedores escriben
# en el journal lo decide cada archivo Compose de la aplicación (logging.driver), no este.
#
# Uso (desde este directorio, con .env creado a partir de .env.example):
#   docker compose up -d
# Ver docs/operations/runbooks/metricas.md y docs/operations/runbooks/logs.md.
name: piedrazul-obs

networks:
  obs_net:
  app_net:
    name: ${OBS_APP_NETWORK:-piedrazul_net}
    external: true

volumes:
  prometheus_data:
  grafana_data:
  # Chunks, índice, WAL y compactor de Loki
  loki_data:
  # Posiciones de lectura del journal (y demás estado de Alloy)
  alloy_data:

services:
  prometheus:
    # Referencia fijada: <tag>@sha256:<índice OCI>
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Retención: lo que se cumpla primero. Para cumplir el tamaño Prometheus solo borra bloques
      # persistidos; el WAL, el head y una compactación en curso pueden llevar el volumen por
      # encima de ese valor: no es un tope duro del disco.
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-30d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-2GB}
      - --storage.tsdb.wal-compression
      # Sin API de administración (borrado de series, snapshots) ni recepción remota
      - --web.listen-address=:9090
    volumes:
      # Directorios, no archivos sueltos: una escritura atómica (Ansible, editores) cambia el
      # inodo y un montaje de archivo seguiría viendo el anterior
      - ./prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - obs_net
      - app_net

  grafana:
    image: grafana/grafana:13.3.0@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD es requerido (ver .env.example)}
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: http://localhost:${GRAFANA_LOCAL_PORT:-3000}/
      # Sin telemetría, avisos de versión, noticias ni plugins preinstalados (las conexiones
      # salientes que harían). La red del contenedor no restringe otras salidas.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      # Las alertas las evalúa Prometheus (prometheus/rules). Grafana no gestiona reglas ni
      # puntos de contacto.
      GF_UNIFIED_ALERTING_ENABLED: "false"
      GF_LOG_MODE: console
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana-dashboards:ro
      - grafana_data:/var/lib/grafana
    tmpfs:
      - /tmp
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512m
    # Solo loopback del host: acceso local o por túnel SSH, nunca en una interfaz pública
    ports:
      - "127.0.0.1:${GRAFANA_LOCAL_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - obs_net

  alloy:
    image: grafana/alloy:v1.21.3@sha256:8ab871206bd2d8f89277f53abffee5f452a293980788d52f85fa183a87a505a4
    restart: unless-stopped
    # Nombre fijo: es el nodename de node_uname_info; el id del contenedor cambiaría al recrearlo
    hostname: piedrazul-obs-alloy
    command:
      - run
      - /etc/alloy/config.alloy
      # Estado persistente: posiciones de lectura del journal. Sin WAL de métricas ni de logs.
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
      - --disable-reporting
    # Sin root: /proc, /sys y la raíz del host solo se leen (estadísticas, statfs y el journal);
    # los archivos del host que no son legibles por cualquiera ni por los grupos de abajo siguen
    # sin serlo
    user: "65534:65534"
    # Grupos suplementarios, solo estos dos:
    #   - 473: dueño de /var/lib/alloy/data en la imagen (0770); un volumen nuevo hereda ese
    #     dueño y modo, y así nobody puede escribir las posiciones. En el host ese GID no debe
    #     pertenecer a ningún grupo (el rol de Ansible lo comprueba).
    #   - OBS_JOURNAL_GID: grupo dueño de los archivos del journal del host (systemd-journal en
    #     Ubuntu). Por defecto 65534 (nogroup), que no da acceso: sin él, Alloy no lee el
    #     journal (sd-journal omite sin error los archivos ilegibles; el componente sigue sano
    #     y no lee nada), sin afectar a las métricas.
    group_add:
      - "473"
      - "${OBS_JOURNAL_GID:-65534}"
    environment:
      # Selección de fuentes (alloy/config.alloy): proyecto Compose de la aplicación y servicios
      # cuyos logs se envían a Loki (expresión regular, alternativas con |)
      OBS_LOG_PROJECT: ${OBS_LOG_PROJECT:-piedrazul}
      OBS_LOG_SERVICES: ${OBS_LOG_SERVICES:-traefik}
      # El recolector de Go devuelve memoria antes de llegar al límite del contenedor
      GOMEMLIMIT: 200MiB
    volumes:
      - ./alloy:/etc/alloy:ro
      - alloy_data:/var/lib/alloy/data
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      # Incluye el journal persistente del host (/var/log/journal)
      - /:/host/root:ro
    tmpfs:
      - /tmp
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256m
    networks:
      - obs_net

  loki:
    # Referencia fijada: <tag>@sha256:<índice OCI>
    image: grafana/loki:3.7.9@sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/config.yaml
    # Usuario de la imagen (10001, dueño de /loki): el volumen nuevo hereda ese dueño
    user: "10001:10001"
    environment:
      # El recolector de Go devuelve memoria antes de llegar al límite del contenedor
      GOMEMLIMIT: 640MiB
    volumes:
      - ./loki:/etc/loki:ro
      - loki_data:/loki
    tmpfs:
      - /tmp
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 768m
    # Sin healthcheck de Compose: la imagen no trae shell, wget ni subcomando de salud. La
    # disponibilidad la miden Prometheus (up{job="loki"}) y el rol de Ansible (/ready desde
    # Prometheus).
    networks:
      - obs_net
