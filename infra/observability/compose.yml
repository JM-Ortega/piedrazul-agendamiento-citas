# Stack privado de observabilidad: Prometheus, Grafana, Alloy (métricas del host y logs del
# journal), Loki y Alertmanager (notificaciones de las alertas de Prometheus). Proyecto Compose propio, separado de la aplicación (prod.yml /
# docker-compose.yml): se levanta, reinicia o baja sin tocar ningún servicio de la aplicación, y
# ningún servicio de la aplicación depende de él. Sin trazas.
#
# Conectividad privada:
#   - obs_net (propia): prometheus, grafana, alloy, loki y alertmanager.
#   - red de la aplicación (externa, OBS_APP_NETWORK, piedrazul_net por defecto): solo
#     prometheus, para leer backend:8081, keycloak:9000 y traefik:8082 por nombre. Debe
#     existir antes (la crea la aplicación); si no existe, `up` falla sin crear nada.
#   - red de entrada de Grafana (piedrazul_obs_edge): solo con el acceso público, en
#     compose.access.yml. Este archivo solo (modo privado, S1/S2) no la necesita.
# Ningún puerto publicado salvo Grafana en loopback del host (acceso local o por túnel SSH). Sin
# socket de Docker ni contenedores privilegiados. Loki y Alertmanager solo en obs_net.
#
# Acceso de operadores a Grafana (docs/operations/runbooks/grafana-acceso.md): por
# grafana.<dominio> detrás de Cloudflare Access, que Grafana valida (JWT de Access: firma, emisor,
# audiencia, tipo y expiración) y autoriza por lista de correos; o por túnel SSH al loopback con
# el administrador local (recuperación). GRAFANA_ACCESS_ENABLED=false (por defecto) deja solo el
# túnel. Con el acceso público se usa además compose.access.yml (COMPOSE_FILE en .env).
#
# Logs: Alloy lee el journal persistente del host (solo lectura, con el grupo dueño del journal)
# y envía a Loki solo las fuentes seleccionadas (alloy/config.alloy). Qué contenedores escriben
# en el journal lo decide cada archivo Compose de la aplicación (logging.driver), no este.
#
# Uso (desde este directorio, con .env creado a partir de .env.example):
#   docker compose up -d
# Ver docs/operations/runbooks/metricas.md y docs/operations/runbooks/logs.md.
name: piedrazul-obs

networks:
  obs_net:
  app_net:
    name: ${OBS_APP_NETWORK:-piedrazul_net}
    external: true

# Webhook de Discord (secreto). Archivo del host, nunca en .env ni en el repositorio; debe
# existir aunque OBS_ALERT_RECEIVER=none (vacío). Solo Alertmanager lo monta.
secrets:
  discord_webhook_url:
    file: ${OBS_DISCORD_WEBHOOK_FILE:-./secrets/discord_webhook_url}

volumes:
  prometheus_data:
  grafana_data:
  # Silencios y registro de notificaciones enviadas (evita repetirlas tras un reinicio)
  alertmanager_data:
  # Chunks, índice, WAL y compactor de Loki
  loki_data:
  # Posiciones de lectura del journal (y demás estado de Alloy)
  alloy_data:

services:
  prometheus:
    # Referencia fijada: <tag>@sha256:<índice OCI>
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    restart: unless-stopped
    environment:
      # Etiqueta externa environment (prometheus.yml): identifica el origen en cada alerta que
      # se envía a Alertmanager (y en los mensajes de Discord). No toca reglas ni series.
      OBS_ENVIRONMENT: ${OBS_ENVIRONMENT:-sin-definir}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Retención: lo que se cumpla primero. Para cumplir el tamaño Prometheus solo borra bloques
      # persistidos; el WAL, el head y una compactación en curso pueden llevar el volumen por
      # encima de ese valor: no es un tope duro del disco.
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-30d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-2GB}
      - --storage.tsdb.wal-compression
      # Sin API de administración (borrado de series, snapshots) ni recepción remota
      - --web.listen-address=:9090
    volumes:
      # Directorios, no archivos sueltos: una escritura atómica (Ansible, editores) cambia el
      # inodo y un montaje de archivo seguiría viendo el anterior
      - ./prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - obs_net
      - app_net

  grafana:
    image: grafana/grafana:13.3.0@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD es requerido (ver .env.example)}
      # Correo reservado (TLD .invalid) del administrador local: ninguna identidad de Access
      # puede tenerlo, así que un JWT nunca se vincula a esta cuenta. Grafana lo aplica solo al
      # crear su base (como la contraseña).
      GF_SECURITY_ADMIN_EMAIL: admin@piedrazul-obs.invalid
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SECURITY_COOKIE_SAMESITE: strict
      # Cookies solo por HTTPS; los navegadores y curl tratan http://localhost (túnel) como
      # contexto seguro, así que el inicio de sesión local sigue funcionando
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # URL pública (https://grafana.<dominio>/ con Access) o el loopback del túnel
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:${GRAFANA_LOCAL_PORT:-3000}/}
      # ── Cloudflare Access (JWT) ──
      # Cada petición trae Cf-Access-Jwt-Assertion (lo pone Access); Grafana valida firma
      # (JWKS del equipo de Access), iss, aud, type=app y exp, y no crea sesión: la identidad se
      # revalida en cada petición. Sin cabecera o con un JWT inválido no hay acceso por esta vía.
      GF_AUTH_JWT_ENABLED: ${GRAFANA_ACCESS_ENABLED:-false}
      GF_AUTH_JWT_HEADER_NAME: Cf-Access-Jwt-Assertion
      GF_AUTH_JWT_JWK_SET_URL: https://${GRAFANA_ACCESS_TEAM_DOMAIN:-access.invalid}/cdn-cgi/access/certs
      # Grafana guarda el JWKS en su base (sobrevive a reinicios) durante este plazo: es lo que
      # tarda en aceptar una clave rotada por Access y lo que tolera sin alcanzar el JWKS antes de
      # rechazar los JWT nuevos (falla cerrado; el túnel sigue funcionando)
      GF_AUTH_JWT_CACHE_TTL: 5m
      GF_AUTH_JWT_EXPECT_CLAIMS: '{"iss":"https://${GRAFANA_ACCESS_TEAM_DOMAIN:-access.invalid}","aud":"${GRAFANA_ACCESS_AUD:-}","type":"app"}'
      GF_AUTH_JWT_EMAIL_CLAIM: email
      GF_AUTH_JWT_USERNAME_CLAIM: email
      GF_AUTH_JWT_AUTO_SIGN_UP: "true"
      GF_AUTH_JWT_URL_LOGIN: "false"
      # Autorización: rol de organización solo por lista de correos (minúsculas, separados por
      # comas). Editor antes que Viewer; un correo fuera de ambas, con comas (no podría
      # compararse contra la lista) o un token sin exp no obtiene rol y, con strict, se rechaza
      # (403). Nunca Admin ni administrador del servidor por JWT: la administración de Grafana es
      # del administrador local (túnel).
      GF_AUTH_JWT_ROLE_ATTRIBUTE_PATH: >-
        exp && !contains(email, ',') && (
        contains(',${GRAFANA_ACCESS_EDITORS:-},', join('', [',', lower(email), ','])) && 'Editor'
        || contains(',${GRAFANA_ACCESS_VIEWERS:-},', join('', [',', lower(email), ','])) && 'Viewer'
        ) || ''
      GF_AUTH_JWT_ROLE_ATTRIBUTE_STRICT: "true"
      GF_AUTH_JWT_SKIP_ORG_ROLE_SYNC: "false"
      GF_AUTH_JWT_ALLOW_ASSIGN_GRAFANA_ADMIN: "false"
      # Sin accesos por enlace que no pasen por la lista: snapshots y dashboards compartidos
      # públicamente se ven sin JWT (solo con el enlace)
      GF_SNAPSHOTS_ENABLED: "false"
      GF_PUBLIC_DASHBOARDS_ENABLED: "false"
      # Sin telemetría, avisos de versión, noticias ni plugins preinstalados (las conexiones
      # salientes que harían). La red del contenedor no restringe otras salidas; con Access,
      # Grafana descarga el JWKS de <equipo>.cloudflareaccess.com por obs_net.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      # Las alertas las evalúa Prometheus (prometheus/rules) y las notifica Alertmanager.
      # Grafana no gestiona reglas ni puntos de contacto.
      GF_UNIFIED_ALERTING_ENABLED: "false"
      GF_LOG_MODE: console
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana-dashboards:ro
      - grafana_data:/var/lib/grafana
    tmpfs:
      - /tmp
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512m
    # Solo loopback del host: acceso local o por túnel SSH, nunca en una interfaz pública
    ports:
      - "127.0.0.1:${GRAFANA_LOCAL_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - obs_net

  alloy:
    image: grafana/alloy:v1.21.3@sha256:8ab871206bd2d8f89277f53abffee5f452a293980788d52f85fa183a87a505a4
    restart: unless-stopped
    # Nombre fijo: es el nodename de node_uname_info; el id del contenedor cambiaría al recrearlo
    hostname: piedrazul-obs-alloy
    command:
      - run
      - /etc/alloy/config.alloy
      # Estado persistente: posiciones de lectura del journal. Sin WAL de métricas ni de logs.
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
      - --disable-reporting
    # Sin root: /proc, /sys y la raíz del host solo se leen (estadísticas, statfs y el journal);
    # los archivos del host que no son legibles por cualquiera ni por los grupos de abajo siguen
    # sin serlo
    user: "65534:65534"
    # Grupos suplementarios, solo estos dos:
    #   - 473: dueño de /var/lib/alloy/data en la imagen (0770); un volumen nuevo hereda ese
    #     dueño y modo, y así nobody puede escribir las posiciones. En el host ese GID no debe
    #     pertenecer a ningún grupo (el rol de Ansible lo comprueba).
    #   - OBS_JOURNAL_GID: grupo dueño de los archivos del journal del host (systemd-journal en
    #     Ubuntu). Por defecto 65534 (nogroup), que no da acceso: sin él, Alloy no lee el
    #     journal (sd-journal omite sin error los archivos ilegibles; el componente sigue sano
    #     y no lee nada), sin afectar a las métricas.
    group_add:
      - "473"
      - "${OBS_JOURNAL_GID:-65534}"
    environment:
      # Selección de fuentes (alloy/config.alloy): proyecto Compose de la aplicación y servicios
      # cuyos logs se envían a Loki (expresión regular, alternativas con |)
      OBS_LOG_PROJECT: ${OBS_LOG_PROJECT:-piedrazul}
      OBS_LOG_SERVICES: ${OBS_LOG_SERVICES:-traefik}
      # El recolector de Go devuelve memoria antes de llegar al límite del contenedor
      GOMEMLIMIT: 200MiB
    volumes:
      - ./alloy:/etc/alloy:ro
      - alloy_data:/var/lib/alloy/data
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      # Incluye el journal persistente del host (/var/log/journal)
      - /:/host/root:ro
    tmpfs:
      - /tmp
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256m
    networks:
      - obs_net

  loki:
    # Referencia fijada: <tag>@sha256:<índice OCI>
    image: grafana/loki:3.7.9@sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/config.yaml
    # Usuario de la imagen (10001, dueño de /loki): el volumen nuevo hereda ese dueño
    user: "10001:10001"
    environment:
      # El recolector de Go devuelve memoria antes de llegar al límite del contenedor
      GOMEMLIMIT: 640MiB
    volumes:
      - ./loki:/etc/loki:ro
      - loki_data:/loki
    tmpfs:
      - /tmp
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 768m
    # Sin healthcheck de Compose: la imagen no trae shell, wget ni subcomando de salud. La
    # disponibilidad la miden Prometheus (up{job="loki"}) y el rol de Ansible (/ready desde
    # Prometheus).
    networks:
      - obs_net

  # Notificaciones de las alertas que evalúa Prometheus (prometheus/rules): agrupa, deduplica,
  # reintenta y envía disparos y resoluciones al receptor de OBS_ALERT_RECEIVER: discord (webhook
  # del secreto discord_webhook_url) o none (no envía; por defecto). Sin clúster ni puerto
  # publicado; solo Prometheus le habla, por obs_net. Ver docs/operations/runbooks/alertas.md.
  alertmanager:
    # Referencia fijada: <tag>@sha256:<índice OCI>
    image: prom/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/${OBS_ALERT_RECEIVER:-none}.yml
      - --storage.path=/alertmanager
      - --web.listen-address=:9093
      # Una sola instancia: sin gossip de clúster
      - --cluster.listen-address=
    # Usuario de la imagen (nobody, dueño de /alertmanager): el volumen nuevo hereda ese dueño.
    # El secreto del host debe ser legible por este UID (el rol de Ansible lo deja 0400 suyo).
    user: "65534:65534"
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
      - alertmanager_data:/alertmanager
    secrets:
      - discord_webhook_url
    tmpfs:
      - /tmp
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 64m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9093/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - obs_net
