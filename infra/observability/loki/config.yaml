# Loki de un solo proceso (target all), privado en obs_net: sin puerto publicado, sin red de la
# aplicación. Un solo tenant (auth_enabled: false): solo lo alcanzan Alloy (escritura), Grafana y
# Prometheus (lectura y métricas) por obs_net.
#
# Almacenamiento: sistema de archivos local en el volumen loki_data (/loki). La retención es por
# antigüedad (compactor): no es un tope del disco. Ver docs/operations/runbooks/logs.md.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9095
  log_level: warn
  log_format: logfmt
  # Cuerpo máximo de una petición de escritura (lote de Alloy) y de una respuesta de consulta
  grpc_server_max_recv_msg_size: 8388608
  grpc_server_max_send_msg_size: 8388608
  http_server_read_timeout: 60s
  http_server_write_timeout: 60s

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: "2026-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

ingester:
  # WAL en el volumen: lo recibido y aún no volcado a chunks sobrevive a un reinicio. La
  # reproducción al arrancar se detiene al llegar a este tope de memoria y vuelca a disco antes
  # de seguir; queda por debajo del límite del contenedor (768 MiB en compose.yml).
  wal:
    enabled: true
    dir: /loki/wal
    flush_on_shutdown: true
    replay_memory_ceiling: 384MB
  chunk_idle_period: 30m
  max_chunk_age: 2h
  chunk_target_size: 1572864
  chunk_encoding: snappy

limits_config:
  # Retención global: lo más antiguo lo borra el compactor (ver compactor)
  retention_period: 336h
  # Escritura acotada: un productor desbocado recibe 429 (Alloy reintenta y luego descarta) en
  # vez de llenar la memoria o el disco
  ingestion_rate_mb: 4
  ingestion_burst_size_mb: 8
  per_stream_rate_limit: 2MB
  per_stream_rate_limit_burst: 4MB
  max_line_size: 256KB
  max_line_size_truncate: true
  max_label_names_per_series: 8
  max_global_streams_per_user: 1000
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  creation_grace_period: 10m
  # Metadatos estructurados (container_id, correlation_id) en vez de etiquetas
  allow_structured_metadata: true
  # La severidad la extrae Alloy solo donde el formato es conocido; sin heurística de Loki
  discover_log_levels: false
  discover_service_name: []
  # Consultas acotadas: rango máximo = retención, pocas series y líneas por respuesta
  max_query_length: 337h
  max_query_lookback: 336h
  max_query_series: 500
  max_entries_limit_per_query: 5000
  max_query_parallelism: 4
  query_timeout: 1m
  split_queries_by_interval: 1h

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 50
  # Solicitudes de borrado (API de Loki) en el mismo sistema de archivos; obligatorio con
  # retention_enabled
  delete_request_store: filesystem

query_range:
  cache_results: true
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 32

chunk_store_config:
  chunk_cache_config:
    embedded_cache:
      enabled: true
      max_size_mb: 64

frontend:
  max_outstanding_per_tenant: 256

querier:
  max_concurrent: 4

# Sin reglas de Loki: las alertas las evalúa Prometheus
ruler:
  storage:
    type: local
    local:
      directory: /loki/rules

pattern_ingester:
  enabled: false

analytics:
  reporting_enabled: false
