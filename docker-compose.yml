name: ${PROJECT_NAME}

networks:
  piedrazul_net:
    name: piedrazul_net

include:
  - ./infra/compose/db.yml
  - ./infra/compose/keycloak.yml

services:
  postgres:
    ports:
      - "${DB_PORT}:5432"

  keycloak:
    command: ["start-dev", "--import-realm"]
    environment:
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "${KC_PORT}:${KC_PORT}"
