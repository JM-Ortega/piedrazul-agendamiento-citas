<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Código de verificación</title>
</head>
<body style="margin:0;padding:0;background-color:#f5f5f5;font-family:Arial,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" role="presentation">
    <tr>
      <td align="center" style="padding:24px 12px;">
        <table width="100%" cellpadding="0" cellspacing="0" role="presentation" style="max-width:600px;background:#ffffff;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.08);">
          <tr>
            <td style="background-color:#215c98;padding:24px 32px;">
              <p style="margin:0;color:#ffffff;font-size:20px;font-weight:bold;">Piedra Azul Salud</p>
              <p style="margin:4px 0 0;color:#e5eef9;font-size:14px;">Centro Médico</p>
            </td>
          </tr>
          <tr>
            <td style="padding:32px 24px;text-align:center;">
              <p style="margin:0 0 8px;font-size:22px;font-weight:bold;color:#1a1a1a;">Código de verificación</p>
              <p style="margin:0 0 32px;color:#666666;font-size:15px;">Usa este código para verificar tu identidad.</p>
              <table width="100%" cellpadding="0" cellspacing="0" role="presentation">
                <tr>
                  <td align="center">
                    <div style="display:inline-block;padding:16px 20px;background:#eef4fb;border-radius:8px;border:2px solid #215c98;">
                      <span style="font-size:32px;font-weight:bold;letter-spacing:6px;color:#215c98;">{{code}}</span>
                    </div>
                  </td>
                </tr>
              </table>
              <p style="margin:24px 0 0;font-size:14px;color:#555555;">Este código expira en <strong>{{expirationMinutes}} minutos</strong>.</p>
              <p style="margin:8px 0 0;font-size:13px;color:#666666;">Si no solicitaste este código, ignora este mensaje.</p>
            </td>
          </tr>
          <tr>
            <td style="background:#f9f9f9;padding:16px 32px;border-top:1px solid #eeeeee;">
              <p style="margin:0;font-size:12px;color:#666666;text-align:center;">Piedra Azul Salud · Centro Médico</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
</table>
</body>
</html>
