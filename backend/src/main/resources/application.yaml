spring:
  application:
    name: backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:piedrazul_db}
    username: ${APP_DB_USERNAME:piedrazul_app}
    password: ${APP_DB_PASSWORD:piedrazul_app}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    user: ${MIGRATION_DB_USERNAME:piedrazul_migration}
    password: ${MIGRATION_DB_PASSWORD:piedrazul_migration}
    default-schema: ${DB_SCHEMA:piedrazul}
    schemas: ${DB_SCHEMA:piedrazul},extensions
    locations: classpath:db/migration
    clean-disabled: true
    validate-on-migrate: true
    baseline-on-migrate: false

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL:false}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KC_ISSUER_URI:http://localhost:8180/realms/piedrazul}

  web:
    error:
      include-stacktrace: ${ERROR_INCLUDE_STACKTRACE:never}
      include-message: ${ERROR_INCLUDE_MESSAGE:always}

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:10MB}

  modulith:
    events:
      completion-mode: archive
      republish-outstanding-events-on-restart: true
      jdbc:
        schema-initialization:
          enabled: false


server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:framework}

app:
  timezone: ${APP_TIMEZONE:America/Bogota}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

  seed:
    identity:
      enabled: ${IDENTITY_SEED_ENABLED:false}

      admin:
        username: ${IDENTITY_SEED_ADMIN_USERNAME:}
        identification-type: ${IDENTITY_SEED_ADMIN_IDENTIFICATION_TYPE:CEDULA}
        first-name: ${IDENTITY_SEED_ADMIN_FIRST_NAME:}
        last-name: ${IDENTITY_SEED_ADMIN_LAST_NAME:}
        email: ${IDENTITY_SEED_ADMIN_EMAIL:}
        phone: ${IDENTITY_SEED_ADMIN_PHONE:}
        password: ${IDENTITY_SEED_ADMIN_PASSWORD:}

keycloak:
  server-url: ${KC_SERVER_URL:http://localhost:8180}
  realm: ${KC_REALM:piedrazul}
  client-id: ${KC_BACKEND_CLIENT_ID:piedrazul-backend}
  client-secret: ${KC_BACKEND_CLIENT_SECRET:}

notifications:
  encryption:
    key: ${NOTIFICATION_ENCRYPTION_KEY:}

  console:
    show-sensitive-content: ${NOTIFICATIONS_CONSOLE_SHOW_SENSITIVE:false}
  email:
    sendgrid:
      enabled: ${NOTIFICATIONS_SENDGRID_ENABLED:false}
      api-key: ${SENDGRID_API_KEY:}
      from-email: ${NOTIFICATIONS_EMAIL_FROM:no-reply@piedrazul.org}
      from-name: ${NOTIFICATIONS_EMAIL_FROM_NAME:Piedrazul}
      sandbox-mode: ${SENDGRID_SANDBOX_MODE:true}


  due-job:
    fixed-delay: ${NOTIFICATIONS_DUE_JOB_FIXED_DELAY:30000}

  stale-attempt:
    enabled: ${NOTIFICATIONS_STALE_ATTEMPT_ENABLED:true}
    fixed-delay: ${NOTIFICATIONS_STALE_ATTEMPT_FIXED_DELAY:300000}
    thresholds:
      email: ${NOTIFICATIONS_STALE_EMAIL_THRESHOLD:6h}
      sms: ${NOTIFICATIONS_STALE_SMS_THRESHOLD:30m}
      whatsapp: ${NOTIFICATIONS_STALE_WHATSAPP_THRESHOLD:30m}
      default: ${NOTIFICATIONS_STALE_DEFAULT_THRESHOLD:2h}


management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_EXPOSED_ENDPOINTS:health,info}

  endpoint:
    health:
      show-details: ${MANAGEMENT_HEALTH_DETAILS:when-authorized}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    org.springframework.security: ${LOG_LEVEL_SECURITY:INFO}
    org.hibernate.SQL: ${LOG_LEVEL_SQL:WARN}
    org.hibernate.orm.jdbc.bind: ${LOG_LEVEL_SQL_BIND:WARN}
    org.springframework.modulith: ${LOG_LEVEL_MODULITH:WARN}

resilience4j:
  circuitbreaker:
    instances:
      sendgrid:
        sliding-window-size: ${RESILIENCE4J_SENDGRID_WINDOW_SIZE:10}
        failure-rate-threshold: ${RESILIENCE4J_SENDGRID_FAILURE_RATE:50}
        wait-duration-in-open-state: ${RESILIENCE4J_SENDGRID_WAIT_DURATION:30s}
        permitted-number-of-calls-in-half-open-state: ${RESILIENCE4J_SENDGRID_HALF_OPEN_CALLS:3}
        register-health-indicator: true