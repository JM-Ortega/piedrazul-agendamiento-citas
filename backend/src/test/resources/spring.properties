# Máximo de contextos de Spring vivos a la vez en la caché de tests (por defecto, 32).
# Casi cada *IT arma su propio contexto y cada uno abre un pool Hikari de 10 conexiones contra
# el único PostgreSQL de Testcontainers (max_connections=100): sin este tope, a partir del
# décimo contexto cacheado el resto de clases falla con "too many clients already".
# Al salir de la caché el contexto se cierra y libera su pool. El pool no se achica porque los
# tests de concurrencia (Verification*IT) necesitan varias conexiones simultáneas.
spring.test.context.cache.maxSize=4
